\"><div class=\"pt\" style=\"{}\"></div><figcaption><b>{}</b>{}. {}</figcaption>{}</figure>","<section class=\"title\">\n    <div class=\"scene\" style=\"{}\"><div class=\"veil\"></div><div class=\"cap\"><div><div class=\"big\">深渊三骰</div><p style=\"max-width:52ch;text-shadow:0 2px 6px #000\">你在深渊口镇当中间人，养着一支三个人的小队。每个人一颗骰子，六个面写着他是什么样的人。</p></div></div></div>\n    {}\n    <div class=\"row\"><button class=\"btn {}\" data-act=\"start\">{}</button><button class=\"btn ghost\" data-act=\"importopen\">导入存档码</button><button class=\"btn\" data-act=\"gallery\">图鉴（{} 张）</button></div>\n    <div class=\"trio\">{}</div>\n    <div class=\"card col\" style=\"gap:8px\"><b>怎么玩</b>\n      <p class=\"dim\">一局六周。每周在镇上有三次行动：去见人、交货、打装备、招人。然后挑一张地图下去。</p>\n      <p class=\"dim\">地图是一圈 24 格。每回合选一个队长，掷他的骰子走路：布兰德要么不动要么冲半圈，格林几乎指哪走哪。踩到哪格发生哪格的事。转完一圈就更深一层，经过入口时决定回家还是再赌一圈。第三圈的巢穴里，头目醒着。</p>\n      <p class=\"dim\">带回来的东西换成钱和人情。人情变成下一次能带下去的骰子。每三周，房东龙来收一次租。</p>\n      <p class=\"dim\">遇到事情要「检定」：派一两个人掷骰，点数加起来够大就成功。检定分四种：<b>力</b>（砍、扛、硬闯）、<b>巧</b>（开锁、拆机关、躲）、<b>知</b>（认东西、解谜）、<b>胆</b>（面对恐怖、谈判）。每个人擅长一种，擅长的掷两次取高。装备会盖住骰子的一面，只在对应的那种检定里特别厉害。</p>\n      {}</div>\n  </section>":"<section class=\"title\"> <div class=\"scene\" style=\"{}\"><div class=\"veil\"></div><div class=\"cap\"><div><div class=\"big\" style=\"letter-spacing:.04em\">Three Dice Deep</div><p style=\"max-width:52ch;text-shadow:0 2px 6px #000\">You're a middleman in the town of Abyssmouth, keeping a party of three. Each of them has one die, and its six faces say who they are.</p></div></div></div> {} <div class=\"row\"><button class=\"btn {}\" data-act=\"start\">{}</button><button class=\"btn ghost\" data-act=\"importopen\">Import save code</button><button class=\"btn\" data-act=\"gallery\">Gallery ({} images)</button></div> <div class=\"trio\">{}</div> <div class=\"card col\" style=\"gap:8px\"><b>How to play</b> <p class=\"dim\">A season is six weeks. Wander the town freely: meet people, deliver goods, forge equipment, recruit — none of it takes time. Then pick a map and go down. One trip down is one week.</p> <p class=\"dim\">Each map is a loop of 24 tiles. Every turn you pick a leader and roll their die to move: Brand either stays put or charges half the loop; Grim goes almost exactly where you want. Whatever tile you land on, that's what happens. Finish a lap and you go one level deeper; when you pass the entrance, decide whether to go home or gamble another lap. On the third lap, the boss in the lair is awake.</p> <p class=\"dim\">What you bring back becomes gold and favors. Favors become dice you can take down next time. Every three weeks, your landlady the dragon collects rent.</p> <p class=\"dim\">When something happens you make a <b>check</b>: send one or two people to roll, and if the total is high enough you succeed. There are four kinds: <b>Might</b> (hack, haul, barge), <b>Craft</b> (locks, traps, dodging), <b>Wits</b> (knowing things, riddles), <b>Nerve</b> (horrors, haggling). Each person is good at one, and rolls twice and keeps the higher for it. Equipment covers one face of a die and is only strong in its own kind of check.</p> {}</div> </section>","<span class=\"dim\" style=\"font-size:13px\">没有闲着的装备</span>":"<span class=\"dim\" style=\"font-size:13px\">No spare equipment</span>","晨露×{}":"Morning dew×{}","酒保的消息×{}":"Barkeep's news×{}","欠你 {} 份人情":"owes you {} favors","你欠他 {} 金":"you owe him {} gold","听过你 {} 个故事":"has heard {} of your stories","<button class=\"btn small\" data-act=\"equip\">换装备</button>":"<button class=\"btn small\" data-act=\"equip\">Equipment</button>","<span class=\"dim\">空的</span>":"<span class=\"dim\">Empty</span>","<div class=\"card col\" style=\"gap:6px\"><span class=\"eyebrow\">人情账</span><div class=\"ledger\">{}</div></div>":"<div class=\"card col\" style=\"gap:6px\"><span class=\"eyebrow\">Favor ledger</span><div class=\"ledger\">{}</div></div>","<aside class=\"side\">\n    <div class=\"party\" style=\"grid-template-columns:minmax(0,1fr);margin:0\">{}</div>\n    <di e);font-family:var(--f-mono);font-size:11px\" onclick=\"this.select()\">{}</textarea>\n      <div class=\"row\"><button class=\"btn small\" data-act=\"copysave\">复制存档码</button><span class=\"dim\" id=\"copied\" style=\"font-size:12px\"></span></div>\n      <hr style=\"border:0;border-top:1px solid var(--rule);width:100%\">":"<p class=\"dim\" style=\"font-size:13.5px\">Every step is saved automatically in this browser. Close the page, open it again, and click \"Continue last game\". If you switch browsers or devices, or clear browser data, the autosave is gone: to keep it, copy the save code below.</p> <textarea readonly style=\"width:100%;height:110px;background:var(--wall2);color:var(--dim);border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px\" onclick=\"this.select()\">{}</textarea> <div class=\"row\"><button class=\"btn small\" data-act=\"copysave\">Copy save code</button><span class=\"dim\" id=\"copied\" style=\"font-size:12px\"></span></div> <hr style=\"border:0;border-top:1px solid var(--rule);width:100%\">","<div class=\"modal\"><div class=\"box\"><div class=\"row\" style=\"justify-content:space-between\"><h3>存档</h3><button class=\"btn small\" data-act=\"saveclose\">关上</button></div>\n      {}\n      <b>导入存档码</b><p class=\"dim\" style=\"font-size:13px\">把之前复制的存档码贴进来。会替换掉现在这局。</p>\n      <textarea id=\"importbox\" style=\"width:100%;height:80px;background:var(--wall2);color:var(--ink);border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px\"></textarea>\n      <div class=\"row\"><button class=\"btn small primary\" data-act=\"doimport\">读取</button><span class=\"dis\" id=\"importerr\" style=\"font-size:12px\"></span></div></div></div>":"<div class=\"modal\"><div class=\"box\"><div class=\"row\" style=\"justify-content:space-between\"><h3>Save</h3><button class=\"btn small\" data-act=\"saveclose\">Close</button></div> {} <b>Import save code</b><p class=\"dim\" style=\"font-size:13px\">Paste a save code you copied before. It replaces the current game.</p> <textarea id=\"importbox\" style=\"width:100%;height:80px;background:var(--wall2);color:var(--ink);border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px\"></textarea> <div class=\"row\"><button class=\"btn small primary\" data-act=\"doimport\">Load</button><span class=\"dis\" id=\"importerr\" style=\"font-size:12px\"></span></div></div></div>","<span class=\"dim\">没有闲着的装备</span>":"<span class=\"dim\">No spare equipment</span>","<div class=\"modal\"><div class=\"box\"><div class=\"row\" style=\"justify-content:space-between\"><h3>换装备</h3><button class=\"btn small\" data-act=\"equipclose\">完成</button></div>\n      <p class=\"dim\" style=\"font-size:13px\">装备是一块贴片：盖住骰子上的一面，以后掷到这一面，就按装备算。它只在对应的那种检定里特别强（力：砍扛硬闯 · 巧：开锁躲 · 知：认东西解谜 · 胆：吓人谈判），别的时候数字很小。先选一件装备，再点某个人骰子上的一面，把它盖住。每颗骰子最多两件。点已经装上的装备，可以取下来。盖住哪一面，就是把这个人改成什么样的人。</p>\n      <div class=\"row\">{}</div>\n      {}</div></div>":"<div class=\"modal\"><div class=\"box\"><div class=\"row\" style=\"justify-content:space-between\"><h3>Equipment</h3><button class=\"btn small\" data-act=\"equipclose\">Done</button></div> <p class=\"dim\" style=\"font-size:13px\">Equipment is a patch: it covers one face of a die, and from then on that face counts as the equipment. It's only strong in its own kind of check (Might: hack, haul, barge · Craft: locks, dodging · Wits: knowing things, riddles · Nerve: horrors, haggling); otherwise its number is small. Pick a piece of equipment, then click a face on someone's die to cover it. Two pieces per die at most. Click a fitted piece to remove it. Which face you cover decides who that person becomes.</p> <div class=\"row\">{}</div> {}</div></div>","<section class=\"title\">\n    <div class=\"scene\" style=\"{}\"><div class=\"veil\"></div><div class=\"cap\"><div><div class=\"big\">深渊三骰</div><p style=\"max-width:52ch;text-shadow:0 2px 6px #000\">你在深渊口镇当中间人，养着一支三个人的小队。每个人一颗骰子，六个面写着他是什么样的人。</p></div></div></div>\n    {}\n    <div class=\"row\"><button class=\"btn {}\" data-act=\"start\">{}</button><button class=\"btn ghost\" data-act=\"importopen\">导入存档码</button><button class=\"btn\" data-act=\"gallery\">图鉴（{} 张）</button></div>\n    <div class=\"trio\">{}</div>\n    <div class=\"card col\" style=\"gap:8px\"><b>怎么玩</b>\n      <p class=\"dim\">一局六周。在镇上随便逛：见人、交货、打装备、招人，都不花时间。然后挑一张地图下去，下去一趟就是一周。</p>\n      <p class=\"dim\">地图是一圈 24 格。每回合选一个队长，掷他的骰子走路：布兰德要么不动要么冲半圈，格林几乎指哪走哪。踩到哪格发生哪格的事。转完一圈就更深一层，经过入口时决定回家还是再赌一圈。第三圈的巢穴里，头目醒着。</p>\n      <p class=\"dim\">带回来的东西换成钱和人情。人情变成下一次能带下去的骰子。每三周，房东龙来收一次租。</p>\n      <p class=\"dim\">遇到事情要「检定」：派一两个人掷骰，点数加起来够大就成功。检定分四种：<b>力</b>（砍、扛、硬闯）、<b>巧</b>（开锁、拆机关、躲）、<b>知</b>（认东西、解谜）、<b>胆</b>（面对恐怖、谈判）。每个人擅长一种，擅长的掷两次取高。装备会盖住骰子的一面，只在对应的那种检定里特别厉害。</p>\n      {}</div>\n  </section>":"<section class=\"title\"> <div class=\"scene\" style=\"{}\"><div class=\"veil\"></div><div class=\"cap\"><div><div class=\"big\" style=\"letter-spacing:.04em\">Three Dice Deep</div><p style=\"max-width:52ch;text-shadow:0 2px 6px #000\">You're a middleman in the town of Abyssmouth, keeping a party of three. Each of them has one die, and its six faces say who they are.</p></div></div></div> {} <div class=\"row\"><button class=\"btn {}\" data-act=\"start\">{}</button><button class=\"btn ghost\" data-act=\"importopen\">Import save code</button><button class=\"btn\" data-act=\"gallery\">Gallery ({} images)</button></div> <div class=\"trio\">{}</div> <div class=\"card col\" style=\"gap:8px\"><b>How to play</b> <p class=\"dim\">A season is six weeks. Wander the town freely: meet people, deliver goods, forge equipment, recruit — none of it takes time. Then pick a map and go down. One trip down is one week.</p> <p class=\"dim\">Each map is a loop of 24 tiles. Every turn you pick a leader and roll their die to move: Brand either stays put or charges half the loop; Grim goes almost exactly where you want. Whatever tile you land on, that's what happens. Finish a lap and you go one level deeper; when you pass the entrance, decide whether to go home or gamble another lap. On the third lap, the boss in the lair is awake.</p> <p class=\"dim\">What you bring back becomes gold and favors. Favors become dice you can take down next time. Every three weeks, your landlady the dragon collects rent.</p> <p class=\"dim\">When something happens you make a <b>check</b>: send one or two people to roll, and if the total is high enough you succeed. There are four kinds: <b>Might</b> (hack, haul, barge), <b>Craft</b> (locks, traps, dodging), <b>Wits</b> (knowing things, riddles), <b>Nerve</b> (horrors, haggling). Each person is good at one, and rolls twice and keeps the higher for it. Equipment covers one face of a die and is only strong in its own kind of check.</p> {}</div> </section>"};

/* ================= encounters ================= */
const reveal=(e,c)=>{ if(e.mimic){ c.say(T("*回声是闷的。宝箱的盖子，轻轻动了一下。*"),T("§它是宝箱怪。")); e.stage="mimic"; } else { c.say(T("*回声很空。是个真宝箱。*")); e.stage="real"; } c.stay(); };
const chestOpts=(e,wordReal,wordMimic)=>{
  if(e.stage==="real") return [{id:"take",label:T("打开，拿东西"),free:true,run:(e,c)=>{c.say(wordReal);c.loot(T("箱子里的金币"),40);}}];
  if(e.stage==="mimic") return [
    {id:"cook",label:T("把它做成菜"),hint:T("宝箱怪的肉据说很嫩"),stat:"力",dc:9,mon:1,ok:(e,c)=>{c.say(T("*宝箱怪被撬开了。肉很嫩，舌头能卖给炼金铺。*"));c.loot(T("宝箱怪（可食用）"),50,{mat:1});},bad:(e,c)=>{c.say(T("*它咬住了一只手。*"));c.wound("roller");}},
    {id:"leave",label:T("贴着墙绕过去"),free:true,run:(e,c)=>c.say(T("*你们贴着墙走了过去。它的盖子一直在一开一合。*"))}];
  if(e.stage==="awake") return [
    {id:"fight",label:T("撬开它的嘴"),stat:"力",dc:10,mon:1,ok:(e,c)=>{c.say(T("*它不动了。*"));c.loot(T("宝箱怪的舌头"),30,{mat:1});},bad:(e,c)=>{c.say(T("*它又咬了一口。*"));c.wound("roller");}},
    {id:"run",label:T("拖着伤员跑"),free:true,run:(e,c)=>{c.say(T("*你们跑了。身后传来咯吱咯吱嚼东西的声音。*"));c.noise(1);}}];
  const L=[];
  if(!e.tried.knock) L.push({id:"knock",label:T("敲三下，听回声"),hint:T("失败只是浪费火把"),stat:"知",dc:7,maxN:1,ok:reveal,bad:(e,c)=>{c.say(T("*听不出来。火把烧短了一截。*"));c.torch(-1);e.tried.knock=1;c.stay();}});
  if(!e.tried.lock) L.push({id:"lock",label:T("撬开锁，从缝里看"),hint:T("锁里可能有针"),stat:"巧",dc:8,maxN:1,lock:1,ok:reveal,bad:(e,c)=>{c.say(T("*锁里弹出一根针。*"));c.wound("roller");e.tried.lock=1;c.stay();}});
  L.push({id:"open",label:T("直接打开"),hint:T("选一个人去开"),free:true,pick:1,run:(e,c,p)=>{ if(e.mimic){c.say(wordMimic);c.wound(p[0]);e.stage="awake";c.stay();} else {c.say(wordReal);c.loot(T("箱子里的金币"),40);} }});
  L.push({id:"skip",label:T("不要了，绕开"),free:true,run:(e,c)=>c.say(T("*你们绕开了它。直到最后，也没人知道它是不是一个宝箱。*"))});
  return L; };

/* ================= town: who is where ================= */
function placeAvail(k){
  if(k==="gate") return S.week>=2;
  return true;
}
function placeNPCs(k){
  const L=[];
  if(k==="tavern"){ L.push("bar"); if(!inRoster("karl")) L.push("karl"); if(reynHere()) L.push("reyn"); }
  if(k==="smith"){ L.push("huo"); if(S.known.granny) L.push("granny"); }
  if(k==="alch"){ L.push("mona"); if(S.known.moss) L.push("moss"); }
  if(k==="tower"){ L.push("milo"); if(S.known.titi&&!inRoster("titi")) L.push("titi"); }
  if(k==="market") L.push("guli");
  if(k==="cottage") L.push("dragon");
  if(k==="grave"){ L.push("priest"); if(S.week>=3) L.push("demon"); }
  if(k==="gate") L.push("ilan");
  return L;
}
const reynHere=()=>S.week>=2&&(S.week%2===0||!S.flags.metReyn);
function placeHint(k){
  const n=placeNPCs(k).filter(id=>!S.known[id]).length;
  return n?T2`有 ${n} 个没见过的人`:"";
}
const hasGoods=need=>Object.entries(need).every(([k,v])=>(S.storage[k]||0)>=v);
const takeGoods=need=>{ for(const [k,v] of Object.entries(need)) S.storage[k]-=v; };
const needTxt=need=>Object.entries(need).map(([k,v])=>T2`${RES[k].name}×${v}（有 ${S.storage[k]||0}）`).join(T("、"));
function deliverDeal(cid,lines,after){
  const C=COMMS[cid];
  return {id:"deliver-"+cid,label:T2`交货：${C.title}`,desc:T2`${needTxt(C.need)} → ${C.gold} 金，外加一份人情`,
    can:()=>hasGoods(C.need)?null:T("东西还没凑齐"),
    run:()=>{ takeGoods(C.need); S.gold+=C.gold; S.comms[cid]="done"; const out=[...lines,T2`§交货完成：+${C.gold} 金`]; after(out); return out; }};
}
function buyEq(key,price,extra){ return {id:"eq-"+key,label:T2`买：${EQ[key].name}`,desc:T2`${EQ[key].desc} · ${price} 金${extra?" · "+extra.txt:""}`,
  can:()=>S.gold<price?T("金币不够"):extra&&extra.can?extra.can():null,
  run:()=>{ S.gold-=price; if(extra&&extra.pay) extra.pay(); S.equip.push(key); return [T2`§得到装备：${EQ[key].name}。在镇上的「装备」里把它盖到某个人的骰子上。`]; }}; }

function fval(fc,cx){
  if(fc.tag==="fear") return 0;
  if(fc.tag==="scar") return cx.dis&&fc.against===cx.dis?AUTO:fc.v;
  if(fc.tag==="cheng") return cx.chengUsed?5:AUTO;
  if(fc.tag==="oath") return cx.stat==="胆"?16:8;
  if(fc.eq){ const D=EQ[fc.eq]; if(fc.broken) return 0; if(D.bomb) return cx.mon&&cx.stat==="力"?AUTO:0; if(D.vals[cx.stat]!=null) return D.vals[cx.stat]; return D.base; }
  return fc.v;
}
function moveVal(fc){ if(fc.tag==="fear") return 0; if(fc.eq) return fc.broken?0:EQ[fc.eq].move; if(fc.tag==="cheng") return 5; return fc.v; }
function add(map,k,p){ map.set(k,(map.get(k)||0)+p); }
function dist1(faces,cx,depth=0){
  const m=new Map();
  for(const fc of faces){ const v=fval(fc,cx), p=1/faces.length;
    if(v>=AUTO) add(m,AUTO,p);
    else if(fc.boom&&!fc.eq&&depth<2){ for(const [k,q] of dist1(faces,cx,depth+1)) add(m,Math.min(AUTO,v+k),p*q); }
    else add(m,v,p); }
  return m;
}
function withMode(d,mode){
  if(mode==="norm") return d;
  const ks=[...d.keys()].sort((a,b)=>a-b); const out=new Map(); let F=0, prev=0;
  for(const k of ks){ F+=d.get(k); const G = mode==="adv"? F*F : 1-(1-F)*(1-F); out.set(k,G-prev); prev=G; }
  return out;
}
function conv(a,b){ const m=new Map(); for(const [x,p] of a) for(const [y,q] of b) add(m,Math.min(AUTO,x+y),p*q); return m; }
function shift(a,s){ const m=new Map(); for(const [x,p] of a) add(m,x>=AUTO?AUTO:Math.max(0,x+s),p); return m; }
function fearsOf(id,enc){
  const pp=P(id); if(!enc) return pp.fear==="dark"&&isDark();
  if(pp.fear==="dark"&&(isDark()||enc.def.tag==="dark")) return true;
  if(pp.fear==="boss"&&enc.boss) return true;
  if(enc.def.tag&&enc.def.tag===pp.fear) return true;
  return false;
}
function modeOf(id,stat,enc){
  const m=M(id), pp=P(id); const adv=stat===pp.spec; const dis=m.hp===1||fearsOf(id,enc);
  return adv&&dis?"norm":adv?"adv":dis?"dis":"norm";
}
function cxFor(id,o,enc){ return {dis:enc&&enc.def.disaster,stat:o.stat,mon:!!(o.mon||(enc&&enc.boss)),chengUsed:!!(S.E&&S.E.chengUsed[id])}; }
function rollChain(faces,cx,ev){
  let total=0, chain=[], depth=0;
  while(true){ const i=Math.floor(R()*faces.length), fc=faces[i]; chain.push(i);
    if(fc.eq&&EQ[fc.eq].fake&&fc.real===undefined&&ev){ fc.real=R()>=EQ[fc.eq].fake; if(!fc.real){ fc.broken=true; ev.push("fake"); } }
    const v=fval(fc,cx);
    if(v>=AUTO){ total=AUTO; break; } total+=v; if(fc.boom&&!fc.eq&&depth<2){ depth++; continue; } break; }
  return {total:Math.min(AUTO,total),chain};
}
function rollMember(id,mode,cx,ev){
  const fs=M(id).faces; const a=rollChain(fs,cx,ev);
  if(mode==="norm") return {...a,alt:null};
  const b=rollChain(fs,cx,ev);
  const keepA = mode==="adv"? a.total>=b.total : a.total<=b.total;
  return keepA? {...a,alt:b} : {...b,alt:a};
}
function rollMoveChain(id){
  const fs=M(id).faces; let total=0, chain=[], depth=0;
  while(true){ const i=Math.floor(R()*fs.length), fc=fs[i]; chain.push(i); const v=moveVal(fc); total+=v; if(fc.boom&&!fc.eq&&depth<2&&v>0){ depth++; continue; } break; }
  return {total,chain,shown:chain.map(i=>({...fs[i]}))};
}

/* ================= face changes ================= */
function plain(m){ return m.faces.map((x,i)=>[x,i]).filter(([x])=>!x.tag&&!x.eq); }
function markNew(fc){ fc.isNew=true; return fc; }
function lowerHigh(id,k){ const cand=plain(M(id)); if(!cand.length) return; const [fc]=cand.sort((a,b)=>b[0].v-a[0].v)[0]; fc.v=Math.max(0,fc.v-k); if(fc.v<4) fc.boom=false; markNew(fc); }
function addFear(id){ const cand=plain(M(id)); if(!cand.length) return false; const [,i]=pick(cand); M(id).faces[i]=markNew({v:0,tag:"fear"}); return true; }
function addScar(id,against){ const m=M(id); if(m.faces.some(x=>x.tag==="scar"&&x.against===against)) return false; const cand=plain(m); if(!cand.length) return false;
  const [fc,i]=cand.sort((a,b)=>a[0].v-b[0].v)[0]; m.faces[i]=markNew({v:Math.max(fc.v,4),tag:"scar",against}); return true; }
function raiseLow(id,n){ const cand=plain(M(id)); if(!cand.length) return; const [fc]=cand.sort((a,b)=>a[0].v-b[0].v)[0]; fc.v=fc.v<4&&n===1?4:fc.v+n; markNew(fc); }
function clearNew(){ for(const id in S.party) S.party[id].faces.forEach(x=>delete x.isNew); }
function installEq(id,idx,key){
  const m=M(id); const fc=m.faces[idx]; if(fc.eq||fc.tag==="fear") return false;
  if(m.faces.filter(x=>x.eq).length>=2) return false;
  m.faces[idx]=markNew({eq:key,under:fc}); S.equip.splice(S.equip.indexOf(key),1);
  if(EQ[key].cursed) addFear(id);
  return true;
}
function removeEq(id,idx){ const m=M(id); const fc=m.faces[idx]; if(!fc.eq) return; if(!fc.broken) S.equip.push(fc.eq); m.faces[idx]=fc.under; }

/* ================= board geometry ================= */
const colOf=i=>i<=6?6-i:i<=12?0:i<=18?i-12:6;
const rowOf=i=>i<=6?6:i<=12?12-i:i<=18?0:i-18;
function tileSpec(i){ if(CORNER[i]) return {type:"corner",corner:i}; const s=E().tiles[i]; const [type,arg]=s.split(":"); return {type,arg}; }
function tileName(i,m){
  m=m||E().map;

  if(t==="enc") return (ENC[a]&&ENC[a].name)||T("遭遇");

  if(t==="stove") return m==="forge"?T("古代锻炉"):T("灶台");

}
function tileIcon(i){ const s=E().tiles[i]; return TILE_ICON[s.split(":")[0]]; }
const isRevealed=i=>!!CORNER[i]||S.maps[E().map].rev[i];
function revealAt(i){ S.maps[E().map].rev[i]=true; }
function revealAhead(n){ let c=0; for(let k=1;k<=n;k++){ const i=(E().pos+k)%24; if(!CORNER[i]&&!isRevealed(i)){ revealAt(i); c++; } } return c; }

/* ---------- turn: movement ---------- */
function setLeader(id){ if(!alivePartyIds().includes(id)) return; E().leader=id; render(true); }
function ensureLeader(){ if(!alivePartyIds().includes(E().leader)) E().leader=alivePartyIds()[0]; }
function doMove(kind,arg){
  const e=E(); if(S.busy||(e.mode!=="turn"&&!(kind==="fix"&&e.mode==="fix"))) return; ensureLeader(); if(!e.leader) return; e.mode="turn";
  clearNew(); S.expr={};
  const L=e.leader;
  e.torch=Math.max(0,e.torch-1);
  if(kind==="fix"){ useCard("fix"); e.stuck=false; e.moveRoll={id:L,fixed:arg,total:arg,chain:[],shown:[]}; return startSteps(arg,[T2`§定点卡：走 ${arg} 格。`]); }
  const r=rollMoveChain(L);
  if(kind==="twice"){ useCard("twice"); const r2=rollMoveChain(L); e.mode="pick2"; e.moveRoll={id:L,opts:[r,r2],anim:true}; render(true); return; }
  e.moveRoll={id:L,...r,anim:true};
  finishMoveRoll(r);
}
function pickTwice(k){ const e=E(); const r=e.moveRoll.opts[k]; e.moveRoll={id:e.moveRoll.id,...r,anim:false}; e.mode="turn"; finishMoveRoll(r); }
function finishMoveRoll(r){
  const e=E(); const L=e.leader; const lines=[];
  const first=M(L).faces[r.chain[0]];
  if(e.stuck){
    if(r.total>=4){ e.stuck=false; lines.push(T2`*${P(L).name}掷出 ${r.total}，找到了出去的路。*`); }
    else { lines.push(T2`*${P(L).name}掷出 ${r.total}。还是绕回了原地。*`,T("§迷路了：队长要掷到 4 以上才走得出去。")); S.expr[L]="fear"; return afterTurn(lines); }
  }
  if(r.total===0){ lines.push(first&&first.tag==="fear"?(P(L).fearFace.startsWith("*")?P(L).fearFace:T2`${P(L).name}：${P(L).fearFace}`):T2`*${P(L).name}站在原地，一步也没走。*`,T("§掷到「恐」：原地不动。火把照样烧。")); S.expr[L]="fear"; return afterTurn(lines); }
  if(r.chain.length>1){ lines.push(T2`${P(L).name}：${pick(P(L).boom)}`,T2`§爆了！一共走 ${r.total} 格。`); S.expr[L]="triumph"; }
  else lines.push(T2`§${P(L).name}掷出 ${r.total}，走 ${r.total} 格。`);
  startSteps(r.total,lines);
}
function startSteps(n,lines){
  const e=E(); e.pendingSteps=n; e.msg=lines; e.mode="moving"; S.busy=true;
  if(isDark()) e.msg.push(T("§火把烧完了。所有检定难度 +2，怕黑的人掷两次取低。"));
  render(true);
  stepLoop();
}
function stepLoop(){
  const e=E();
  const go=()=>{
    if(e.pendingSteps<=0){ S.busy=false; return land(); }
    e.pendingSteps--; e.pos=(e.pos+1)%24; revealAt(e.pos); moveTok();
    if(e.pos===0){ S.busy=false; return atEntrance(e.pendingSteps>0); }
    if(ANIM) setTimeout(go,170); else go();
  };
  if(ANIM) setTimeout(go,ANIM_DELAY()); else go();
}
const ANIM_DELAY=()=>E()&&E().moveRoll&&E().moveRoll.anim?760:120;
function moveTok(){ if(typeof document==="undefined") return; const t=document.getElementById("tok"); if(!t) return; const p=tokPos(E().pos,0); t.style.left=p.x+"%"; t.style.top=p.y+"%"; const tl=document.querySelector(`.tile[data-i="${E().pos}"]`); if(tl){ tl.classList.remove("hidden"); } }

/* ---------- the entrance ---------- */

}
function continueDeeper(){
  const e=E(); e.lap++; e.seenDis={}; e.mode="moving"; S.seen[`map-${e.map}-${e.lap}`]=1;
  e.msg=[T2`*你们没有上去。整张棋盘好像往下沉了一层。*`,T2`§第 ${e.lap} 圈：检定难度 +${LAP_DC[e.lap-1]}，战利品 ×${LAP_MULT[e.lap-1]}。`];

}
function undoSwaps(){ const e=E(); while(e.swaps.length){ const [a,b]=e.swaps.pop(); if(M(a)&&M(b)){ const t=M(a).faces; M(a).faces=M(b).faces; M(b).faces=t; } } }

/* ---------- landing ---------- */
function land(){
  const e=E(); const i=e.pos; e.mode="turn";
  if(e.jump!=null) e.jump=null;
  if(i===6){ e.stuck=true; e.msg.push(T("*你们走进了一个岔路口。每条路看起来都一样。*"),T("§迷途角：下次掷骰，队长要掷到 4 以上才走得出去。")+(e.peek>0?T("酒保的消息可以直接带你们出去。"):"")); return afterTurn([]); }
  if(i===12) return openCamp();
  if(i===18) return enterBoss();
  const sp=tileSpec(i);
  if(isCleared(i)&&sp.type!=="cart"){ e.msg.push(T2`*${tileName(i)}：这一圈已经来过了。*`); return afterTurn([]); }
  if(sp.type==="res") return enterRes(sp.arg);
  if(sp.type==="enc") return enter(sp.arg);
  if(sp.type==="chest") return enter("chest");
  if(sp.type==="trap") return enterTrap(sp.arg);
  if(sp.type==="fate") return enterFate();
  if(sp.type==="shop") return enter("shop");
  if(sp.type==="shrine") return enter("shrine");
  if(sp.type==="stove") return enter("stove");
  if(sp.type==="story") return enterStory(sp.arg);
  if(sp.type==="cart") return enter("cart",{jumpTo:+sp.arg});
  if(sp.type==="end") return enter("end");
  afterTurn([]);
}
function enterTrap(id,fromFate){
  const e=E(); const def=ENC[id];
  if(e.ward===false&&S.hand.includes("ward")){ e.mode="ward"; e.wardFor={id,fromFate}; return render(true); }
  if(def.disaster){
    if(e.seenDis[def.disaster]){
      const holder=alivePartyIds().find(m=>M(m).faces.some(x=>x.tag==="scar"&&x.against===def.disaster));
      if(!fromFate) e.cleared[e.pos]=e.lap;
      if(holder){ e.msg.push(T2`*又是${def.disaster}。*`,T2`*${P(holder).name}认得这种声音，带着大家提前躲开了。*`,T2`§${P(holder).name}骰子上的那道疤救了所有人。`); return afterTurn([]); }
      return collapse(def.disaster);
    }
    e.seenDis[def.disaster]=1;
  }
  enter(id,{fromFate});
}
function useWard(yes){
  const e=E(); const w=e.wardFor; e.wardFor=null; e.mode="turn";
  if(yes){ useCard("ward"); e.msg.push(T("§灾厄抵消卡：当作没踩到。")); if(!w.fromFate) e.cleared[e.pos]=e.lap; return afterTurn([]); }
  e.ward=true; enterTrap(w.id,w.fromFate); e.ward=false;
}
function collapse(dis){
  const e=E(); const mine=e.loot.filter(x=>x.lap===e.lap); const n=Math.floor(mine.length/2);
  for(let k=0;k<n;k++){ const it=mine[mine.length-1-k]; e.loot.splice(e.loot.indexOf(it),1); }
  e.msg.push(T2`*第二次${dis}。整条路都在往下塌。*`,T2`§你们被冲回了入口，丢掉了这一圈一半的战利品（${n} 件）。`);
  e.pos=0; e.pendingSteps=0; moveTok();
  atEntrance(false);
}

/* ---------- encounters ---------- */
function enter(id,o={}){
  const e=E(); clearNew();
  const src=o.src||{t:"enc",a:id};
  const def=defFromSrc(src);
  const en={id,src,def,stage:0,tried:{},log:[],check:null,res:null,boss:o.boss||null,jumpTo:o.jumpTo,fromFate:o.fromFate,story:o.story,hp:o.hp};
  if(def.setup) def.setup(en);

  if(def.art) S.seen[def.art]=1;
  e.enc=en; e.mode="enc";
  if(def.auto){ const t=ctxFor(en,null); def.auto(en,t.c); en.log.push(...t.out); en.autoDone=true; if(!o.fromFate&&en.id!=="thing") markCleared(en); }
  render(true);
}
function markCleared(en){ const e=E(); if(en.fromFate) return; if(en.id==="cart") return; e.cleared[e.pos]=e.lap; }
function finishEnc(lines){
  const e=E(); const en=e.enc; e.enc=null; e.mode="turn";
  if(en&&en.goFight) return bossFight();
  if(en){ markCleared(en); if(en.id==="thing"){ e.chaser=null; e.noise=0; } }
  if(e.jump!=null){ const to=e.jump; e.jump=null; e.pos=to; revealAt(to); moveTok(); }
  afterTurn(lines||[]);
}
function afterTurn(lines){
  const e=E(); if(!e) return;
  if(lines&&lines.length) e.msg.push(...lines);
  if(alivePartyIds().length===0) return goHome("dead");
  ensureLeader();
  // the thing in the deep
  if(e.npcTurn!==e.turnNo){
    e.npcTurn=e.turnNo;
    if(e.noise>=3&&e.chaser==null&&!e.chaserGone){ e.chaser=18; e.msg.push(T2`§动静太大了。${BOSS[MAPS[e.map].boss].name}的巢穴里，有别的东西爬了出来。它会追着你们跑。`); S.seen["b-shadow"]=1; }
    else if(e.chaser!=null&&!e.chaserGone){
      const n=2+Math.floor(R()*3); let caught=e.chaser===e.pos;
      for(let k=0;k<n&&!caught;k++){ e.chaser=(e.chaser+1)%24; if(e.chaser===e.pos) caught=true; }
      e.msg.push(caught?T("§深处的东西追上了你们。"):T2`§深处的东西追了 ${n} 格。`);
      if(caught){ e.mode="turn"; return enter("thing"); }
    }
    if(e.rival!=null){
      let met=false;
      for(let k=0;k<3;k++){ e.rival=(e.rival+1)%24; const s=CORNER[e.rival]?null:e.tiles[e.rival];
        if(s==="chest"&&!isCleared(e.rival)){ e.cleared[e.rival]=e.lap; e.msg.push(T2`§银鹰队先一步打开了一个宝箱。`); }
        if(e.rival===e.pos&&!e.rivalMet[e.lap]&&e.pos%6!==0){ met=true; break; } }
      if(met){ e.rivalMet[e.lap]=1; return enter("rival"); }
    }
  }
  e.turnNo=(e.turnNo||0)+1;
  e.mode="turn"; render(true);
}

/* ---------- ctx: what an outcome can do ---------- */
function ctxFor(en,rolled){
  const out=[]; let stay=false; const e=E();
  const rollerIds=()=> rolled? rolled.slice().sort((a,b)=>a.total-b.total).map(r=>r.id):[];
  const target=t=>{ const al=alivePartyIds();
    if(Array.isArray(t)) return t.filter(id=>al.includes(id));
    if(t==="leader") return al.includes(e.leader)?[e.leader]:al.length?[pick(al)]:[];
    if(t==="roller"){ const r=rollerIds().filter(id=>al.includes(id)); return r.length?[r[0]]:al.length?[pick(al)]:[]; }
    if(t==="rollers"){ const r=rollerIds().filter(id=>al.includes(id)); return r.length?r:al.length?[pick(al)]:[]; }
    if(t==="random") return al.length?[pick(al)]:[];
    return al.includes(t)?[t]:[]; };
  const c={
    say:(...l)=>out.push(...l.map(LD)),
    stay:()=>{stay=true;},
    loot:(name,base,o={})=>{ let v=Math.round(base*LAP_MULT[e.lap-1]); if(e.doubleNext){ v*=2; e.doubleNext=0; out.push(T("§加倍卡：这一件翻倍。")); } e.loot.push({name,v,lap:e.lap,mat:!!o.mat}); out.push(T2`§得到：${name}（${v} 金）`); },
    goods:rid=>{ e.goods[rid]=(e.goods[rid]||0)+1; out.push(T2`§得到：${RES[rid].name}`); },
    loseLoot:(n,random)=>{ for(let i=0;i<n&&e.loot.length;i++){ const idx= random? Math.floor(R()*e.loot.length) : e.loot.reduce((b,x,j)=>x.v<e.loot[b].v?j:b,0); const it=e.loot.splice(idx,1)[0]; e.lostItems.push(it); out.push(T2`§失去：${it.name}`);} },
    recover:()=>{ if(e.lostItems.length){ for(const it of e.lostItems) e.loot.push(it); out.push(T2`§拿回了 ${e.lostItems.length} 件之前丢掉的东西。`); e.lostItems=[]; } },
    torch:n=>{ e.torch=Math.max(0,e.torch+n); out.push(T2`§火把 ${n>0?"+":""}${n}`); },
    noise:n=>{ if(e.chaserGone) return; e.noise=Math.min(3,e.noise+n); out.push(T2`§动静 +${n}${e.noise>=3?T("。深处有什么东西醒了。"):""}`); },
    wound:t=>{ for(const id of target(t)) woundMember(id,out); },
    fear:t=>{ for(const id of target(t)){ if(!addFear(id)) continue; const ff=P(id).fearFace; out.push(ff.startsWith("*")?ff:T2`${P(id).name}：${ff}`); out.push(T2`§${P(id).name}的骰子上，刻下了一面「恐」。`); S.expr[id]="fear"; } },
    scar:(t,against)=>{ for(const id of target(t)) if(addScar(id,against)) out.push(T2`§${P(id).name}的骰子上，多了一道「${against}」的疤。`); },
    lowerHigh:(t,k)=>{ for(const id of target(t)){ lowerHigh(id,k); out.push(T2`§${P(id).name}骰子最大的那一面变小了。`);} },
    clue:m=>{ m=m||"mirror"; if(!S.clues[m]){ S.clues[m]=1; out.push(T2`§记住了：${BOSS[MAPS[m].boss].name}的弱点。`); } },
    story:t=>{ S.stories++; S.storyLog.push(t); out.push(T2`§得到一个故事：「${t}」。可以讲给龙听，也可以抵房租。`); },
    reveal:n=>{ const k=revealAhead(n); out.push(k?T2`§翻开了前面 ${k} 格。`:T("§前面的路，你们已经都知道了。")); },
    jump:to=>{ e.jump=to; },
    expr:(id,x)=>{ S.expr[id]=x; },
    quake:()=>{ const idx=[]; for(let i=0;i<24;i++) if(!CORNER[i]&&!isRevealed(i)&&i!==e.pos) idx.push(i); const vals=shuffle(idx.map(i=>e.tiles[i])); idx.forEach((i,k)=>e.tiles[i]=vals[k]); e.quaked=Date.now(); },
    lootAhead:()=>{ let n=0; for(let k=1;k<=12&&n<2;k++){ const i=(e.pos+k)%24; if(!CORNER[i]&&e.tiles[i]==="chest"&&!isCleared(i)){ e.cleared[i]=e.lap; revealAt(i); n++; } } return n; },
    hit:null
  };
  return {c,out,isStay:()=>stay};
}
function woundMember(id,out){
  const m=M(id); if(!m||m.hp<=0) return;
  m.hp--; S.expr[id]="hurt";
  if(m.hp===1){ out.push(T2`${P(id).name}：${P(id).hurt}`,T2`§${P(id).name}受了重伤。之后掷骰都要掷两次取低；再受一次伤就会死。`); return; }
  if(E()&&E().amulet>0){ E().amulet--; S.items.amulet=0; m.hp=1; out.push(T("*牧师给的护身符碎了。*"),T2`§${P(id).name}本该死在这里。护身符替他挡了一下。`); return; }
  out.push(P(id).die,T2`§${P(id).name}死了。`);
  for(const o of alivePartyIds()){ const l=P(o).mourn[id]; out.push(l||T2`${P(o).name}：……${P(id).name}。`); break; }
  S.graves.push({id,faces:m.faces.map(x=>x.eq?x.under:{...x}),week:S.week});
}

/* ---------- checks ---------- */
function curOpt(){ const en=E().enc; return en&&en.check? en.def.opts(en).find(x=>x.id===en.check.opt):null; }
function dcOf(o){ const e=E(); let d=o.dc+(o.flat?0:LAP_DC[e.lap-1]+MAPS[e.map].tier)+(isDark()?2:0); if(o.pageBonus) d-=2*(e.goods.page||0); return Math.max(2,d); }
function eligible(o){ let al=alivePartyIds(); if(o.only) al=al.filter(id=>o.only.includes(id)); if(o.leaderOnly) al=al.filter(id=>id===E().leader); if(o.notLeader&&al.length>1) al=al.filter(id=>id!==E().leader); return al; }
function expected(id,o,en){ const d=withMode(dist1(M(id).faces,cxFor(id,o,en)),modeOf(id,o.stat,en)); let s=0; for(const [k,p] of d) s+=Math.min(k,20)*p; return s+((o.mod&&o.mod[id])||0); }
function openCheck(optId){
  const en=E().enc; const o=en.def.opts(en).find(x=>x.id===optId); if(!o) return;
  en.check={opt:optId,picks:[],favor:null};
  if(!o.free&&!o.pick){ const best=eligible(o).sort((a,b)=>expected(b,o,en)-expected(a,o,en))[0]; if(best) en.check.picks=[best]; }
  render(true);
}
function oddsFor(o,picks,favor){
  const e=E(), en=e.enc; let d=new Map([[0,1]]);
  for(const id of picks){ let di=withMode(dist1(M(id).faces,cxFor(id,o,en)),modeOf(id,o.stat,en)); if(o.mod&&o.mod[id]) di=shift(di,o.mod[id]); d=conv(d,di); }
  if(e.buff) d=shift(d,e.buff);
  const dc=dcOf(o);
  if(favor){ const F=favDef(favor);
    if(F.kind==="die"){ const fd=new Map(); F.faces.forEach(v=>add(fd,v,1/F.faces.length)); d=conv(d,fd); }
    else if(F.kind==="twenty") d=shift(d,20);
    else if(F.kind==="cheat"){ const m=new Map(); for(const [k,p] of d) add(m,k>=AUTO?AUTO:k+Math.min(F.cap,Math.max(0,dc-k)),p); d=m; } }
  if(e.dragonEye) return {ok:1,part:0,bad:0,dc};
  let ok=0,part=0; for(const [k,p] of d){ if(k>=dc) ok+=p; else if(k>=dc-2) part+=p; }
  return {ok,part,bad:Math.max(0,1-ok-part),dc};
}
function togglePick(id){
  const en=E().enc, o=curOpt(); const max=o.pick||o.maxN||2; const ps=en.check.picks;
  if(!o.pick&&!eligible(o).includes(id)) return;
  if(ps.includes(id)) ps.splice(ps.indexOf(id),1); else { if(ps.length>=max) ps.shift(); ps.push(id); }
  render(true);
}
function toggleFavor(k){ const en=E().enc; en.check.favor = en.check.favor===k? null : k; render(true); }
function cancelCheck(){ E().enc.check=null; render(true); }
function doFree(){
  const en=E().enc, o=curOpt(); const picks=en.check?en.check.picks:[];
  if(o.pick&&picks.length<o.pick) return;
  if(o.need&&o.need()) return;
  const {c,out,isStay}=ctxFor(en,null);
  o.run(en,c,picks);
  en.check=null;
  en.log.push(...out);
  if(!isStay()) return finishEnc([]);
  if(alivePartyIds().length===0) return finishEnc([]);
  render(true);
}
function doRoll(push){
  const e=E(), en=e.enc, o=curOpt(); const ck=en.check;
  if(!push&&!ck.picks.length) return;
  const dc=dcOf(o); const ev=[];
  const rolled=ck.picks.map(id=>{ const mode=modeOf(id,o.stat,en); const cx=cxFor(id,o,en); const r=rollMember(id,mode,cx,ev); const fs=M(id).faces; const mod=(o.mod&&o.mod[id])||0;
    return {id,mode,...r,shown:r.chain.map(i=>({...fs[i]})),vals:fs.map(x=>Math.min(20,fval(x,cx))),total:Math.min(AUTO,r.total+mod),mod}; });
  let favorRoll=null;
  if(push) favorRoll=en.res.favorRoll;
  else if(ck.favor){ const F=favDef(ck.favor); e.favors[ck.favor]--;
    if(F.kind==="die"){ const i=Math.floor(R()*F.faces.length); favorRoll={k:ck.favor,v:F.faces[i]}; }
    else if(F.kind==="twenty"){ favorRoll={k:ck.favor,v:20}; S.dragonUsed=true; }
    else { const rest=rolled.reduce((s,r)=>s+r.total,0)+e.buff; favorRoll={k:ck.favor,v:Math.min(F.cap,Math.max(0,dc-rest))}; S.guliDebt++; } }
  let total=Math.min(AUTO,rolled.reduce((s,r)=>s+r.total,0)+(favorRoll?favorRoll.v:0)+e.buff);
  const lines=[];
  if(e.buff&&!push){ lines.push(T2`§料理的力气：+${e.buff}`); }
  if(e.dragonEye&&!push){ total=Math.max(total,dc); e.dragonEye=0; lines.push(T("*黑暗里那只金色的眼睛眨了一下。*")); }
  const outcome= total>=dc?"ok": total>=dc-2?"part":"bad";
  if(!push){
    if(o.before){ const t=ctxFor(en,rolled); o.before(en,t.c,ck.picks); lines.push(...t.out); }
    else { const first=ck.picks[0]; lines.push(T2`${P(first).name}：${P(first).pick[o.stat]}`); }
    for(const r of rolled){ if(r.mode==="dis"&&fearsOf(r.id,en)){ const pp=P(r.id); lines.push(pp.scared.startsWith("*")?pp.scared:T2`${pp.name}：${pp.scared}`); } }
  } else lines.push(T("*咬咬牙，再来一次。*"));
  if(favorRoll&&!push){ lines.push(favDef(favorRoll.k).use); if(favorRoll.k==="mona") lines.push(favorRoll.v>0?T("*瓶子里炸出一团紫光。*"):T("*瓶子里冒出一个泡泡，啪地破了。*")); }
  if(ev.includes("fake")) lines.push(T("*「传说之剑」掷出去的一瞬间，碎成了好几截。咕哩……*"),T("§「传说之剑」是假货。这一面从此算 0。"));
  for(const r of rolled){
    const fc=M(r.id).faces[r.chain[0]];
    if(fc.tag==="fear"){ lines.push(P(r.id).fearFace.startsWith("*")?P(r.id).fearFace:T2`${P(r.id).name}：${P(r.id).fearFace}`); S.expr[r.id]="fear"; }
    else if(fc.tag==="scar"&&fc.against===en.def.disaster) lines.push(T2`§${P(r.id).name}掷出了「${fc.against}」的疤。自动成功。`);
    else if(fc.tag==="cheng"&&!e.chengUsed[r.id]){ e.chengUsed[r.id]=1; lines.push(T("格林：……成。"),T("§格林掷出了「成」：自动成功。这一趟里，它之后只算 5。")); }
    else if(r.chain.length>1){ lines.push(T2`${P(r.id).name}：${pick(P(r.id).boom)}`); S.expr[r.id]="triumph"; }
    for(const i of r.chain){ const f2=M(r.id).faces[i]; if(f2&&f2.eq&&EQ[f2.eq].bomb&&fval(f2,cxFor(r.id,o,en))>=AUTO){ M(r.id).faces[i]=f2.under; lines.push(T("*炸瓶炸开了。轰！*"),T("§炸瓶碎了，那一面还原。动静 +1")); e.noise=Math.min(3,e.noise+1); } }
  }
  const safe=rolled.some(r=>r.chain.some(i=>{ const f2=M(r.id).faces[i]; return f2&&f2.eq&&EQ[f2.eq].safe; }));
  const verdict = outcome==="ok"?T("成功"):outcome==="part"?T("勉强成功"):T("失败");
  if(outcome!=="bad"){
    const ids=ck.picks.slice().sort(); const key=ids.join("+");
    if(ids.length===2&&PAIR[key]&&PAIR[key].ok) lines.push(...PAIR[key].ok);
    else if(R()<.75){ const w=ck.picks[0]; lines.push(T2`${P(w).name}：${pick(P(w).ok)}`); }
    for(const r of rolled) if(!S.expr[r.id]) S.expr[r.id]="triumph";
  } else {
    const low=rolled.slice().sort((a,b)=>a.total-b.total)[0]; const fc=M(low.id).faces[low.chain[0]];
    if(!fc.tag&&!fc.eq&&fc.v===Math.min(...plain(M(low.id)).map(([x])=>x.v))) lines.push(T2`${P(low.id).name}：${pick(P(low.id).low)}`);
    for(const r of rolled) if(!S.expr[r.id]) S.expr[r.id]="fear";
  }
  e.buff=0;
  en.res={rolled,favorRoll,total,dc,outcome,verdict,pushed:!!push,lines:[],done:false,anim:true};
  if(outcome==="bad"&&safe){
    en.res.lines=[...lines,T("§精灵弓：这次失败，不用付代价。")]; en.res.done=!o.keepOnSafe; en.res.safe=true;
  } else if(outcome==="bad"&&!push){
    en.res.lines=[...lines,T("§失败了。可以推一把重掷一次：成了就算成功；再失败，后果照旧，而且掷骰的人骰子上会刻下一面「恐」。")];
    en.res.awaitPush=true;
  } else {
    const t=ctxFor(en,rolled);
    if(outcome==="ok") o.ok(en,t.c,ck.picks);
    else if(outcome==="part"){ o.ok(en,t.c,ck.picks); if(en.boss) t.c.torch(-1); else t.c.noise(1); t.out.unshift(T("§差一点。成功了，但付出了一点代价。")); }
    else { if(push&&o.pushBad) o.pushBad(en,t.c,ck.picks); else o.bad(en,t.c,ck.picks); if(push){ for(const r of rolled) if(M(r.id)&&M(r.id).hp>0&&addFear(r.id)) t.out.push(T2`§${P(r.id).name}的骰子上，刻下了一面「恐」。`); } }
    en.res.lines=[...lines,...t.out]; en.res.done=!t.isStay();
  }
  render(true);
}
function acceptFail(){
  const en=E().enc, o=curOpt(); const t=ctxFor(en,en.res.rolled); o.bad(en,t.c,en.check.picks);
  en.res.lines.push(T("*认了。*"),...t.out); en.res.awaitPush=false; en.res.done=!t.isStay(); en.res.anim=false;

function closeRes(){

/* ---------- bosses ---------- */
function enterBoss(){

function scoutLine(bk){ return {goblinKing:T("哥布林王做梦都在喊「妈，我错了」。"),swampMother:T("一个矿工的尸体漂过它身边，口袋里漏出来的盐，让它缩了一下。"),ghostLibrarian:T("幽灵每读完一页，就会抬头问一个问题。"),salamander:T("它很小心地绕开了每一滩水。"),guardian:T("它枯掉的那一半，在晨光里会疼得发抖。"),mirrorSelves:T("镜子里的人，用的是你们来时的骰子。")}[bk]; }

function bossDef(){ const bk=MAPS[E().map].boss; const B=BOSS[bk]; return {name:B.name,kind:T("头目"),art:B.art,intro:[...B.fight],opts:en=>bossOpts(en,bk)}; }
function defFromSrc(src){

function bossOpts(en,bk){
  const B=BOSS[bk]; const e=E(); const L=[];
  if(B.duel){ L.push({id:"duel",label:T("和来时的自己比一次"),hint:S.clues.mirror?T("你记得那句低语：平局算你们赢"):T("每个人掷现在的骰子，对面掷来时的"),free:true,run:(en,c)=>mirrorDuel(en,c)}); }
  if(B.item&&S.items[B.item.key]) L.push({id:"item",label:B.item.label,hint:T("直接赢"),free:true,run:(en,c)=>{ S.items[B.item.key]--; c.say(B.item.line); bossWin(en,c,bk); }});
  if(B.item2&&S.items[B.item2.key]) L.push({id:"item2",label:B.item2.label,hint:T("直接赢。但会改变很多东西"),free:true,run:(en,c)=>{ S.items[B.item2.key]--; S.flags[B.item2.flag]=1; c.say(B.item2.line); bossWin(en,c,bk); }});

  for(const o of (B.opts||[])) L.push({id:o.id,label:o.label,hint:o.hint||T2`还要 ${en.hp} 下`,stat:o.stat,dc:o.dc,mod:o.mod,pageBonus:o.pageBonus,
    ok:(en,c)=>{ c.say(o.hit); if(o.onHit) o.onHit(c); if(o.noHit){ c.stay(); return; } en.hp--; if(en.hp<=0) bossWin(en,c,bk); else { c.say(T2`§${B.name}还撑得住。还要 ${en.hp} 下。`); c.stay(); } },
    bad:(en,c)=>{ c.say(o.miss); if(o.fx==="wound") c.wound("roller"); else if(o.fx==="lower") c.lowerHigh("roller",2); else if(o.fx==="fear") c.fear("roller"); else if(o.fx==="torch") c.torch(-2); c.stay(); }});

function bossWin(en,c,bk){

function mirrorDuel(en,c){
  const duels=[];
  for(const id of alivePartyIds()){
    const m=M(id); let tries=0, a, b;
    do{ a=rollMember(id,m.hp===1?"dis":"norm",{stat:"胆"}); b=rollChain(m.orig,{stat:"胆"}); tries++; } while(a.total===b.total&&tries<3&&!S.clues.mirror);
    const win= a.total>b.total || (a.total===b.total&&S.clues.mirror);
    duels.push({id,a,b,win,af:{...m.faces[a.chain[0]],isNew:false},bf:{...m.orig[b.chain[0]]}});
  }
  en.duels=duels;
  const wins=duels.filter(d=>d.win).length; const victory=wins*2>=duels.length;
  for(const d of duels){
    c.say(T2`§${P(d.id).name}：现在 ${d.a.total} 对 来时 ${d.b.total}，${d.win?T("赢了"):T("输了")}。`);
    if(d.win){ raiseLow(d.id,2); S.expr[d.id]="triumph"; }
    else if(!victory) c.wound([d.id]);
  }
  if(victory){ c.say(T("§镜子把每个赢了的人骰子最小的那一面，换成了更好的。")); bossWin(en,c,"mirrorSelves"); }
  else { c.say(T("*镜子里的人笑了。它们比你们更像你们。*"),T("§赢的人不到一半。可以再比一次，或者逃。")); c.stay(); }
}

/* ---------- camp ---------- */
function openCamp(){ const e=E(); e.mode="camp"; e.camp={teacher:null,student:null,msg:[]}; S.seen["c-camp"]=1; render(true); }
function canTeach(t,s){ if(!t||!s||t===s) return false; return alivePartyIds().includes(t)&&alivePartyIds().includes(s); }
const TEACH_TXT={grin:T("教「稳」：把最小的一面磨大"),brand:T("教「赌」：一面变成会爆的 10，一面变成 1"),lai:T("陪着他：磨掉一面「恐」"),karl:T("教「剑」：最小的一面 +2"),titi:T("画一个法阵：最大的一面 +2")};
function teach(){
  const e=E(), c=e.camp, t=c.teacher, s=c.student; if(e.taught[e.lap]||!canTeach(t,s)) return;
  e.taught[e.lap]=1; const msg=[P(t).teach, (P(s).learn[t])||T2`${P(s).name}：……我记住了。`];
  if(s==="titi"){ const z=M("titi").faces.find(x=>!x.tag&&!x.eq&&x.v===0); if(z){ z.v=4; markNew(z); msg.push(T("缇缇：……（第一次，她没有躲开对方的眼睛）"),T("§缇缇骰子上的一个 0，变成了 4。")); c.msg=msg; return render(true); } }
  if(t==="grin"){ raiseLow(s,1); msg.push(T2`§${P(s).name}骰子最小的那一面，被磨成了更稳的数。`); }
  if(t==="brand"){ const cand=plain(M(s)).sort((a,b)=>a[0].v-b[0].v); if(cand.length>=2){ const mid=cand[Math.floor(cand.length/2)][0]; mid.v=10; mid.boom=true; markNew(mid); const low=cand[0][0]; low.v=1; low.boom=false; markNew(low);} msg.push(T2`§${P(s).name}的骰子上多了一面会爆的 10，也多了一面 1。`); }
  if(t==="lai"){ const fi=M(s).faces.findIndex(x=>x.tag==="fear"); if(fi>=0){ M(s).faces[fi]=markNew({v:3}); msg.push(T2`§${P(s).name}骰子上的「恐」被磨掉了。`);} else { raiseLow(s,1); msg.push(T2`§${P(s).name}骰子最小的那一面，变大了一点。`);} }
  if(t==="karl"){ raiseLow(s,2); msg.push(T2`§${P(s).name}骰子最小的那一面 +2。`); }
  if(t==="titi"){ const cand=plain(M(s)).sort((a,b)=>b[0].v-a[0].v); if(cand.length){ cand[0][0].v+=2; markNew(cand[0][0]); } msg.push(T2`§${P(s).name}骰子最大的那一面 +2。`); }
  c.msg=msg; render(true);
}
function bandage(id){ const e=E(); if(e.bandaged[e.lap]||M(id).hp!==1) return; e.bandaged[e.lap]=1; M(id).hp=2; e.camp.msg=[T2`*你们给${P(id).name}重新包扎了伤口。*`,T2`§${P(id).name}的伤好了。`]; render(true); }
function leaveCamp(){ const e=E(); const m=e.camp.msg; e.camp=null; e.mode="turn"; e.cleared[12]=e.lap; afterTurn(m.length?[]:[T("*篝火熄了。你们继续往前走。*")]); }

/* ---------- cards & peek ---------- */
function useCard(k){ const i=S.hand.indexOf(k); if(i>=0) S.hand.splice(i,1); }
function playCard(k){
  const e=E(); if(!e||e.mode!=="turn"||S.busy) return;
  if(k==="home"){ useCard(k); e.msg=[T("§回家卡。")]; return goHome("card"); }
  if(k==="scout"){ useCard(k); const n=revealAhead(6); e.msg=[n?T2`§侦察卡：翻开了前面 ${n} 格。`:T("§前面的路，你们已经都知道了。")]; return render(true); }
  if(k==="torch"){ useCard(k); e.torch+=4; e.msg=[T("§火把 +4。")]; return render(true); }
  if(k==="double"){ useCard(k); e.doubleNext=1; e.msg=[T("§加倍卡：下一件战利品翻倍。")]; return render(true); }
  if(k==="fix"){ e.mode="fix"; return render(true); }
  if(k==="twice"){ return doMove("twice"); }
}
function usePeekOut(){ const e=E(); if(e.peek<=0||!e.stuck) return; e.peek--; e.stuck=false; e.msg=[T("*你想起酒保说过：「迷路的时候，往有风的那边走。」*"),T("§走出了迷途角。这一回合正常掷骰。")]; render(true); }
function usePeekLook(){ const e=E(); if(e.peek<=0) return; e.peek--; const n=revealAhead(6); e.msg=[T("*你想起酒保擦着杯子说过的话。*"),n?T2`§先看一眼：翻开了前面 ${n} 格。`:T("§前面你们都知道了。")]; render(true); }

/* ---------- going home ---------- */
function retreat(){
  const e=E(); if(!e||S.busy) return;
  const n=Math.ceil(e.loot.length/2); const lost=[];
  for(let i=0;i<n;i++){ const idx=Math.floor(R()*e.loot.length); lost.push(e.loot.splice(idx,1)[0].name); }
  e.msg=[T("*你们决定不走了。顺着来时的路，一点一点往回爬。*"),n?T2`§爬回去的路上，丢了 ${n} 件战利品：${lost.join(T("、"))}。`:T("§身上本来也没什么东西。")];
  goHome("retreat");
}
function goHome(reason){
  const e=E(); if(!e) return; undoSwaps(); S.busy=false;
  const lines=[...(e.msg||[]).slice(-2)];
  const dead=alivePartyIds().length===0;
  if(!dead&&e.map==="mirror"){
    lines.push(T("*往上爬的路，比下来时长得多。上升的诅咒压在每个人肩上。*"));
    for(const id of alivePartyIds()){ const r=rollMember(id,modeOf(id,"胆",null),{stat:"胆"}); const need=4+(isDark()?2:0);
      if(r.total>=need) lines.push(T2`§${P(id).name}掷出 ${r.total}，平安爬了上去。`); else { lines.push(T2`§${P(id).name}掷出 ${r.total}，在路上出了事。`); woundMember(id,lines); } }
  }
  const alive=alivePartyIds().length>0;
  let gold=0, matBonus=0;
  if(alive){ for(const it of e.loot){ let v=it.v; if(it.mat&&S.known.mona){ const b=Math.round(v*.5); matBonus+=b; v+=b; } gold+=v; }
    for(const [k,v] of Object.entries(e.goods)) S.storage[k]=(S.storage[k]||0)+v; S.gold+=gold; }
  for(const id of [...e.party]){ if(S.party[id]&&S.party[id].hp<=0){ delete S.party[id]; S.order=S.order.filter(x=>x!==id); } }
  if(e.amulet===0&&S.items.amulet) S.items.amulet=0;
  S.ret={reason:alive?reason:"dead",lines,gold,matBonus,goods:{...e.goods},loot:[...e.loot],map:e.map,lap:e.lap,party:[...e.party],conquered:S.maps[e.map].conquered};
  S.E=null; S.phase="return"; clearNew(); S.expr={};
  render();
}

/* ================= weeks ================= */
function startWeek(){
  S.place=null; S.talkTo=null; S.talkLog=[]; S.weekMsg=[];
  const open=MAP_ORDER.filter(m=>S.maps[m].unlocked&&m!=="mirror");
  S.rivalMap=pick(open);
  if(S.week>=6&&!S.maps.mirror.unlocked){ S.maps.mirror.unlocked=true; S.weekMsg.push(T("§深渊在往上长。镜之渊自己浮了上来：现在可以去了。")); }
  if(S.letters>=3&&!S.maps.mirror.unlocked){ S.maps.mirror.unlocked=true; S.weekMsg.push(T("§三封信都找到了。小莱说：我们去最深的地方吧。镜之渊解锁了。")); }
  if(S.guliDebt>0){ const owe=S.guliDebt*25; const paid=Math.min(owe,S.gold); S.gold-=paid; const left=owe-paid; S.guliDebt=Math.ceil(left/25);
    S.weekMsg.push(T2`咕哩：嘿嘿，客人，金漆骰的钱……咕哩来收了。`,T2`§咕哩收走了 ${paid} 金。${left>0?T2`还欠他 ${left} 金。`:""}`); }
  if(S.week===2) S.weekMsg.push(T("§镇口好像来了个陌生人。"));
  if(S.week===3) S.weekMsg.push(T("§听说墓地里，晚上会出现一个影子。"));

}
function endWeek(){
  if(RENT_WEEKS.includes(S.week)){ S.phase="rent"; return render(); }
  S.week++; startWeek();
}
function payRent(how){
  const lines=[];
  if(how==="gold"){ S.gold-=RENT; lines.push(T("薇丝佩拉：……数目对。"),T("*龙用一根爪子把金币拨进了壁炉后面的洞里。那里传出金子落在金子上的声音。*")); }
  else if(how==="credit"){ S.rentCredit--; lines.push(T("薇丝佩拉：那个故事，抵这次。")); }
  else if(how==="story"){ S.stories--; lines.push(T2`*你讲了「${S.storyLog[S.storyLog.length-1]||T("一个故事")}」。*`,T("薇丝佩拉：……好。这次的租金，就是它了。")); }
  else { S.rentMiss++; S.gold=0; lines.push(T("薇丝佩拉：没有金子，也没有故事？"),T("*龙看了你很久。*"),T("薇丝佩拉：我会记住的。龙的记性，很好。")); }
  S.rentLines=lines;
  if(S.week>=WEEKS){ S.phase="final"; return render(); }
  S.week++; S.phase="rentdone"; render();
}

}

  const d=JSON.parse(json); if(!d||!d.party||!d.maps) throw new Error("bad save");

  const k=!!S.flags.karlSober; PEOPLE.karl.skin=k?"karl":"karl-old"; PEOPLE.karl.img=k?"karl-sober":"karl-drunk"; PEOPLE.karl.full=k?"p-karl-sober":"p-karl-drunk"; NPC.karl.img=PEOPLE.karl.full;

    ${ledger.length?T2`<div class="card col" style="gap:6px"><span class="eyebrow">人情账</span><div class="ledger">${ledger.map(([k,n,t])=>`<div class="pt round" style="${imgv(NPC[k].img)}"></div><span>${n}</span><span class="dim" style="font-size:12.5px">${t}</span>`).join("")}</div></div>`:""}

/* ================= board ================= */
function boardHTML(){
  const e=E(); const m=e.map;
  const tiles=[]; for(let i=0;i<24;i++){
    const col=colOf(i)+1, row=rowOf(i)+1; const here=e.pos===i;
    if(CORNER[i]){ const img=i===18?MAPS[m].lair:CORNER[i].img; seen(img);
      tiles.push(`<div class="tile corner${here?" here":""}" data-i="${i}" style="grid-column:${col};grid-row:${row};background-image:url(${A(img)})" title="${esc(tileName(i))}"><span class="tl">${i===18?(S.maps[m].conquered?T("空巢"):tileName(i)):CORNER[i].name}</span></div>`); continue; }
    const rev=isRevealed(i); const cl=isCleared(i);
    const icon=rev?tileIcon(i):"u-card"; seen(icon);
    tiles.push(`<div class="tile${rev?"":" hidden"}${cl?" cleared":""}${here?" here":""}${e.quaked&&!rev?" quake":""}" data-i="${i}" style="grid-column:${col};grid-row:${row}" title="${rev?esc(tileName(i)):T("还没翻开")}"><span class="num">${i}</span><div class="ti" style="${imgv(icon)}"></div><span class="tl">${rev?esc(tileName(i)):T("？")}</span></div>`); }
  const ld=e.leader&&M(e.leader)?e.leader:alivePartyIds()[0];
  const tp=tokPos(e.pos,0);
  const tok=ld?`<div class="tok" id="tok" style="left:${tp.x}%;top:${tp.y}%;${imgv(portraitKey(ld))}"></div>`:"";
  const ch=e.chaser!=null&&!e.chaserGone?(()=>{ const p=tokPos(e.chaser,2.2); return T2`<div class="tok chaser" style="left:${p.x}%;top:${p.y}%;${imgv("b-shadow")}" title="深处的东西"></div>`; })():"";
  const rv=e.rival!=null?(()=>{ const p=tokPos(e.rival,-2.2); seen("p-reyn"); return T2`<div class="tok rival" style="left:${p.x}%;top:${p.y}%;${imgv("p-reyn")}" title="银鹰队"></div>`; })():"";
  const mapImg=seen(`map-${m}-${e.lap}`);
  return T2`<div class="board" style="--map:url(${A(mapImg)})">${tiles.join("")}
    <div class="center"><span class="lapbadge">第 ${e.lap} 圈 · 难度 +${LAP_DC[e.lap-1]+MAPS[m].tier} · 战利品 ×${LAP_MULT[e.lap-1]}</span><div class="bname">${MAPS[m].name}</div></div>${ch}${rv}${tok}</div>`;
}

function bestOddsTxt(o){ const en=E().enc; const el=eligible(o).sort((a,b)=>expected(b,o,en)-expected(a,o,en)); if(!el.length) return T("没人能上"); const od=oddsFor(o,el.slice(0,o.maxN||2),null); const p=Math.round((od.ok+od.part)*100); return p<=0?T2`<span class="dis">没机会</span>`:T2`能过约 ${p}%`; }

  const total=GALLERY.reduce((s,g)=>s+g.length-1,0); const got=GALLERY.reduce((s,g)=>s+g.slice(1).filter(([k])=>S.seen[k]).length,0);
  return topBar()+T2`<section class="col" style="gap:16px"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">图鉴</span><h2>这局游戏里的每一张图</h2><p class="dim">一共 ${total} 张，这一局你已经在游戏里见过 ${got} 张（带 ✓ 的）。点开看大图。</p></div><button class="btn" data-act="back">回去</button></div>
    ${GALLERY.map(g=>`<span class="eyebrow">${g[0]}</span><div class="gal">${g.slice(1).map(([k,t])=>`<figure data-act="zoom" data-arg="${k}|${esc(t)}"><div class="gi" style="${imgv(k)}"></div><figcaption>${esc(t)}${S.seen[k]?" <i>✓</i>":""}</figcaption></figure>`).join("")}</div>`).join("")}</section>`;
}
function layerHTML(){
  if(S.zoom){ const [k,t]=S.zoom.split("|"); return `<div class="zoom" data-act="unzoom"><div><img src="${A(k)}" alt="${t}"><p>${t}</p></div></div>`; }
  if(S.showLegend) return T2`<div class="modal" data-act="unlegend"><div class="box"><h3>骰面说明</h3>${legend()}<p class="dim" style="font-size:13px">擅长的事掷两次取高；害怕的事、重伤时掷两次取低。勉强成功：差 2 点以内，成功但有代价。失败可以推一把重掷，再失败就刻一面「恐」。</p><button class="btn" data-act="unlegend">知道了</button></div></div>`;
  if(S.saveOpen){ const code=S.saveOpen==="import"?"":exportCode();
    return T2`<div class="modal"><div class="box"><div class="row" style="justify-content:space-between"><h3>存档</h3><button class="btn small" data-act="saveclose">关上</button></div>
      ${S.saveOpen==="import"?"":T2`<p class="dim" style="font-size:13.5px">游戏每走一步都会自动存在这个浏览器里，关掉页面再打开，点「继续上次的游戏」就行。换浏览器、换设备或者清了浏览器数据，自动存档就没了：想留着的话，把下面这串存档码复制下来。</p>
      <textarea readonly style="width:100%;height:110px;background:var(--wall2);color:var(--dim);border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px" onclick="this.select()">${code}</textarea>
      <div class="row"><button class="btn small" data-act="copysave">复制存档码</button><span class="dim" id="copied" style="font-size:12px"></span></div>
      <hr style="border:0;border-top:1px solid var(--rule);width:100%">`}
      <b>导入存档码</b><p class="dim" style="font-size:13px">把之前复制的存档码贴进来。会替换掉现在这局。</p>
      <textarea id="importbox" style="width:100%;height:80px;background:var(--wall2);color:var(--ink);border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px"></textarea>
      <div class="row"><button class="btn small primary" data-act="doimport">读取</button><span class="dis" id="importerr" style="font-size:12px"></span></div></div></div>`; }
  if(S.equipOpen){ const sel=S.equipSel;
    return T2`<div class="modal"><div class="box"><div class="row" style="justify-content:space-between"><h3>换装备</h3><button class="btn small" data-act="equipclose">完成</button></div>
      <p class="dim" style="font-size:13px">装备是一块贴片：盖住骰子上的一面，以后掷到这一面，就按装备算。它只在对应的那种检定里特别强（力：砍扛硬闯 · 巧：开锁躲 · 知：认东西解谜 · 胆：吓人谈判），别的时候数字很小。先选一件装备，再点某个人骰子上的一面，把它盖住。每颗骰子最多两件。点已经装上的装备，可以取下来。盖住哪一面，就是把这个人改成什么样的人。</p>
      <div class="row">${S.equip.map((k,i)=>`<button class="pickc" data-act="eqsel" data-arg="${i}" aria-pressed="${sel===i}" style="--hue:var(--torch)">${faceHTML({eq:k,under:{v:1}})}<div><b>${EQ[k].name}</b><span>${EQ[k].desc}</span></div></button>`).join("")||T2`<span class="dim">没有闲着的装备</span>`}</div>
      ${roster().filter(id=>M(id).hp>0).map(id=>`<div class="col" style="gap:4px"><b style="color:var(${P(id).hue});font-family:var(--f-display);font-weight:400">${P(id).name}</b><div style="max-width:300px">${net(M(id).faces,P(id).skin,id)}</div></div>`).join("")}</div></div>`; }
  return "";
}

/* ================= main render ================= */
function render(keep){
  if(typeof document==="undefined") return;
  const app=document.getElementById("app");
  const ph=S.phase;
  if(typeof document!=="undefined"){ document.title=LANG==="en"?"Three Dice Deep":T("深渊三骰"); document.documentElement.lang=LANG==="en"?"en":"zh"; }
  const langbar=`<div class="langbar"><button class="btn ghost small" data-act="lang" title="${LANG==="en"?T("切换到中文"):"Switch to English"}">${LANG==="en"?T("中文"):"English"}</button></div>`;
  app.innerHTML = langbar + (ph==="title"?renderTitle(): ph==="town"?renderTown(): ph==="place"?renderPlace(): ph==="prep"?renderPrep(): ph==="board"?renderBoard(): ph==="return"?renderReturn(): ph==="rent"?renderRent(): ph==="rentdone"?renderRentDone(): ph==="final"?renderFinal(): ph==="gallery"?renderGallery(): "");
  document.getElementById("layer").innerHTML=layerHTML();
  for(const l of document.querySelectorAll(".log")) l.scrollTop=l.scrollHeight;
  if(!keep) window.scrollTo({top:0});
  if(ph==="board"&&S.E&&window.innerWidth<980&&["enc","camp","entrance","pick2","fix","ward"].includes(S.E.mode)){ const pn=document.querySelector(".panel"); if(pn&&pn.getBoundingClientRect().top>window.innerHeight*.6) pn.scrollIntoView({block:"start",behavior:"smooth"}); }
  saveGame();
  if(S.E){ if(S.E.enc&&S.E.enc.res) S.E.enc.res.anim=false; if(S.E.moveRoll&&S.E.mode!=="moving") S.E.moveRoll.anim=false; S.E.quaked=0; }
}

/* ================= input ================= */
const ACT={
  start:()=>{ if(S.phase!=="title"||S.week!==1||S.E){ newGame(); } startWeek(); },
  continue:()=>{ const sv=loadSaved(); if(!sv) return; try{ restore(sv); }catch(err){ clearSave(); return render(); } render(); },
  saveopen:()=>{ S.saveOpen="all"; render(true); }, importopen:()=>{ S.saveOpen="import"; render(true); }, saveclose:()=>{ S.saveOpen=0; render(true); },
  copysave:()=>{ const t=document.querySelector(".modal textarea"); try{ navigator.clipboard.writeText(t.value).then(()=>{ const c=document.getElementById("copied"); if(c) c.textContent=T("复制好了"); },()=>{ t.select(); }); }catch(err){ t.select(); } },
  doimport:()=>{ const v=(document.getElementById("importbox")||{}).value||""; try{ importCode(v); S.saveOpen=0; render(); }catch(err){ const m=document.getElementById("importerr"); if(m) m.textContent=T("这串码读不出来。"); } },
  gallery:()=>{ S.galleryBack=S.phase; S.phase="gallery"; render(); },
  back:()=>{ S.phase=S.galleryBack||"title"; render(); },
  zoom:a=>{ S.zoom=a; render(true); }, unzoom:()=>{ S.zoom=null; render(true); },
  legend:()=>{ S.showLegend=1; render(true); }, unlegend:()=>{ S.showLegend=0; render(true); },
  place:k=>{ S.visitNo=(S.visitNo||0)+1; S.place=k; S.talkTo=null; S.talkLog=[]; S.phase="place"; render(); },
  leave:()=>{ S.phase="town"; S.place=null; S.talkTo=null; render(); },
  talk:n=>{ const r=TALK[n](true); S.known[n]=true; S.talkTo=n; S.talkLog=r.lines; render(true); },
  deal:a=>{ const [id,arg]=a.split("|"); const r=TALK[S.talkTo](false); const d=r.deals.find(x=>x.id===id); if(!d||d.can()) return; const out=d.run(arg); S.talkLog.push(...out); render(true); },
  equip:()=>{ S.equipOpen=1; S.equipSel=null; render(true); }, equipclose:()=>{ S.equipOpen=0; render(true); },
  eqsel:i=>{ S.equipSel=+i; render(true); },
  eqface:a=>{ const [id,idx]=a.split(":"); const fc=M(id).faces[+idx]; if(fc.eq){ removeEq(id,+idx); S.equipSel=null; return render(true); } if(S.equipSel==null) return; const k=S.equip[S.equipSel]; if(installEq(id,+idx,k)) S.equipSel=null; render(true); },
  prep:()=>{ const al=rosterAlive(); S.prep={map:S.prep&&S.maps[S.prep.map]&&S.maps[S.prep.map].unlocked?S.prep.map:"moss",party:al.slice(0,4),favors:[]}; S.phase="prep"; render(); },
  town:()=>{ S.phase="town"; render(); },
  skipweek:()=>{ S.ret=null; endWeek(); },
  pmap:m=>{ S.prep.map=m; render(true); },
  pmem:id=>{ const p=S.prep.party; const i=p.indexOf(id); if(i>=0) p.splice(i,1); else if(p.length<4) p.push(id); render(true); },
  pfav:k=>{ const f=S.prep.favors; const i=f.indexOf(k); if(i>=0) f.splice(i,1); else { if(f.length>=2) f.shift(); f.push(k); } render(true); },
  go:()=>startExpedition(),
  lead:id=>setLeader(id),
  roll:()=>doMove("roll"),
  pick2:k=>pickTwice(+k),
  fix:n=>doMove("fix",+n), fixcancel:()=>{ E().mode="turn"; render(true); },
  card:k=>playCard(k),
  peekout:()=>usePeekOut(), peeklook:()=>usePeekLook(),
  retreat:()=>retreat(), deeper:()=>continueDeeper(), home:()=>goHome("entrance"),
  ward:a=>useWard(a==="1"),
  opt:id=>openCheck(id), pk:id=>togglePick(id), fv:k=>toggleFavor(k), cancel:()=>cancelCheck(),
  roll2:()=>doRoll(false), push:()=>doRoll(true), accept:()=>acceptFail(), close:()=>closeRes(), dofree:()=>doFree(),
  encdone:()=>finishEnc([]),
  ct:id=>{ E().camp.teacher=id; if(E().camp.student===id) E().camp.student=null; render(true); },
  cs:id=>{ E().camp.student=id; render(true); },
  teach:()=>teach(), band:id=>bandage(id), leavecamp:()=>leaveCamp(),
  endweek:()=>{ if(checkGameOver()) return render(); endWeek(); },
  rent:a=>payRent(a), nextweek:()=>startWeek(),
  again:()=>{ newGame(); PEOPLE.karl.skin="karl-old"; PEOPLE.karl.img="karl-drunk"; PEOPLE.karl.full="p-karl-drunk"; NPC.karl.img="p-karl-drunk"; startWeek(); }
};
const __onClick=ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  if(S.busy&&!["zoom","unzoom","legend","unlegend"].includes(b.dataset.act)) return;
  const f=ACT[b.dataset.act]; if(f) f(b.dataset.arg);
};
return {onClick:__onClick,snap:()=>snapshot(),load:j=>{restore(j);render();},boot:()=>{newGame();render();},busy:()=>!!(S&&S.busy),lang:LANG};

}
const ZH2EN=EN_L, EN2ZH={}; for(const k in EN_L) if(!HAS.call(EN2ZH,EN_L[k])) EN2ZH[EN_L[k]]=k;
function convertState(json,to){ const map=to==="en"?ZH2EN:EN2ZH; const w=v=>{ if(typeof v==="string") return HAS.call(map,v)?map[v]:v; if(Array.isArray(v)) return v.map(w); if(v&&typeof v==="object"){ const o={}; for(const k in v) o[HAS.call(map,k)?map[k]:k]=w(v[k]); return o; } return v; }; return JSON.stringify(w(JSON.parse(json))); }
let GI=null;
function startLang(lang,json){ try{ localStorage.setItem("abyss-lang",lang); }catch(e){} GI=GAME(lang); if(json){ try{ GI.load(json); return; }catch(e){} } GI.boot(); }
document.addEventListener("click",ev=>{
  const b=ev.target.closest('[data-act="lang"]');
  if(b){ if(GI.busy()) return; const next=GI.lang==="en"?"zh":"en"; let j=null; try{ j=convertState(GI.snap(),next); }catch(e){} startLang(next,j); return; }
  GI.onClick(ev);
});
let initLang="zh"; try{ initLang=localStorage.getItem("abyss-lang")||"zh"; }catch(e){}
startLang(initLang==="en"?"en":"zh",null);
</script>
