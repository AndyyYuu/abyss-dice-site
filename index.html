<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊三骰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: the board is the table. Painted map in the middle, 24 stone tiles around it; the event panel sits beside it like a page of the story, the party's dice hang above */
:root{
  --stone:#15120d; --wall:#201b15; --wall2:#2a231b; --wall3:#352c21; --ink:#efe5d1; --dim:#a89c86; --rule:#3d3328;
  --torch:#e8a33d; --torch-ink:#1d1306; --blood:#d6584a; --moss:#9cc47c; --violet:#b48ae0; --sky:#7cb6d6;
  --c-brand:#e3824f; --c-grin:#cfa96c; --c-lai:#6fc4b6; --c-karl:#a9b7c4; --c-titi:#8fc6e8;
  --c-huo:#d98a57; --c-mona:#b48ae0; --c-guli:#e6c14a; --c-dragon:#86c06a; --c-grave:#b9ae98;
  --f-display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
html{background:var(--stone)}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% -10%,rgba(232,163,61,.10),transparent 60%)}
.app{max-width:1240px;margin:0 auto;padding-block:16px 60px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:28px;line-height:1.3}
h3{font-size:20px;line-height:1.35}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.dim{color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.adv{color:var(--moss)} .dis{color:var(--blood)} .warm{color:var(--torch)}

/* language toggle, top-left */
.langbar{display:flex;justify-content:flex-start;margin:0 0 8px}
.langbar .btn{padding:2px 12px;font-size:12.5px;letter-spacing:.06em}
:root[lang="en"]{--f-display:"Cormorant Garamond","Noto Serif SC",serif}
:root[lang="en"] .ln.say{grid-template-columns:6.8em minmax(0,1fr)}
:root[lang="en"] .mark{letter-spacing:.02em}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px 18px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:16px}
.mark{font-family:var(--f-display);font-size:28px;letter-spacing:.08em;line-height:1.2;cursor:default}
.mark small{font-family:var(--f-body);font-size:13px;color:var(--dim);letter-spacing:0;margin-left:10px}
.res{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.res b{color:var(--ink);font-weight:500}
.res .ri{display:inline-flex;align-items:center;gap:5px}
.ico{width:22px;height:22px;background:center/contain no-repeat;display:inline-block;flex:none;vertical-align:middle}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border:1px solid var(--blood);border-radius:2px}
.pips i.on{background:var(--blood)}
.pips.act i{border-color:var(--torch);border-radius:50%}
.pips.act i.on{background:var(--torch)}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;padding:8px 18px;cursor:pointer;line-height:1.4;transition:background .15s,color .15s,filter .15s}
.btn:hover:not(:disabled){background:var(--ink);color:var(--stone)}
.btn.primary{background:var(--torch);border-color:var(--torch);color:var(--torch-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--torch);color:var(--torch-ink)}
.btn.small{padding:4px 12px;font-size:13px}
.btn.ghost{border-color:var(--rule);color:var(--dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--torch);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* dice faces */
.die{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;position:relative;flex:none;
  background:var(--tx,none) center/cover, #d9cdb4;color:#fff6e4;font-family:var(--f-mono);font-weight:600;font-size:19px;
  text-shadow:0 1px 0 #000,0 0 3px #000,0 0 6px rgba(0,0,0,.8);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.5)}
.die.stk{background:var(--stk) center/120% no-repeat,#2b241b}
.die.stk span{position:absolute;right:3px;bottom:0;font-size:.72em}
.die.fear{box-shadow:inset 0 0 0 2px var(--blood)}
.die.scar{box-shadow:inset 0 0 0 2px #c79b6a}
.die .bm{position:absolute;top:-4px;right:-4px;width:42%;height:42%;background:url(a/f-boom-mini.webp) center/contain no-repeat;filter:drop-shadow(0 0 2px #000)}
.die.eq{box-shadow:inset 0 0 0 2px var(--torch)}
.die.new{animation:glow 1.6s ease-out 2}
.die.kept{outline:3px solid var(--torch);outline-offset:2px}
.die.big{width:68px;height:68px;font-size:28px;border-radius:12px}
.die.pick{cursor:pointer}
.die.pick:hover{outline:2px dashed var(--torch);outline-offset:2px}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--torch)}60%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.net{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.net .die{width:100%;height:auto;aspect-ratio:1;font-size:14px;max-width:40px;border-radius:6px}
.cube{width:76px;height:76px;background:var(--img) center/contain no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.cube.rolling{animation:tumble .5s linear infinite}
.cube.sm{width:34px;height:34px}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-8px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-6px)}100%{transform:rotate(360deg) translateY(0)}}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .die{width:24px;height:24px;font-size:11px;border-radius:5px}

/* portraits */
.pt{background:var(--img) center 18%/cover no-repeat,var(--wall2);border:1px solid var(--rule);flex:none}
.pt.round{border-radius:50%}
.pt.dead{filter:grayscale(1) brightness(.55)}

/* party strip */
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:12px}
.mem{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;background:var(--wall);border:1px solid var(--rule);border-left:3px solid var(--hue);padding:8px;position:relative}
.mem .pt{width:64px;height:76px;grid-row:span 2}
.mem .mh{display:flex;justify-content:space-between;gap:6px;align-items:baseline;line-height:1.3}
.mem .nm{font-family:var(--f-display);font-size:18px;color:var(--hue)}
.mem .meta{font-size:11.5px;color:var(--dim);line-height:1.4}
.mem.dead{opacity:.5}
.mem.lead{box-shadow:0 0 0 1px var(--torch) inset}
.mem .crown{position:absolute;top:6px;left:6px;font-size:11px;background:var(--torch);color:var(--torch-ink);padding:0 5px;font-family:var(--f-mono)}
button.mem{cursor:pointer;text-align:left;font:inherit;color:inherit}
button.mem:hover:not(:disabled){border-color:var(--torch)}
.hp{font-size:12px;font-family:var(--f-mono)}
.hp.ok{color:var(--moss)} .hp.hurt{color:var(--torch)} .hp.dead{color:var(--blood)}

/* board */
.play{display:grid;grid-template-columns:minmax(0,min(720px,calc(100svh - 96px))) minmax(340px,1fr);gap:20px;align-items:start}
.boardwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.board{position:relative;width:100%;max-width:760px;aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
  background:var(--map) center/cover no-repeat,#0f0d0a;border:2px solid #0b0907;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:background-image .6s}
.board .center{grid-column:2/7;grid-row:2/7;display:flex;flex-direction:column;justify-content:space-between;padding:4%;pointer-events:none}
.board .bname{font-family:var(--f-display);font-size:clamp(16px,2.6vw,26px);text-shadow:0 2px 6px #000,0 0 12px #000;letter-spacing:.1em}
.board .lapbadge{align-self:flex-start;font-family:var(--f-mono);font-size:12px;background:rgba(15,12,9,.78);border:1px solid var(--rule);padding:2px 8px;color:var(--torch)}
.tile{position:relative;background:#1a1610 center/cover no-repeat;border:1px solid #0b0907;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,235,200,.06);pointer-events:none}
.tile .ti{width:76%;height:76%;background:var(--img) center/contain no-repeat;border-radius:10%}
.tile.hidden .ti{opacity:.45;width:58%;height:58%}
.tile.cleared .ti{filter:grayscale(.8) brightness(.55)}
.tile .tl{position:absolute;left:0;right:0;bottom:0;font-size:clamp(8.5px,1.25vw,12px);line-height:1.25;text-align:center;padding:2px 1px;background:linear-gradient(transparent,rgba(10,8,6,.92) 40%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.corner .tl{font-family:var(--f-display);font-size:clamp(10px,1.5vw,14px)}
.tile.here{box-shadow:inset 0 0 0 2px var(--torch)}
.tile.aim{box-shadow:inset 0 0 0 2px var(--moss)}
.tile .num{position:absolute;top:1px;left:3px;font-family:var(--f-mono);font-size:9px;color:var(--dim);opacity:.6}
.tile.quake{animation:quake .4s 2}
@keyframes quake{0%,100%{transform:none}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.tok{position:absolute;width:9.5%;aspect-ratio:1;border-radius:50%;border:2px solid var(--torch);box-shadow:0 0 0 2px #000,0 0 14px rgba(232,163,61,.6);
  background:var(--img) center 15%/cover,#222;transition:left .16s linear,top .16s linear;z-index:3;pointer-events:none;transform:translate(-50%,-50%)}
.tok.chaser{border-color:var(--blood);box-shadow:0 0 0 2px #000,0 0 16px rgba(214,88,74,.8);z-index:2;width:8.5%}
.tok.rival{border-color:#c9d3dc;box-shadow:0 0 0 2px #000;width:7%;z-index:2;opacity:.9}
.party.compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 10px}
.party.compact .mem{grid-template-columns:44px minmax(0,1fr);padding:6px;gap:2px 8px}
.party.compact .mem .pt{width:44px;height:52px}
.party.compact .mem .nm{font-size:16px}
.party.compact .mem .meta{display:none}
.party.compact .net .die{font-size:12px}
.party.compact .crown{top:2px;left:2px;font-size:10px}
.boardnote{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:8px}

/* panel */
.panel{background:var(--wall);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.kind{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--torch);border:1px solid var(--torch);padding:0 8px}
.art{width:100%;aspect-ratio:16/10;background:var(--img) center/cover no-repeat,#120f0b;border:1px solid var(--rule)}
.art.sq{aspect-ratio:1/1;max-height:240px}
.art.tall{aspect-ratio:16/10;background-position:center 22%}
.art.mini{aspect-ratio:16/5;max-height:120px}
.log{display:flex;flex-direction:column;gap:7px;max-height:min(42vh,420px);overflow-y:auto}
.ln{max-width:64ch}
.ln.narr{color:var(--dim);font-style:italic}
.ln.say{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:8px}
.ln .who{font-family:var(--f-display);color:var(--hue,var(--ink));font-size:15px;padding-top:1px}
.ln.sys{font-family:var(--f-mono);font-size:12.5px;border-left:3px solid var(--torch);padding:4px 10px;background:var(--wall2);max-width:none}
.ln.sys.bad{border-left-color:var(--blood)}
.ln.late{animation:fade .35s ease-out both;animation-delay:.8s}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opt{border:1px solid var(--rule);background:var(--wall2);padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;line-height:1.5}
.opt b{font-weight:600;font-size:14.5px}
.opt span{font-size:12px;color:var(--dim)}
.opt .st{font-family:var(--f-mono);font-size:12px;color:var(--torch)}
.opt:hover:not(:disabled){border-color:var(--torch)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.check{border:1px solid var(--torch);background:var(--wall2);padding:12px;display:flex;flex-direction:column;gap:10px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.pickc{border:1px solid var(--rule);background:var(--wall);padding:6px 8px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;border-left:3px solid var(--hue);line-height:1.35}
.pickc .pt{width:34px;height:34px;border-radius:50%}
.pickc[aria-pressed="true"]{border-color:var(--torch);border-left-color:var(--hue);background:#3a2e20}
.pickc:disabled{opacity:.35;cursor:not-allowed}
.pickc b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--hue);display:block}
.pickc span{font-size:11.5px;color:var(--dim)}
.odds{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--rule)}
.odds i{display:block;height:100%}
.odds .o1{background:var(--moss)} .odds .o2{background:var(--torch)} .odds .o3{background:var(--blood)}
.oddtxt{display:flex;gap:4px 14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px}
.tray{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:4px 0}
.tray .slot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
.tray .slot .who{font-family:var(--f-display);font-size:14px;color:var(--hue)}
.tray .chain{display:flex;gap:4px;align-items:center}
.tray .plus{font-family:var(--f-mono);color:var(--torch)}
.tray .sum{font-family:var(--f-mono);font-size:24px;color:var(--ink);align-self:center;padding:0 2px}
.reveal{animation:pop .3s ease-out both;animation-delay:.6s}
.tray .cubes{animation:vanish .2s ease-in both;animation-delay:.55s}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes vanish{to{opacity:0;width:0;height:0}}
.verdict{font-family:var(--f-display);font-size:22px}
.verdict.ok{color:var(--moss)} .verdict.part{color:var(--torch)} .verdict.bad{color:var(--blood)}
.face-react{display:flex;gap:8px}
.face-react .pt{width:72px;height:96px}

/* cards */
.hand{display:flex;gap:8px;flex-wrap:wrap}
.cardc{width:104px;border:1px solid var(--rule);background:var(--wall2);padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;cursor:pointer;line-height:1.35}
.cardc .cb{width:52px;height:68px;background:url(a/u-card.webp) center/contain no-repeat}
.cardc b{font-size:13px}
.cardc span{font-size:11px;color:var(--dim)}
.cardc:hover:not(:disabled){border-color:var(--torch)}
.cardc:disabled{opacity:.4;cursor:not-allowed}

/* town */
.scene{position:relative;width:100%;aspect-ratio:16/8;background:var(--img) center/cover no-repeat,#120f0b;border:1px solid var(--rule);overflow:hidden}
.scene.short{aspect-ratio:16/5}
.scene .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,12,9,0) 40%,rgba(15,12,9,.92))}
.scene .cap{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.place{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;border:1px solid var(--rule);background:var(--wall);padding:8px;text-align:left;cursor:pointer;line-height:1.4}
.place .faces{display:flex}
.place .faces .pt{width:44px;height:54px;border-radius:4px;margin-right:-10px;box-shadow:0 0 0 2px var(--wall)}
.place b{font-family:var(--f-display);font-weight:400;font-size:17px}
.place span{font-size:12px;color:var(--dim)}
.place:hover:not(:disabled){border-color:var(--torch)}
.place:disabled{opacity:.4;cursor:not-allowed}
.place .new{color:var(--torch);font-family:var(--f-mono);font-size:11px}
.npcs{display:flex;gap:12px;flex-wrap:wrap}
.npc{width:150px;border:1px solid var(--rule);background:var(--wall);cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column}
.npc .pt{width:100%;aspect-ratio:2/3;height:auto;border:0}
.npc b{font-family:var(--f-display);font-weight:400;font-size:16px;padding:4px 8px 0}
.npc span{font-size:11.5px;color:var(--dim);padding:0 8px 6px;line-height:1.35}
.npc[aria-pressed="true"]{border-color:var(--torch);background:#3a2e20}
.npcs.mini .npc{width:96px}
.npcs.mini .npc .pt{aspect-ratio:1/1;background-position:center 15%}
.npcs.mini .npc span{display:none}
.talk{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.talk .pt{width:200px;aspect-ratio:2/3;height:auto}
.deals{display:flex;flex-direction:column;gap:8px}
.deal{border:1px solid var(--rule);background:var(--wall2);padding:10px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.deal div{display:flex;flex-direction:column;gap:2px;max-width:46ch}
.deal b{font-weight:600;font-size:14.5px}
.deal span{font-size:12.5px;color:var(--dim)}
.ledger{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:13px}
.ledger .pt{width:32px;height:32px;border-radius:50%}
.goods{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.goods b{color:var(--torch);font-family:var(--f-mono)}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--wall);border:1px solid var(--rule);padding:12px 14px}
.townmain{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}

/* map select */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.mapc{border:1px solid var(--rule);background:var(--wall);padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.mapc .mi{aspect-ratio:1;background:var(--img) center/115% no-repeat}
.mapc .mt{padding:6px 10px 8px;display:flex;flex-direction:column;gap:1px;line-height:1.4}
.mapc b{font-family:var(--f-display);font-weight:400;font-size:17px}
.mapc span{font-size:11.5px;color:var(--dim)}
.mapc[aria-pressed="true"]{border-color:var(--torch);box-shadow:0 0 0 1px var(--torch)}
.mapc:disabled{cursor:not-allowed}
.mapc:disabled .mi{filter:grayscale(1) brightness(.35)}
.mapc .done{color:var(--moss);font-family:var(--f-mono);font-size:11px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:3px;cursor:zoom-in}
.gal .gi{aspect-ratio:1;background:var(--img) center/contain no-repeat,#100d0a;border:1px solid var(--rule)}
.gal figcaption{font-size:11.5px;color:var(--dim);line-height:1.35}
.gal figcaption i{color:var(--moss);font-style:normal}
.zoom{position:fixed;inset:0;background:rgba(5,4,3,.92);display:grid;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:86vh;box-shadow:0 0 40px #000}
.zoom p{margin-top:10px;text-align:center}

/* title */
.title{position:relative;display:grid;gap:18px}
.title .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:820px}
.title .trio .pt{aspect-ratio:2/3;height:auto;width:100%;background-position:center top}
.title .trio figure{margin:0;display:flex;flex-direction:column;gap:6px}
.title .trio figcaption{font-size:13px;color:var(--dim)}
.title .trio figcaption b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--hue);display:block}
.big{font-family:var(--f-display);font-size:clamp(40px,8vw,84px);letter-spacing:.12em;line-height:1.05;text-shadow:0 4px 18px #000}
.total{font-family:var(--f-mono);font-size:40px;line-height:1.1;color:var(--torch)}

.modal{position:fixed;inset:0;background:rgba(8,6,4,.78);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--wall);border:1px solid var(--torch);max-width:520px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}

@media (max-width:980px){
  .play,.townmain{grid-template-columns:minmax(0,1fr)}
  .party.compact{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .boardwrap{position:static}
}
@media (max-width:620px){
  .talk{grid-template-columns:minmax(0,1fr)}
  .talk .pt{width:120px}
  .tile .tl{display:none}
  .tile.corner .tl{display:block;font-size:9px}
  .party{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mem{grid-template-columns:44px minmax(0,1fr);padding:6px}
  .mem .pt{width:44px;height:56px}
  .scene{aspect-ratio:16/9}
  .ln.say{grid-template-columns:3.6em minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.cube.rolling,.die.new,.ln.late,.reveal,.tray .cubes,.tile.quake{animation:none}.tok{transition:none}}
</style>

<script>
const EN_L={"力：硬闯、扛、打":"Might: barge, haul, hit","巧：开锁、拆机关、躲":"Craft: locks, traps, dodging","知：认东西、解谜":"Wits: knowing things, riddles","胆：面对恐怖、谈判":"Nerve: horrors, haggling","布兰德":"Brand","吹牛的战士":"Braggart Warrior","怕黑":"afraid of the dark","两个 1，一个 12。要么一个人掀翻一层，要么当众出丑。":"Two 1s and a 12. Either he flattens a floor on his own, or he makes a fool of himself in front of everyone.","跟我来！走最快的那条路！":"Follow me! Fastest way through!","交给我！":"Leave it to me!","这种小事……也交给我！":"A little thing like this... also leave it to me!","动脑子？行吧，我脑子也很大。":"Use my head? Fine. I've got a big head.","怕？我字典里没这个字！":"Scared? Never heard of it!","看——见——没——！！！":"DID — YOU — SEE — THAT — !!!","还没完！还没完！！":"Not done! Not done yet!!","这、这次不算！手滑了！":"Th-that doesn't count! My hand slipped!","……刚才有只虫子飞进我眼睛里了。":"...A bug just flew in my eye.","哈！轻轻松松！":"Ha! Easy!","记住今天，这叫传说。":"Remember today. This is how legends start.","这不怪我！是地面不平！":"Not my fault! The floor's crooked!","谁推我？刚才是不是有人推我？":"Who pushed me? Did someone just push me?","……我、我们回去吧？就这一次。":"...C-can we go back? Just this once?","火、火把呢？谁把火把弄灭了？！":"T-torch! Who put out the torch?!","皮外伤！……嘶——皮外伤！":"Just a scratch! ...Hss — just a scratch!","*布兰德倒下去之前，嘴里还在喊着「看见没」。*":"*Even as he fell, Brand was still shouting \"did you see that\".*","布兰德：老头……你起来啊……你还欠我一杯酒……":"Brand: Old man... get up... you still owe me a drink...","布兰德：……是我没护住她。是我。":"Brand: ...I didn't protect her. That's on me.","布兰德：听好了，人生就是要赌！要么 12，要么 1，中间那些都是浪费！":"Brand: Listen. Life's a gamble! Twelve or one, everything in between is a waste!","布兰德：稳？……行吧，老头说的，我听一次。":"Brand: Steady? ...Fine. The old man says so. Just this once.","布兰德：……我没事。我真的没事。……谢谢。":"Brand: ...I'm fine. I'm really fine. ...Thanks.","*布兰德讲了他单挑食人魔的故事。讲到第三遍时，食人魔已经变成了两头。*":"*Brand told the story of the time he took on an ogre alone. By the third telling, it was two ogres.*","布兰德：镜子里那个是谁？长得还挺帅。":"Brand: Who's that in the mirror? Handsome devil.","布兰德回到酒馆，把这一趟讲了一整晚。每讲一遍，怪就大一圈。":"Brand went back to the tavern and told the story of this trip all night. Every telling, the monsters got bigger.","酒馆里再也没人那么大声地吹牛了。":"Nobody in the tavern brags that loudly anymore.","格林":"Grim","矮人老兵":"Dwarf Veteran","怕水":"afraid of water","最小 3，最大 5。从不惊艳，也从不掉链子。":"Lowest 3, highest 5. Never dazzles. Never drops the ball.","我走前面。踩着我的脚印。":"I'll go first. Step where I step.","嗯。":"Mm.","手没以前稳了。试试。":"Hands aren't what they were. I'll try.","笔记本上有。":"It's in the notebook.","怕过。现在不怕了。":"Was scared once. Not anymore.","……嗯。":"...Mm.","不好看。但能用。":"Not pretty. But it works.","……老了。":"...Getting old.","记下来。":"Noting that.","够了。":"Enough.","第八次也没成。……记下来。":"Eighth time, still no. ...Noting that.","我算错了一步。":"I miscounted a step.","*格林的手在抖。他把笔记本攥得很紧，指节发白。*":"*Grim's hands are shaking. He grips his notebook so hard his knuckles go white.*","矮人……不游泳。":"Dwarves... don't swim.","老骨头了。还撑得住。":"Old bones. Still holding.","*格林靠着墙坐下，把笔记本合上，放在膝盖上。他没有再睁开眼睛。*":"*Grim sat down against the wall, closed his notebook, and laid it on his knees. He did not open his eyes again.*","*格林没说话。他在笔记本上写下了布兰德的名字，写得很慢。*":"*Grim said nothing. He wrote Brand's name in his notebook, very slowly.*","格林：丫头……我答应过要把你带回去的。":"Grim: Lass... I promised I'd bring you home.","格林：不求快。不求大。每一下都要站稳。":"Grim: Not fast. Not big. Every step, feet planted.","格林：赌？我这把年纪……也罢。":"Grim: Gamble? At my age... why not.","*格林看着小莱，好像想起了很久以前的什么人。他的手不抖了。*":"*Grim looks at Lai as if remembering someone from long ago. His hands stop shaking.*","*格林把前七次失败一次一次讲完，一句都没有夸张。*":"*Grim told all seven of his failures, one by one, without exaggerating a word.*","格林：镜子里的我，比现在年轻。……那时候我什么都不懂。":"Grim: Me in the mirror, I'm younger. ...Knew nothing back then.","格林在笔记本上新写了一页。":"Grim wrote a new page in his notebook.","格林的笔记本被带回了镇上。最后一页只写了一半。":"Grim's notebook came back to town. The last page was only half written.","小莱":"Lai","深渊口的孤儿":"Orphan of the Abyss","怕死人骨头":"afraid of dead men's bones","一到六，一张白纸。最小的那几面，最值得被改写。":"One to six. A blank page. The smallest faces are the ones most worth rewriting.","我、我来带路！我眼睛最尖！":"I-I'll lead! I've got the sharpest eyes!","我、我力气不大……但我试试！":"I-I'm not very strong... but I'll try!","这个我会！":"I can do this one!","我在书上看过……好像。":"I read about this in a book... I think.","……我不怕。我爹娘也下来过。":"...I'm not scared. Mum and Dad came down here too.","咦？还能再来？！":"Huh? I get another go?!","再来一次！再来一次！":"Again! Again!","呜……":"Waah...","对、对不起……":"S-sorry...","我做到了！你们看到了吗！":"I did it! Did you see?!","嘿嘿！":"Hehe!","对不起……":"Sorry...","我下次会更好的……":"I'll do better next time...","*小莱蹲在地上，捂着耳朵，一动不动。*":"*Lai crouches on the ground with her hands over her ears and doesn't move.*","那、那是……骨头……":"Th-that's... bones...","不疼……一点都不疼……":"It doesn't hurt... not even a little...","*小莱倒在地上，手里还攥着出发前你给她的那块面包。*":"*Lai lay on the ground, still clutching the bread you gave her before you set out.*","小莱：布兰德大叔！！……你说过要教我扔斧头的……":"Lai: Uncle Brand!! ...You said you'd teach me to throw an axe...","*小莱把格林的笔记本捡起来，紧紧抱在怀里。*":"*Lai picks up Grim's notebook and hugs it tight.*","*小莱坐到旁边，什么也没说，只是靠着他。过了一会儿，他的呼吸慢了下来。*":"*Lai sits down beside him without a word and just leans against him. After a while, his breathing slows.*","小莱：要么 12，要么 1……好刺激！":"Lai: Twelve or one... so exciting!","小莱：站稳……站稳……嗯！":"Lai: Feet planted... feet planted... okay!","*小莱讲了她爹娘下地下城的那天早上。她讲得很慢。*":"*Lai told about the morning her parents went down into the dungeon. She told it very slowly.*","小莱：镜子里的我……好小。":"Lai: Me in the mirror... I'm so small.","小莱回到镇上，第一件事是去墓地，跟她爹娘说：我下去过了。":"Back in town, the first thing Lai did was go to the graveyard and tell her parents: I went down there.","你在小屋门口放了一块面包，放了很多天。":"You left a piece of bread outside the cottage door. For many days.","卡尔":"Karl","前剑术冠军":"Former Sword Champion","对着头目会收剑":"pulls his blade against bosses","三面烂得像酒渣，三面还是冠军。":"Three faces rotten as dregs, three still a champion's.","……跟上。":"...Keep up.","……退后。":"...Stand back.","剑尖比手稳。":"The tip is steadier than the hand.","我只懂剑。……但我看看。":"I only know swords. ...But I'll look.","我怕过一次。就一次。":"I was afraid once. Only once.","这才是剑。":"That's a sword.","……手还记得。":"...The hand remembers.","酒还没醒。":"Still drunk.","……哈。真难看。":"...Ha. Ugly.","还行。":"Fine.","当年我不会失手的。":"Back then, I wouldn't have missed.","……再给我一杯。不，不用了。":"...Another drink. No. Never mind.","*卡尔握剑的手停在半空。和那年决赛一样。*":"*Karl's sword hand stops in midair. Just like that final.*","*卡尔的剑，又一次收住了。*":"*Karl's blade stops short. Again.*","这点伤……比那年轻多了。":"This wound... lighter than that year's.","*卡尔倒下的时候，剑没有收住。这一次，他刺出去了。*":"*When Karl fell, his blade didn't stop. This time, he thrust.*","卡尔：剑不是赌，也不是稳。剑是你决定刺出去的那一下。":"Karl: A sword isn't a gamble, and it isn't steadiness. It's the moment you decide to thrust.","*卡尔讲了那场决赛。他收住了剑，输了冠军，也输了唯一的学生。*":"*Karl told about that final. He pulled his blade, lost the title, and lost his only student.*","卡尔：镜子里那个人，没有收剑。":"Karl: The man in the mirror didn't pull his blade.","卡尔回到酒馆，点了一杯水。":"Karl went back to the tavern and ordered a glass of water.","酒馆角落那张桌子，再也没人坐。":"The table in the corner of the tavern stays empty now.","缇缇":"Titi","不敢考试的法师":"Mage Too Scared for Exams","怕见人":"afraid of people","两个 0，一个 15。不是不会，是不敢。":"Two 0s and a 15. It's not that she can't. It's that she doesn't dare.","我……我带？好、好吧……":"M-me... lead? O-okay...","诶？我、我吗……":"Eh? M-me...?","……（点头）":"...(nods)","这个……我知道。我、我真的知道。":"This... I know this. I-I really do.","能、能不说话吗……":"C-can I not talk...?","……！":"...!","……对不起，对不起，对不起。":"...Sorry, sorry, sorry.","（脸埋进帽子里）":"(hides her face in her hat)","……成、成了。":"...I-it worked.","（小声）我是不是……做到了。":"(quietly) Did I... actually do it?","我考试也是这样……":"My exams go like this too...","……大家都在看我……":"...Everyone's looking at me...","*缇缇把帽檐拉到下巴。她的骰子上，那两个 0 好像更大了。*":"*Titi pulls her hat brim down to her chin. The two 0s on her die seem to grow.*","……有、有人……（躲到你身后）":"...P-people... (hides behind you)","……不、不用管我……":"...D-don't mind me...","*缇缇倒下的时候，手里的法术刚刚念完。那是她念得最响的一次。*":"*As Titi fell, the spell in her hands was just finishing. It was the loudest she had ever spoken.*","*缇缇在地上画了一个法阵，一句话也没说。画完以后，她抬头看了对方一眼。*":"*Titi drew a circle on the ground without saying a word. When she finished, she glanced up at the other.*","*缇缇讲了她考试那天。她站在台上，一个字也没说出来。*":"*Titi told about her exam day. She stood on the stage and couldn't say a single word.*","缇缇：镜子里的我……在说话。":"Titi: Me in the mirror... is talking.","缇缇回到法师塔，报名了下一次考试。":"Titi went back to the mage tower and signed up for the next exam.","法师塔的考场上，有一个座位一直空着。":"In the exam hall of the mage tower, one seat stays empty.","布兰德：看见没老头！":"Brand: See that, old man?!","格林：是我那一下。":"Grim: That was my hit.","格林：你太急了。":"Grim: You're too hasty.","布兰德：是你太慢了！":"Brand: You're too slow!","布兰德：好样的小不点！":"Brand: Good one, little'un!","小莱：嘿嘿！":"Lai: Hehe!","布兰德：没事没事，下次大叔一个人来。":"Brand: Don't worry, next time Uncle Brand handles it alone.","小莱：……":"Lai: ...","格林：站得很稳。":"Grim: Good footing.","小莱：真的吗！":"Lai: Really?!","格林：没关系。我第一次也这样。":"Grim: It's all right. First time, I was the same.","布兰德：老酒鬼，有两下子嘛！":"Brand: Old drunk's got a few moves!","卡尔：……你也是。":"Karl: ...So do you.","卡尔：你出手太早。":"Karl: You struck too early.","布兰德：你出手太晚！":"Brand: You struck too late!","小莱：卡尔叔叔好厉害！":"Lai: Uncle Karl, you're amazing!","卡尔：……别叫叔叔。":"Karl: ...Don't call me uncle.","小莱：缇缇姐姐！":"Lai: Big sis Titi!","缇缇：（小声）……嗯。":"Titi: (quietly) ...Mm.","格林：书上学的？":"Grim: Learned it from a book?","缇缇：……嗯。":"Titi: ...Mm.","格林：好书。":"Grim: Good book.","老霍":"Old Ho","铁匠的铁骰":"the smith's iron die","*你想起老霍塞给你铁骰时说的话：「它不会让你出丑，也不会让你发财。」*":"*You remember what Old Ho said when he pressed the iron die into your hand: \"It won't embarrass you, and it won't make you rich.\"*","莫娜":"Mona","炼金师的玻璃骰":"the alchemist's glass die","*你把莫娜的玻璃骰扔了出去。里面的紫色液体晃了一下。*":"*You toss Mona's glass die. The purple liquid inside sloshes.*","咕哩":"Guli","骗子的金漆骰":"the swindler's gilded die","*金漆骰在地上转了很久，停在了你想要的那一面。远处好像传来咕哩的笑声。*":"*The gilded die spins a long time and stops on exactly the face you wanted. Somewhere far off, you think you hear Guli laughing.*","薇丝佩拉":"Vespera","龙鳞骰":"dragon-scale die","*龙鳞骰落地的一瞬间，整条通道都安静了。你听见很远的地方，有一条龙轻轻笑了一声。*":"*The moment the dragon-scale die lands, the whole tunnel goes silent. Very far away, a dragon chuckles softly.*","老霍的铁剑":"Old Ho's Iron Sword","剑":"Swd","砍、扛、硬闯（力）时掷到它，算 7。开锁、认东西、谈判这些时候，算 3。走路也算 3。":"When you roll it to hack, haul or barge (Might), it counts 7. For locks, knowing things, haggling, it counts 3. Walking: 3.","撬棍":"Crowbar","撬":"Bar","开锁、拆机关、躲（巧）时掷到它，算 6。别的时候算 2。":"When you roll it for locks, traps, dodging (Craft), it counts 6. Otherwise 2.","大师剑":"Master Sword","剑★":"Swd★","砍、扛、硬闯（力）时掷到它，直接成功。别的时候算 6。":"When you roll it to hack, haul or barge (Might), it's an automatic success. Otherwise 6.","「传说之剑」":"\"Legendary Sword\"","砍、扛、硬闯（力）时掷到它，算 9。别的时候算 4。咕哩发誓是真货。":"When you roll it to hack, haul or barge (Might), it counts 9. Otherwise 4. Guli swears it's genuine.","炸瓶":"Bomb Flask","炸":"Bmb","打怪物、用力的时候掷到它，直接成功，但会很吵；炸完就碎，那一面变回原样。别的时候算 0。":"Roll it while fighting monsters with Might: automatic success, but loud. It shatters after one blast and the face returns to normal. Otherwise 0.","精灵弓":"Elven Bow","弓":"Bow","开锁、拆机关、躲（巧）时掷到它，算 6。别的时候算 2。掷到这一面时，这次失败不用付代价。":"When you roll it for locks, traps, dodging (Craft), it counts 6. Otherwise 2. If this face comes up, a failure costs you nothing.","法术书页":"Spell Page","咒":"Spl","认东西、解谜（知）时掷到它，算 8。别的时候算 3。":"When you roll it for knowing things or riddles (Wits), it counts 8. Otherwise 3.","诅咒之刃":"Cursed Blade","渊":"Aby","不管做什么，掷到它都算 15。装上的同时，骰子另一面会变成「恐」（算 0）。":"Whatever you're doing, it counts 15. When you fit it, another face on the die turns to Fear (counts 0).","回家卡":"Home Card","带着所有东西，立刻回到地面。":"Return to the surface right now, with everything.","灾厄抵消卡":"Ward Card","踩到陷阱或灾难时，当作没踩到。":"When you hit a trap or disaster, treat it as if you never did.","定点卡":"Fix Card","这一次自己决定走几格（1–6）。":"This move, choose exactly how far to go (1–6).","侦察卡":"Scout Card","翻开前面六格。":"Reveal the next six tiles.","双骰卡":"Double-Roll Card","这一次移动掷两次，选一个。":"Roll twice for this move and pick one.","加倍卡":"Double Card","下一件拿到的战利品价值翻倍。":"The next piece
