rap","地精小贩":"Goblin Peddler","神龛":"Shrine","剧情":"Story","捷径":"Shortcut","捷径终点":"Shortcut End","灶台":"Stove","入口":"Entrance","迷途角":"Lost Junction","迷途":"Lost","营地":"Camp","头目巢穴":"Boss Lair","巢穴":"Lair","地图":"Maps","青苔矿道·第二圈":"Mossy Mine · Lap 2","青苔矿道·第三圈":"Mossy Mine · Lap 3","雾沼·第二圈":"Fog Marsh · Lap 2","雾沼·第三圈":"Fog Marsh · Lap 3","沉没书库·第二圈":"Sunken Library · Lap 2","沉没书库·第三圈":"Sunken Library · Lap 3","熔岩锻炉·第二圈":"Lava Forge · Lap 2","熔岩锻炉·第三圈":"Lava Forge · Lap 3","巨树之根·第二圈":"Giant Roots · Lap 2","巨树之根·第三圈":"Giant Roots · Lap 3","镜之渊·第二圈":"Mirror Abyss · Lap 2","镜之渊·第三圈":"Mirror Abyss · Lap 3","四个角":"The Four Corners","哥布林王的巢穴":"Goblin King's Lair","沼泽之母的巢穴":"Swamp Mother's Lair","图书管理员的巢穴":"Librarian's Lair","熔岩巨蜥的巢穴":"Magma Salamander's Lair","守林兽的巢穴":"Forest Guardian's Lair","镜之渊的巢穴":"Mirror Abyss Lair","格子":"Tiles","神龛 · 灶台":"Shrine · Stove","队员":"Party","布兰德·平常":"Brand · neutral","布兰德·得意":"Brand · triumphant","布兰德·吓坏":"Brand · terrified","布兰德·受伤":"Brand · hurt","格林·平常":"Grim · neutral","格林·得意":"Grim · triumphant","格林·吓坏":"Grim · terrified","格林·受伤":"Grim · hurt","小莱·平常":"Lai · neutral","小莱·得意":"Lai · triumphant","小莱·吓坏":"Lai · terrified","小莱·受伤":"Lai · hurt","卡尔·醉":"Karl · drunk","卡尔·戒酒":"Karl · sober","骰子":"Dice","布兰德的骰子":"Brand's die","格林的骰子":"Grim's die","小莱的骰子":"Lai's die","卡尔的旧钢骰":"Karl's old steel die","卡尔擦亮的钢骰":"Karl's polished steel die","缇缇的水晶骰":"Titi's crystal die","老霍的铁骰":"Old Ho's iron die","莫娜的玻璃骰":"Mona's glass die","咕哩的金漆骰":"Guli's gilded die","骰面":"Faces","爆":"Burst","疤":"Scar","恐":"Fear","镇上的人":"Townsfolk","头目与怪物":"Bosses & Monsters","哥布林王":"Goblin King","食人魔":"Ogre","沼泽之母":"Swamp Mother","图书管理员的幽灵":"Ghost of the Librarian","熔岩巨蜥":"Magma Salamander","枯萎的守林兽":"Withered Forest Guardian","镜中的自己":"Your Mirror Selves","深处的东西":"The Thing in the Deep","镇上":"Town","深渊口镇":"Abyssmouth","酒馆":"Tavern","小屋":"Cottage","界面":"Interface","火把":"Torches","动静":"Noise","战利品":"Loot","人情":"Favor","卡背":"Card back","护身符":"Amulet","生命":"Life","周":"Week","*回声是闷的。宝箱的盖子，轻轻动了一下。*":"*The echo is muffled. The chest's lid twitches, just slightly.*","§它是宝箱怪。":"§It's a mimic.","*回声很空。是个真宝箱。*":"*The echo is hollow. It's a real chest.*","打开，拿东西":"Open it, take the loot","箱子里的金币":"Coins from the chest","把它做成菜":"Cook it","宝箱怪的肉据说很嫩":"Mimic meat is supposed to be tender","*宝箱怪被撬开了。肉很嫩，舌头能卖给炼金铺。*":"*The mimic is pried open. The meat is tender, and the tongue will sell to the alchemist.*","宝箱怪（可食用）":"Mimic (edible)","*它咬住了一只手。*":"*It bites down on a hand.*","贴着墙绕过去":"Edge past along the wall","*你们贴着墙走了过去。它的盖子一直在一开一合。*":"*You edge past along the wall. Its lid keeps opening and closing.*","撬开它的嘴":"Pry its jaws open","*它不动了。*":"*It stops moving.*","宝箱怪的舌头":"Mimic tongue","*它又咬了一口。*":"*It bites again.*","拖着伤员跑":"Drag the wounded and run","*你们跑了。身后传来咯吱咯吱嚼东西的声音。*":"*You run. Behind you, the sound of crunching.*","敲三下，听回声":"Knock three times, listen to the echo","失败只是浪费火把":"Failing only wastes a torch","*听不出来。火把烧短了一截。*":"*Can't tell. The torch burns down a notch.*","撬开锁，从缝里看":"Pick the lock, peek through the gap","锁里可能有针":"There might be a needle in the lock","*锁里弹出一根针。*":"*A needle springs out of the lock.*","直接打开":"Just open it","选一个人去开":"Pick someone to open it","不要了，绕开":"Forget it, go around","*你们绕开了它。直到最后，也没人知道它是不是一个宝箱。*":"*You go around it. To the end, nobody knows whether it was really a chest.*","宝物":"Treasure","*角落里放着一个宝箱。铜扣，木头有点发黑。*":"*A chest sits in the corner. Brass clasps, the wood a little blackened.*","*箱子里是一袋金币，还有一把小刀。*":"*Inside: a pouch of gold and a small knife.*","*宝箱张开了嘴。里面是一圈牙。*":"*The chest opens its mouth. Inside is a ring of teeth.*","史莱姆":"Slime","小怪":"Monster","*一团透明的东西从头顶滴下来，落在你们面前，晃了晃。*":"*Something clear drips from above, lands in front of you, and wobbles.*","砍":"Hack it","失败的话，剑会被溶掉一截":"If you fail, the sword gets dissolved a bit","*史莱姆被劈成两半。晒干了能当下酒菜。*":"*The slime splits in two. Dried, it makes a decent bar snack.*","史莱姆干":"Dried slime","*剑砍进去，拔出来的时候短了一截。*":"*The sword goes in, and comes out shorter.*","绕过去的时候，能顺便看清后面的路":"While going around, you get a look at the path behind it","*它慢吞吞地转过身，没有发现你们。它身后，是一条你们从没走过的岔路。*":"*It turns ponderously and doesn't notice you. Behind it is a side path you've never taken.*","*鞋子被粘住了，扯了半天才扯下来。*":"*A shoe gets stuck. It takes ages to pull free.*","哥布林窝":"Goblin Den","*前面有火光和吵闹声。一窝哥布林正围着一口锅。墙上画着一个戴王冠的大肚子哥布林。*":"*Firelight and racket ahead. A pack of goblins around a pot. On the wall, a painting of a fat goblin in a crown.*","冲进去":"Charge in","一定会很吵":"It will definitely be loud","*哥布林四散奔逃。锅底压着一袋钱。*":"*The goblins scatter. Under the pot, a bag of coins.*","哥布林的锅底钱":"Goblins' pot money","*哥布林比看上去多得多。*":"*There are a lot more goblins than it looked.*","在窝口放火":"Set fire to the den entrance","最省事，但什么也拿不到":"Easiest, but you get nothing","*哥布林们尖叫着跑光了。锅里的东西也烧糊了。*":"*The goblins flee shrieking. Whatever was in the pot is burnt too.*","*柴是湿的。点了半天，火把倒烧掉不少。*":"*The wood is wet. It takes forever to light, and burns through your torches.*","偷听它们在吵什么":"Eavesdrop on their squabble","也许能听到头目的弱点":"You might overhear the boss's weakness","*一只小哥布林在哭：「王又被他妈骂了，今晚肯定又要拿我们出气……」*":"*A little goblin is crying: \"The king got yelled at by his mum again, he's gonna take it out on us tonight...\"*","*被发现了。*":"*Spotted.*","骷髅兵":"Skeleton Soldier","*一具骷髅兵站在路中间，手里握着一把生锈的剑。它的头，慢慢转向了你们。*":"*A skeleton soldier stands in the middle of the path, a rusty sword in hand. Its head turns slowly toward you.*","砸碎它":"Smash it","*骨头散了一地。它脖子上挂着一块护符。*":"*Bones everywhere. An amulet hangs around its neck.*","古代护符":"Ancient amulet","*生锈的剑划了过来。*":"*The rusty sword swings at you.*","跟着它走":"Follow it","它好像要带你们去哪":"It seems to want to take you somewhere","*它把你们带进一间墓室，在棺材旁边躺下，不动了。墓室里全是金器。*":"*It leads you into a tomb, lies down beside a coffin, and goes still. The tomb is full of gold.*","墓室里的金器":"Gold from the tomb","*墓室的门在身后关上了。黑暗里有很多东西在动。*":"*The tomb door shuts behind you. Many things move in the dark.*","后退，等它走开":"Back off, wait for it to leave","*你们等了很久。它终于走开了。*":"*You wait a long time. Finally, it leaves.*","落穴":"Pit Trap","*脚下的石板咔哒响了一声。走在最前面的是队长。*":"*A flagstone clicks underfoot. The leader is in front.*","一把抓住队长":"Grab the leader","队长自己不能抓自己":"The leader can't grab himself","*石板塌下去的一瞬间，队长被拽了回来。*":"*As the flagstone gives way, the leader is yanked back.*","*没抓住。*":"*Missed.*","所有人往前扑":"Everyone dive forward","*你们扑到了对面。身后的石板整块掉进了黑暗里。*":"*You dive to the other side. Behind you, the whole slab drops into the dark.*","*队长慢了一步。*":"*The leader is a step too slow.*","蝙蝠群":"Bat Swarm","*头顶传来扑棱棱的声音，越来越响。*":"*A fluttering overhead, louder and louder.*","趴下不动":"Douse the torches, lie flat","*蝙蝠从头顶飞过，一只都没停。*":"*The bats pass overhead. Not one stops.*","*有人跳起来挥手，蝙蝠全扑了过来。*":"*Someone jumps up waving, and the whole swarm dives at you.*","挥火把赶走":"Drive them off with torches","*蝙蝠散开了。*":"*The bats scatter.*","*火把被扑灭了一根。*":"*A torch gets snuffed out.*","塌方":"Cave-in","灾难":"Disaster","*头顶的石头发出咯吱声。灰土簌簌往下落。*":"*The rock overhead creaks. Grit trickles down.*","扛住":"Hold it up","活下来的人，骰子上会多一道疤":"Whoever survives gets a scar on their die","*石头砸在肩膀上，被硬生生扛住了。*":"*The rock slams onto shoulders, and holds.*","*扛不住了。*":"*It's too heavy.*","看准缝隙钻过去":"Squeeze through the gaps","*你们从石头落下的缝隙之间钻了过去。*":"*You slip between the falling stones.*","*一块石头落在了队长腿上。*":"*A rock lands on the leader's leg.*","毒雾":"Poison Fog","*前面起了一层紫色的雾。闻起来，有点甜。*":"*A purple fog rises ahead. It smells a little sweet.*","认出解毒的草":"Find the antidote herb","认出来的人，骰子上会多一道疤":"Whoever finds it gets a scar on their die","*墙角长着一丛银色的草。嚼下去，雾就不甜了。*":"*A clump of silver grass grows in the corner. Chew it, and the fog stops tasting sweet.*","*认错了。嚼下去的是另一种草。*":"*Wrong one. What you chewed was a different grass.*","屏住气冲过去":"Hold your breath and run through","*冲出雾的时候，所有人都在大口喘气。*":"*Bursting out of the fog, everyone gasps for air.*","*队长没憋住。*":"*The leader couldn't hold it.*","低语":"Whispers","怪异":"Uncanny","*墙里传来低语。听不清在说什么，但每个人都觉得，那是在叫自己的名字。*":"*Whispers come from inside the walls. You can't make out the words, but everyone feels it's their own name being called.*","捂住耳朵往前走":"Cover your ears and keep walking","*走过去的时候，有人听清了一句：「最深处的东西，认得你们中间的一个人。」*":"*Passing through, someone catches one line: \"The thing in the deep knows one of you.\"*","*那声音钻进了脑子里。*":"*The voice gets into your head.*","跟着声音走":"Follow the voice","更危险，也更值钱":"More dangerous, and more valuable","*声音的尽头是一具坐着的遗骸，膝盖上放着一个匣子。*":"*At the end of the voice: a seated corpse with a box on its knees.*","低语者的遗物":"The whisperer's relic","*你们走进了一个死胡同。低语变成了笑声。*":"*You walk into a dead end. The whispers turn to laughter.*","会提问的石像":"The Questioning Statue","*一座石像挡在门前。它的眼睛亮了：「回答我的谜题。或者，给我讲一个真实的故事。」*":"*A statue blocks the door. Its eyes light up: \"Answer my riddle. Or tell me a true story.\"*","回答谜题":"Answer the riddle","*石像沉默了一会儿，眼睛里掉出一颗宝石。门开了。*":"*The statue is silent a moment. A gem drops from its eye. The door opens.*","石像的宝石":"The statue's gem","*石像闭上了眼睛。你们只好绕远路。*":"*The statue closes its eyes. You have to take the long way around.*","讲一个故事":"Tell a story","派一个人讲。它听得出真假":"Send one person to tell it. It can tell truth from lies","*石像眼睛里掉出一颗宝石。门开了。*":"*A gem drops from the statue's eye. The door opens.*","*石像闭上了眼睛：「这不是真的。」*":"*The statue closes its eyes: \"That is not true.\"*","受伤的陌生人":"The Wounded Stranger","人":"People","*一个冒险者靠在根须边，腿上缠着染血的布。他抬起头：「水……有水吗……」*":"*An adventurer slumps against the roots, a bloody rag around his leg. He looks up: \"Water... got any water...\"*","打回去":"Fight back","*他们跑了，丢下了一个背包。*":"*They run, dropping a pack.*","强盗的背包":"Bandits' pack","*他们下手很重。*":"*They hit hard.*","交出东西":"Hand something over","你身上什么都没有":"You have nothing on you","*他们拿了东西，消失在黑暗里。*":"*They take it and vanish into the dark.*","转身就跑":"Turn and run","跑得够快，还能顺走他们一个包":"Run fast enough and you can snatch one of their packs","*你们甩掉了他们。跑的时候，有人顺手拎走了一个背包。*":"*You lose them. On the way, someone grabs one of their packs.*","顺来的背包":"Snatched pack","*有人被拽住了。*":"*Someone gets grabbed.*","救他":"Help him","花点时间，给他水":"Take a moment, give him water","*他突然吹了一声口哨。黑暗里冲出两个人。*":"*He suddenly whistles. Two figures charge out of the dark.*","*他喝了水，缓过来了，把一块护符塞进你手里：「出去以后，我欠你一个人情。」*":"*He drinks, comes round, and presses an amulet into your hand: \"When I get out, I owe you one.\"*","陌生人的护符":"The stranger's amulet","不管他":"Leave him","*你们从他身边走了过去。*":"*You walk past him.*","小莱：……我们就这么走了吗？":"Lai: ...Are we just going to leave?","银鹰队":"The Silver Eagles","*迎面走来一支队伍，五个人，披风上绣着银色的鹰。领头的年轻人停下来，看了你们一眼。*":"*A party comes toward you, five of them, silver eagles stitched on their cloaks. The young man at the front stops and looks you over.*","雷恩：又是你们。下面不好走，别拖后腿。":"Reyn: You again. It's rough down here. Don't slow us down.","交换消息":"Trade news","雷恩：……前面的路我们走过了。拿去。":"Reyn: ...We've already walked the road ahead. Take this.","*他分了你们两根火把，还在你的地图上划了几笔。*":"*He gives you two torches and marks a few lines on your map.*","雷恩：没空。":"Reyn: No time.","*他们走了。*":"*They leave.*","抢他们":"Rob them","他们比看上去强":"They're stronger than they look","*银鹰队丢下东西退走了。雷恩回头看了你一眼，那眼神你会记很久。*":"*The Silver Eagles drop their goods and retreat. Reyn looks back at you once. You'll remember that look a long time.*","银鹰队的战利品":"Silver Eagles' loot","格林：……这不对。":"Grim: ...This isn't right.","*雷恩的剑比你们任何人都快。*":"*Reyn's sword is faster than any of yours.*","各走各的":"Go your separate ways","*两支队伍擦肩而过，谁也没说话。*":"*The two parties pass each other without a word.*","让卡尔跟他说话":"Let Karl talk to him","只有卡尔能去":"Only Karl can go","*卡尔走了出去。雷恩的手，按在了剑柄上。*":"*Karl steps forward. Reyn's hand drops to his sword hilt.*","雷恩：……老师。":"Reyn: ...Master.","卡尔：那场决赛，我收住了剑。不是因为我怕你。是因为我怕我会赢。":"Karl: In that final, I pulled my blade. Not because I was afraid of you. Because I was afraid I'd win.","*雷恩很久没有说话。最后，他把剑从剑柄上松开了。*":"*Reyn says nothing for a long time. At last, his hand leaves the hilt.*","雷恩：……下次喝一杯。你请。":"Reyn: ...Next time, a drink. You're buying.","卡尔和雷恩":"Karl and Reyn","*卡尔张了张嘴，什么都没说出来。雷恩转身走了。*":"*Karl opens his mouth, but nothing comes out. Reyn turns and leaves.*","深处":"The Deep","*脚下的地面在震。那个东西从头目巢穴里爬出来，一路追上了你们。*":"*The ground shakes. The thing crawled out of the boss's lair and has chased you all this way.*","§它不能被打败，只能躲过、骗走，或者喂饱。":"§It cannot be beaten. Only hidden from, tricked, or fed.","所有人躲起来":"Everyone hide","*它从你们身边走过去了。它的气味很久都没散。*":"*It walks right past you. Its smell lingers a long time.*","*它找到了你们。*":"*It finds you.*","把它引到别处":"Lure it away","*你们把一根火把扔进了岔路。它跟着光走了。*":"*You throw a torch down a side tunnel. It follows the light.*","*它没上当。*":"*It doesn't fall for it.*","喂饱它":"Feed it","交出一半战利品":"Hand over half your loot","*你们把战利品扔了过去。它吃得很慢，很响。*":"*You throw it your loot. It eats slowly, and loudly.*","*你们身上什么也没有。它闻了闻，失望地走了。*":"*You have nothing. It sniffs, and leaves disappointed.*","让小莱叫它":"Let Lai call to it","它好像……在听小莱的声音":"It seems... to be listening to Lai's voice","*那东西停住了。它歪着头，好像在听什么。*":"*The thing stops. It tilts its head, as if listening.*","小莱：……爹？":"Lai: ...Dad?","*那东西发出一声很长、很低的声音。像一个人在哭。然后它转过身，慢慢爬回了深处。*":"*The thing lets out a long, low sound. Like a man crying. Then it turns and slowly crawls back into the deep.*","小莱：……是他。我知道是他。":"Lai: ...It's him. I know it's him.","深处的东西是谁":"Who the thing in the deep is","*它扑了过来。小莱没有躲。最后一刻，它停住了，只是用爪子把她推开了。*":"*It lunges. Lai doesn't move. At the last moment it stops, and just pushes her aside with its claw.*","毒蛙群":"Poison Frogs","*浮木上蹲着几十只亮紫色的青蛙。它们一起鼓起了喉咙。*":"*Dozens of bright purple frogs squat on the driftwood. As one, they puff out their throats.*","抓几只":"Catch a few","莫娜会想要的":"Mona will want these","*你们用布袋兜住了三只。它们在袋子里唱歌。*":"*You scoop three into a sack. They sing inside it.*","活的毒蛙":"Live poison frogs","*毒蛙喷了队长一脸。*":"*A frog spits right in the leader's face.*","一动不动，听它们唱完":"Stay still and listen to their song","毒蛙只在毒雾要来的时候唱歌。听懂了，以后就知道往哪躲":"Poison frogs only sing when fog is coming. Understand the song and you'll know where to hide","*歌唱完了。它们一只一只跳进了水里。你们记住了那段旋律：它是从毒雾吹来的方向，反着唱的。*":"*The song ends. They hop into the water one by one. You remember the melody: they sing it backward from where the fog blows in.*","*有人打了个喷嚏。蛙群炸开了。*":"*Someone sneezes. The frogs explode in all directions.*","沼泽陷落":"Bog Sink","*队长脚下的浮木一歪，黑水一下子没到了腰。*":"*The driftwood under the leader tips, and black water is suddenly up to the waist.*","把队长拉上来":"Pull the leader up","队长自己不能拉自己":"The leader can't pull himself","*队长被拽了上来，浑身都是黑泥。*":"*The leader is hauled out, covered in black mud.*","*拉上来的时候，队长的包沉下去了。*":"*As the leader comes up, his pack sinks.*","甩绳子":"Throw a rope","*绳子缠住了浮木。*":"*The rope catches on the driftwood.*","*绳子太短了。*":"*The rope is too short.*","迷路的萤火":"Lost Fireflies","*一团萤火在雾里飘着，排成一个箭头的形状，指着一条没有路的方向。*":"*A cloud of fireflies drifts in the fog, forming an arrow that points where there's no path.*","跟着走":"Follow them","*萤火带着你们穿过雾，停在一片没人来过的蘑菇地上。*":"*The fireflies lead you through the fog to a patch of mushrooms no one has touched.*","*萤火一下子散了。你们站在齐腰深的水里，不知道自己在哪。*":"*The fireflies scatter. You're standing in waist-deep water with no idea where you are.*","看出它们在怕什么":"Work out what they're afraid of","*萤火在躲一片水面。水下有个巨大的影子，肚子里漂着很多东西。*":"*The fireflies avoid one stretch of water. Beneath it is a huge shadow, its belly full of floating things.*","§你记住了沼泽之母的样子。":"§You remember what the Swamp Mother looks like.","*看不出来。萤火飘走了。*":"*Can't tell. The fireflies drift off.*","会说话的蘑菇":"The Talking Mushroom","*一朵比人还高的蘑菇低下头：「你们……身上……有莫娜的味道。」*":"*A mushroom taller than a person bends down: \"You... smell... of Mona.\"*","跟它聊":"Chat with it","蘑菇：沼泽之母……怕盐……矿工……都知道……":"Mushroom: The Swamp Mother... fears salt... miners... all know...","蘑菇：给你……我的……孩子。":"Mushroom: Take... my... child.","*蘑菇喷出一团孢子。*":"*The mushroom puffs out a cloud of spores.*","摘了它":"Pick it","莫娜一定很想要":"Mona would love this","*蘑菇尖叫着被连根拔起。*":"*The mushroom shrieks as it's pulled up by the roots.*","小莱：……它刚才还在跟我们说话。":"Lai: ...It was just talking to us.","*它的根缠住了人。*":"*Its roots wrap around someone.*","休整":"Rest","在古代锻炉里锻一次":"Forge once at the ancient forge","派一个人，把骰子最小的一面锻大 2":"Send one person: their lowest face gets +2","*铁锤落下去，火星溅了一地。古代矮人的锻炉，还记得怎么干活。*":"*The hammer falls and sparks fly everywhere. The ancient dwarven forge still remembers how to work.*","*锻炉喷出一口火。*":"*The forge belches fire.*","离开":"Leave","*你们离开了锻炉。*":"*You leave the forge.*","把魔物做成料理":"Cook a monster into a meal","你们身上没有魔物材料":"You have no monster parts","没有魔物材料":"No monster parts","§下一次检定，所有人 +3。":"§Next check, everyone +3.","布兰德：……再来一碗。":"Brand: ...Another bowl.","烤烤火":"Warm up by the fire","*火很暖。*":"*The fire is warm.*","书怪":"Book Mimic","*书架上有一本书在呼吸。书脊一起一伏，书页之间露出一排牙。*":"*A book on the shelf is breathing. Its spine rises and falls; between its pages, a row of teeth.*","把它合上，捆起来":"Shut it and tie it up","*书怪被捆得结结实实。米洛会想要的。*":"*The book mimic is trussed up tight. Milo will want it.*","被捆住的书怪":"Trussed book mimic","*它咬了一口。纸割的伤，最疼。*":"*It bites. Paper cuts hurt the most.*","读它":"Read it","书怪最怕被人读完":"Book mimics fear being read to the end","*读到最后一页，书怪不动了。书页上写着这座书库的地图。*":"*At the last page, the book mimic goes still. The page holds a map of the library.*","*读着读着，有人被吸进去了一半。*":"*Reading on, someone gets half sucked in.*","潮水":"Flood Tide","*地上的水在往上涨。很快，非常快。*":"*The water on the floor is rising. Fast. Very fast.*","爬上书架":"Climb the shelves","*你们挂在书架顶上，看着水从脚下流过去。*":"*You hang from the top of the shelves and watch the water flow beneath you.*","*书架倒了。*":"*The shelf topples.*","游出去":"Swim out","*你们湿透了，但都游出来了。*":"*You're soaked, but everyone made it out.*","*水太急了。*":"*The current is too strong.*","骷髅学者":"Skeleton Scholar","*一具骷髅坐在书桌前，还在翻书。它抬起头：「安静。这里是图书馆。」*":"*A skeleton sits at a desk, still turning pages. It looks up: \"Quiet. This is a library.\"*","小声问它路":"Whisper to ask the way","骷髅学者：……往东。别碰双门。左边那个守卫说真话，右边那个……也说真话。只是不说全。":"Skeleton Scholar: ...East. Don't touch the double doors. The left guard tells the truth. The right one... also tells the truth. Just not all of it.","骷髅学者：我说了。安静。":"Skeleton Scholar: I said. Quiet.","*它把书砸了过来。*":"*It throws the book at you.*","偷它的书":"Steal its book","*你们拿到了它在读的那本书。最后一页夹着一张很旧的纸。*":"*You get the book it was reading. Tucked in the last page is a very old sheet.*","*它站了起来。整个书库的骷髅都站了起来。*":"*It stands up. Every skeleton in the library stands up.*","两扇门，两个守卫":"Two Doors, Two Guards","*两扇一模一样的门。两个石头守卫。一个说：「我们之中，一个只说真话，一个只说假话。」另一个说：「他说的是真话。」*":"*Two identical doors. Two stone guards. One says: \"Of us two, one only tells the truth and one only lies.\" The other says: \"He's telling the truth.\"*","想清楚再选":"Think it through first","*你问了一个问题，又反过来问了一遍。左边的门开了。门后是一间放满了宝贝的小屋。*":"*You ask a question, then ask it again backwards. The left door opens. Behind it, a little room full of treasure.*","守卫背后的宝藏":"Treasure behind the guards","*门后面是水。很多水。*":"*Behind the door is water. A lot of water.*","随便选一扇":"Just pick one","*运气不错。*":"*Lucky.*","*门后面是水。*":"*Behind the door is water.*","小火蜥":"Fire Imps","*熔岩里冒出几只小火蜥，有一只在啃你们的火把。*":"*A few little fire lizards pop out of the lava. One is gnawing on your torch.*","赶走它们":"Drive them off","*小火蜥逃回了熔岩里，留下了几片发烫的鳞。*":"*The imps flee back into the lava, leaving a few hot scales.*","火蜥蜴鳞":"Fire lizard scales","*它们烧着了一个人的衣服。*":"*They set someone's clothes on fire.*","给它们一根火把":"Give them a torch","没有火把了":"No torches left","*小火蜥抱着火把，心满意足地钻进了熔岩。有一只回头看了你们一眼。*":"*The imps hug the torch and slip happily into the lava. One looks back at you.*","熔岩桥":"Lava Bridge","*一座窄窄的石桥架在熔岩上。走到一半，桥开始往下沉。*":"*A narrow stone bridge spans the lava. Halfway across, it starts to sink.*","跑过去":"Run across","对岸的墙上刻着矮人的路标":"There are dwarven waymarks carved on the far wall","*最后一个人跳上对岸的时候，桥沉进了熔岩里。对岸的墙上，刻着一排矮人的路标。*":"*As the last person leaps onto the far bank, the bridge sinks into the lava. On the far wall, a row of dwarven waymarks.*","*队长的靴子烧穿了。*":"*The leader's boots burn through.*","撑住桥":"Hold the bridge up","*桥被撑住了。桥下压着一块炎心石。*":"*The bridge holds. Wedged beneath it is a Flameheart Stone.*","*撑不住了。*":"*Can't hold it.*","熔岩喷发":"Lava Eruption","*地面在发烫。熔岩河里鼓起一个巨大的泡。*":"*The ground is scorching. A huge bubble swells in the lava river.*","躲到铁砧后面":"Hide behind the anvil","*熔岩溅在铁砧上，像雨一样。*":"*Lava splatters the anvil like rain.*","*有一滴落在了队长身上。*":"*A drop lands on the leader.*","看准喷发的节奏":"Time the eruptions","*一、二、三……跑！*":"*One, two, three... run!*","*算错了一拍。*":"*Off by a beat.*","封印锁链":"Seal Chains","*几条比人腰还粗的锁链垂在大厅中央，上面刻满了矮人的符文。锁链在轻轻地抖。*":"*Chains thicker than a man's waist hang in the middle of the hall, covered in dwarven runes. They're trembling slightly.*","读符文":"Read the runes","*符文写着：「此锁所缚，非火非兽。」下面有人用小刀刻了一行字：「它怕冷水。」*":"*The runes read: \"What this lock binds is neither fire nor beast.\" Below, someone has scratched with a knife: \"It fears cold water.\"*","*符文亮了一下。锁链抖得更厉害了。*":"*The runes flash. The chains shake harder.*","摸一摸锁链":"Touch the chains","*锁链是温的。像活的东西。你摸到了一枚嵌在里面的旧金币。*":"*The chains are warm. Like something alive. Your fingers find an old gold coin embedded in them.*","锁链里的古金币":"Ancient coin from the chains","*锁链里传来一个声音。不是矮人的语言。*":"*A voice comes from inside the chains. Not in any dwarven tongue.*","矮人亡魂":"Dwarf Ghost","*一个半透明的矮人站在锻炉边，一锤一锤地敲着什么也没有的铁砧。*":"*A translucent dwarf stands at the forge, hammering stroke after stroke on an empty anvil.*","帮它拉风箱":"Work the bellows for it","*亡魂敲完了最后一锤，抬头冲你们点了点头，然后散了。铁砧上留下一块铁。*":"*The ghost strikes the last blow, nods to you, and fades. An iron ingot is left on the anvil.*","亡魂打的铁锭":"Ghost-forged ingot","*风箱太重了。亡魂叹了口气，转身走进了墙里。*":"*The bellows are too heavy. The ghost sighs and walks into the wall.*","问它当年发生了什么":"Ask what happened back then","矮人亡魂：我们封住了它。用了六块界石。……可界石，一块一块地，被人偷走了。":"Dwarf Ghost: We sealed it. With six ward-stones. ...But the ward-stones were stolen, one by one.","*亡魂转过头来。它没有脸。*":"*The ghost turns its head. It has no face.*","孢子虫":"Spore Bugs","*枯死的那一半根须上，爬满了拳头大的虫子。每只虫子背上都顶着一朵发光的蘑菇。*":"*Fist-sized bugs crawl over the dead half of the roots. Each carries a glowing mushroom on its back.*","用火把烧":"Burn them with torches","*虫子噼噼啪啪地烧着了。*":"*The bugs crackle and pop as they burn.*","孢子虫壳":"Spore bug shells","*孢子散了一地。*":"*Spores everywhere.*","踩着活的那一半过去":"Step along the living half","活的根会托着你们，还会滴下泉水":"The living roots will hold you up, and drip spring water","*活的根须在你们脚下轻轻托了一下，又往你们手里滴了几滴银色的水。*":"*The living roots lift you gently underfoot, and drip a few drops of silver water into your hands.*","*一脚踩空了。*":"*A foot slips through.*","根缠":"Root Snare","*地上的根突然动了起来，缠住了队长的脚踝。*":"*The roots on the ground suddenly move and wrap around the leader's ankle.*","帮队长砍断":"Cut the leader free","砍断的根能卖给莫娜":"Severed roots sell to Mona","*根被砍断了，断口流出银色的汁。*":"*The root is cut. Silver sap flows from the stump.*","会流银汁的根":"Silver-sap root","*越砍缠得越紧。*":"*The more you cut, the tighter it gets.*","轻轻拍它":"Pat it gently","精灵都是这么做的":"That's what elves do","*根松开了。像一只被安抚的手。*":"*The root loosens. Like a soothed hand.*","*根不吃这一套。*":"*The root isn't having it.*","毒孢子":"Poison Spores","*枯死的根须一起裂开，喷出一团灰白色的孢子雾。*":"*The dead roots split open all at once, spewing a grey-white cloud of spores.*","用湿布捂住嘴":"Cover your mouths with wet cloth","*布是湿的。孢子粘在了布上。*":"*The cloth is wet. The spores stick to it.*","*有人咳了很久。*":"*Someone coughs for a long time.*","逆风跑":"Run upwind","*你们跑到了活的那一半。*":"*You reach the living half.*","*队长跑慢了。*":"*The leader runs too slowly.*","精灵哨站":"Elven Outpost","*根须间挂着一盏精灵灯。一个精灵哨兵拉满了弓：「人类。你们来做什么？」*":"*An elven lamp hangs between the roots. An elven sentry draws her bow: \"Humans. What are you doing here?\"*","说明来意":"Explain why you're here","精灵哨兵：……伊兰派你们来的？":"Elven Sentry: ...Ilan sent you?","*她放下了弓，给了你们一瓶泉水，还告诉你们守林兽睡在哪。*":"*She lowers her bow, gives you a bottle of spring water, and tells you where the Forest Guardian sleeps.*","*一支箭钉在了你们脚边。*":"*An arrow thuds into the ground at your feet.*","拿东西换路":"Trade something for passage","你身上没东西可换":"You have nothing to trade","*哨兵收下了东西，侧身让开了。*":"*The sentry takes it and steps aside.*","枯死的鹿群":"The Withered Herd","*一群鹿站在枯死的那一半根须上。它们的角上长满了灰白色的蘑菇。它们一起看着你们。*":"*A herd of deer stands on the dead half of the roots. Their antlers are covered in grey mushrooms. They all stare at you.*","慢慢走过去":"Walk past slowly","鹿群会记住不怕它们的人":"The herd remembers those who aren't afraid of them","*鹿群让开了一条路。最后一只鹿低下头，角上掉下来一块干净的骨片。*":"*The herd parts. The last deer lowers its head, and a clean shard of antler falls.*","鹿角的骨片":"Antler shard","*鹿群冲了过来。*":"*The herd charges.*","给它们泉水":"Give them spring water","你们没有银泉水":"You have no silverspring water","*你们把泉水洒在鹿角上。蘑菇一朵一朵掉了下来。*":"*You sprinkle the water on their antlers. The mushrooms fall off one by one.*","§失去：银泉水 ×1":"§Lost: Silverspring Water ×1","鹿群留下的角":"Antlers left by the herd","回声":"Echo","*你们听见了自己的声音。是很久以前说过的话。*":"*You hear your own voices. Things you said long ago.*","回答它":"Answer it","*回声停了。地上多了一块镜屑。*":"*The echo stops. A mirror shard lies on the ground.*","*回声变成了尖叫。*":"*The echo turns into a scream.*","捂住耳朵":"Cover your ears","*回声在你们身后跟了很久。*":"*The echo follows you a long way.*","镜格":"Mirror Tile","*地上是一整块镜子。站上去的两个人，倒影交换了位置。*":"*The floor is one solid mirror. When two people stand on it, their reflections swap places.*","让两个人交换骰子":"Have two people swap dice","直到这一圈结束":"Until the end of this lap","§到入口之前，他们的骰子互换。":"§Until you reach the entrance, their dice are swapped.","绕开镜子":"Go around the mirror","*你们绕了很远的路。*":"*You take a very long way around.*","慢半拍的倒影":"The Lagging Reflections","*湖面上的倒影，比你们慢半拍。然后，慢了一拍。然后，它们停下了，你们还在走。*":"*Your reflections on the lake lag half a beat behind. Then a full beat. Then they stop, and you're still walking.*","盯着它们":"Stare them down","*倒影先移开了眼睛。*":"*The reflections look away first.*","倒影掉下的镜屑":"Shard dropped by a reflection","*倒影伸出手，摸了摸你们的脸。*":"*A reflection reaches out and touches your face.*","别看，数着步子往前走":"Don't look, count your steps forward","数对了步数，就知道这一层有多大":"Count right and you'll know how big this floor is","*你们数着步子走了过去。数到最后，这一层的样子在脑子里清清楚楚。*":"*You count your way across. By the end, the whole floor is clear in your head.*","*走着走着，有人回头看了一眼。*":"*Partway across, someone looks back.*","寂静":"Silence","*所有的声音都没了。连自己的心跳都听不见。*":"*Every sound is gone. You can't even hear your own heartbeat.*","握住彼此的手":"Hold hands","*你们手拉着手，走出了那片寂静。*":"*Hand in hand, you walk out of the silence.*","*有人松开了手。*":"*Someone lets go.*","在心里数数":"Count in your head","*数到三百的时候，声音回来了。*":"*At three hundred, sound returns.*","*数着数着，忘了自己是谁。*":"*Counting and counting, he forgets who he is.*","坐上去":"Ride it","失败会翻车，但还是会到对面":"If you fail you crash, but you still get there","不坐，走路":"Don't ride, walk","*你们没坐。*":"*You don't ride.*","*轨道到这里就断了。旁边有个前人留下的小箱子。*":"*The track ends here. Beside it, a small box left by someone before you.*","轨道尽头的小箱子":"Box at the end of the track","商人":"Merchant","*一只背着大包的地精从石头后面探出头：「嘿嘿，客人！地下的东西，地上买不到！不收钱，只收好东西！」*":"*A goblin with a huge pack pokes its head out from behind a rock: \"Heh heh, customers! Things from down here you can't buy up top! No coin — only good stuff!\"*","你身上没有战利品":"You have no loot","手里最多三张卡":"At most three cards in hand","地精小贩：嘿嘿，好买卖！":"Goblin Peddler: Heh heh, good deal!","不买了":"Not buying","地精小贩：下次再来！地下的东西，地上买不到！":"Goblin Peddler: Come again! Things from down here you can't buy up top!","*石壁上凿着一个小神龛，里面的蜡烛不知道是谁点的。前人在这里放过很多东西。*":"*A small shrine is carved into the rock. Nobody knows who lit its candle. Those before you left many things here.*","献上一件战利品：治伤":"Offer a piece of loot: heal a wound","没有人受伤":"No one is hurt","*蜡烛的火苗跳了一下。*":"*The candle flame jumps.*","献上一件战利品：磨掉「恐」":"Offer a piece of loot: wear off a Fear","没有人骰子上有「恐」":"No one has Fear on their die","没有「恐」":"No Fear","*一阵很轻的风吹过。*":"*A very light breeze passes.*","献上一件战利品：火把 +3":"Offer a piece of loot: torches +3","拜一拜，走":"Bow, and go","*你们拜了一拜。什么也没发生。*":"*You bow. Nothing happens.*","*矿车哐当哐当冲下了坡，一路火星四溅。*":"*The minecart clatters down the slope, spraying sparks.*","*矿车在拐弯的地方飞了出去。*":"*The minecart flies off at the bend.*","*浮木栈道一直漂到了对岸。*":"*The driftwood walkway floats all the way to the other bank.*","*栈道散了，大家是游过去的。*":"*The walkway falls apart; everyone swims.*","*书架滑轨吱呀吱呀地把你们送到了另一头。*":"*The shelf rail creaks you across to the other end.*","*滑轨断了，书架砸了下来。*":"*The rail snaps and the shelf comes crashing down.*","*矿车冲过熔岩上方的轨道。*":"*The minecart races along the track above the lava.*","*矿车擦着熔岩翻了。*":"*The minecart flips, grazing the lava.*","*藤蔓荡了过去。*":"*You swing across on the vines.*","*藤蔓断了。*":"*The vine snaps.*","*你们走进倒影里，从另一边的倒影里走了出来。*":"*You step into a reflection and step out of another on the far side.*","*倒影把你们吐了出来，摔得很重。*":"*The reflection spits you out. Hard.*","*到了。*":"*Arrived.*","*摔了一跤。*":"*Took a tumble.*","食人魔的洞":"The Ogre's Cave","*洞里坐着一头很老的食人魔，牙都掉光了。它看了你们一眼，又闭上了眼睛。*":"*A very old ogre sits in the cave, its teeth all gone. It glances at you, then closes its eyes again.*","§这里有一段故事，但要等布兰德来。":"§There's a story here, but it's waiting for Brand.","*洞里坐着一头很老的食人魔。牙都掉光了，一只眼睛是瞎的。*":"*A very old ogre sits in the cave. Its teeth are all gone; one eye is blind.*","*布兰德停住了。他的斧头在发抖。*":"*Brand stops. His axe is shaking.*","布兰德：……就是它。":"Brand: ...That's the one.","*你从来没听过布兰德用这么小的声音说话。*":"*You've never heard Brand speak this quietly.*","让布兰德自己走过去":"Let Brand walk over alone","只有布兰德能掷":"Only Brand can roll","布兰德：二十年前，我的队友死在这个洞口。我转身跑了。后来我讲的每一个英雄故事……都是他们的。":"Brand: Twenty years ago, my party died at the mouth of this cave. I turned and ran. Every hero story I've told since... was theirs.","*布兰德走到食人魔面前，站住了。食人魔睁开那只好眼睛，看了他很久。*":"*Brand walks up to the ogre and stops. The ogre opens its good eye and looks at him for a long time.*","*然后它往旁边挪了挪，让出了身后的东西：一把锈掉的剑，一面破盾，一个刻着名字的酒壶。*":"*Then it shifts aside, revealing what's behind it: a rusted sword, a broken shield, a flask with names carved in it.*","布兰德：……是他们的。":"Brand: ...They're theirs.","*布兰德把酒壶揣进怀里。回去的路上，他一句牛也没吹。*":"*Brand tucks the flask into his coat. On the way back, he doesn't brag once.*","§布兰德骰子上的一个 1，变成了「誓 8」：胆检定时算 16。":"§One of the 1s on Brand's die became \"Oath 8\": counts 16 on Nerve checks.","布兰德和食人魔":"Brand and the Ogre","*布兰德往后退了一步。又一步。*":"*Brand takes a step back. Then another.*","§他还会有机会。下次经过，可以再试一次。":"§He'll get another chance. Next time you pass, you can try again.","*布兰德转身跑了。和二十年前一模一样。*":"*Brand turns and runs. Exactly like twenty years ago.*","*等你们追出去，他已经不见了。后来有人说，看见他一个人爬上了地面。*":"*By the time you chase after him, he's gone. Later, someone says they saw him climb to the surface alone.*","不打扰它":"Leave it in peace","*你们退了出去。布兰德一路都没说话。*":"*You back out. Brand doesn't say a word the whole way.*","格林的旧营地":"Grim's Old Camp","*一处很旧的营地。灰烬里埋着一个矮人用的水壶。*":"*A very old campsite. A dwarven water flask lies buried in the ashes.*","§这里有一段故事，但要等格林来。":"§There's a story here, but it's waiting for Grim.","格林：……第一次。我第一次下来，就睡在这儿。":"Grim: ...The first time. My first time down, I slept right here.","*他蹲下去，从石头缝里抽出一卷发霉的纸。是他自己画的地图。*":"*He crouches and pulls a mouldy roll of paper from a crack in the rock. A map he drew himself.*","让格林把地图看完":"Let Grim read the whole map","格林：那时候，我把每一格都记下来了。只是后来……不敢回来看。":"Grim: Back then, I wrote down every tile. Only... I never dared come back and look.","§格林的旧地图：这张地图的所有格子都翻开了。":"§Grim's old map: every tile on this map is revealed.","格林的旧地图":"Grim's Old Map","德鲁伊石环":"The Druid Stone Ring","*一圈长满青苔的石头。其中一块石头下面压着一个油布包。*":"*A ring of moss-covered stones. An oilcloth bundle is pinned under one of them.*","§这里有一段故事，但要等小莱来。":"§There's a story here, but it's waiting for Lai.","*一圈长满青苔的石头。其中一块下面压着一个油布包。包上用很好看的字写着：「给莱莱」。*":"*A ring of moss-covered stones. An oilcloth bundle is pinned under one of them. On it, in beautiful handwriting: \"For Laila.\"*","小莱：……这是我娘的字。":"Lai: ...That's Mum's writing.","让小莱打开":"Let Lai open it","*「莱莱：今天我们走到了雾沼。你爹说这里的蘑菇会唱歌，我不信，结果它们真的唱了。等我们回去，带你来听。——娘」*":"*\"Laila: Today we reached the Fog Marsh. Your dad said the mushrooms here sing. I didn't believe him, and then they really sang. When we get home, I'll bring you to hear them. — Mum\"*","*小莱把信叠好，放进了最里面的口袋。*":"*Lai folds the letter and puts it in her innermost pocket.*","小莱的第一封信":"Lai's First Letter","漂着的信":"The Floating Letter","*一封信漂在水面上，一直漂不走，好像在等人。*":"*A letter floats on the water and won't drift away, as if it's waiting for someone.*","*小莱把它捞了起来。是她爹的字，歪歪扭扭的。*":"*Lai fishes it out. It's her dad's writing, crooked and uneven.*","让小莱读":"Let Lai read it","*「莱莱：爹在书库里找到了一本书，书上说，人上下深渊太多次，会变成别的东西。爹不信。爹只是……最近总觉得手不太像自己的手了。别担心。——爹」*":"*\"Laila: Dad found a book in the library. It says people who go up and down the abyss too many times turn into something else. Dad doesn't believe it. It's just... lately my hands don't quite feel like my own. Don't worry. — Dad\"*","小莱的第二封信":"Lai's Second Letter","刻在根上的字":"Words Carved in the Root","*巨根上刻着字，被苔藓盖住了一半。*":"*Words are carved into a giant root, half covered in moss.*","*巨根上刻着字，被苔藓盖住了一半。小莱用袖子一点一点擦开。*":"*Words are carved into a giant root, half covered in moss. Lai wipes it clean bit by bit with her sleeve.*","让小莱读完":"Let Lai read to the end","*「莱莱：娘走不动了。爹背着她往下走，说最深处有一面镜子，能照出人原来的样子。如果有一天你来到这里，别怕那个追着你跑的东西。它只是认得你的声音。——爹 娘」*":"*\"Laila: Mum can't walk anymore. Dad is carrying her down. He says at the very bottom there's a mirror that shows people as they truly were. If you ever come here, don't be afraid of the thing that chases you. It just knows your voice. — Dad, Mum\"*","*小莱站了很久。然后她抬起头：「我们去最深的地方吧。」*":"*Lai stands there a long time. Then she looks up: \"Let's go to the deepest place.\"*","小莱的第三封信":"Lai's Third Letter","格林的第八次":"Grim's Eighth Time","*地上有七道刻痕，排得整整齐齐。*":"*Seven notches in the ground, neatly in a row.*","*地上有七道刻痕，排得整整齐齐。格林蹲下来，用手指一道一道摸过去。*":"*Seven notches in the ground, neatly in a row. Grim crouches and runs his finger over them, one by one.*","格林：七次。每次都是在这里，掉头回去的。":"Grim: Seven times. Every time, this is where I turned back.","让格林刻第八道":"Let Grim carve the eighth","然后，往前走":"And then, walk on","*格林刻下了第八道。然后他站起来，第一次走过了那条线。*":"*Grim carves the eighth notch. Then he stands, and for the first time, walks past the line.*","格林：……原来线后面，也就是一样的路。":"Grim: ...So past the line, it's just the same road.","§格林的骰子多了一面「成」：每次远征，第一次掷到它时自动成功。":"§Grim's die gained a \"Won\" face: the first time he rolls it each expedition, it's an automatic success.","*格林的手停在第八道上面，刻不下去。*":"*Grim's hand hovers over the eighth notch. He can't carve it.*","不急":"No hurry","格林：……下次。":"Grim: ...Next time.","最后的营地":"The Last Camp","*一处营地。两个睡袋，一个空着，一个被撕开了。*":"*A campsite. Two bedrolls: one empty, one torn open.*","*一处营地。两个睡袋，一个空着，一个被撕开了。旁边放着一块被啃过一口的面包，已经变成了石头。*":"*A campsite. Two bedrolls: one empty, one torn open. Beside them, a loaf with one bite taken out, long since turned to stone.*","小莱：……这是我家的面包。我娘烤的，上面有个十字。":"Lai: ...That's our bread. Mum baked it. It has a cross on top.","让小莱坐一会儿":"Let Lai sit a while","*小莱在空着的睡袋旁边坐了下来。谁也没有催她。*":"*Lai sits down beside the empty bedroll. Nobody hurries her.*","*过了很久，她站起来，把自己的面包放在了那块石头面包旁边。*":"*After a long time, she stands and sets her own bread beside the stone loaf.*","*王座上的哥布林王睡得正香，口水流到了肚子上。王座底下堆着金子。*":"*The Goblin King is fast asleep on his throne, drool running down his belly. Gold is piled beneath the throne.*","*哥布林王醒着，正在训斥手下。它还没发现你们。*":"*The Goblin King is awake, scolding his underlings. He hasn't noticed you yet.*","*哥布林王从王座上跳了起来，大肚子一颤一颤的：「谁！谁敢闯本王的宫殿！」*":"*The Goblin King leaps off his throne, belly wobbling: \"Who! Who dares invade my palace!\"*","大喊「你妈来了！」":"Yell \"Your mum's here!\"","你知道它最怕谁":"You know who he's most afraid of","*哥布林王的脸一下子白了。它尖叫一声，从王座上滚下来，钻进了王座底下，再也不肯出来。*":"*The Goblin King goes white. He shrieks, tumbles off the throne, crawls underneath it, and refuses to come out.*","砸王座":"Smash the throne","*王座的一条腿被砸断了。哥布林王摔了个四脚朝天。*":"*One leg of the throne snaps. The Goblin King lands flat on his back.*","*哥布林王的权杖砸在了头上。*":"*The Goblin King's scepter cracks down on a head.*","拆了它的陷阱":"Disarm his traps","*你们把它埋在地上的夹子全踩翻了，再一个个扔回它脚下。*":"*You trip every snare buried in the floor, then toss them back at his feet one by one.*","*夹子夹住了腿。*":"*A snare clamps onto a leg.*","*哥布林王跪在地上求饶，把王冠里抠出来的一块发光的石头递了过来。*":"*The Goblin King kneels and begs for mercy, holding out a glowing stone he pried from his crown.*","*一个巨大的史莱姆沉在水底，一动不动。它的肚子里漂着很多东西：剑、靴子、一顶帽子、一个宝箱。*":"*A giant slime lies motionless at the bottom of the water. Things float in its belly: swords, boots, a hat, a chest.*","*水面在冒泡。沼泽之母慢慢浮了上来，但还没发现你们。*":"*The water bubbles. The Swamp Mother rises slowly, but hasn't noticed you yet.*","*沼泽之母整个从水里立了起来。它比一座房子还大。它的肚子里，漂着你们之前丢掉的东西。*":"*The Swamp Mother rears up out of the water. She's bigger than a house. In her belly float the things you lost along the way.*","撒盐":"Throw salt","蘑菇说过，它怕盐":"The mushroom said she fears salt","*盐撒上去的地方，沼泽之母缩成了一团，越缩越小，最后只有一个水缸那么大。*":"*Wherever the salt lands, the Swamp Mother shrinks, smaller and smaller, until she's the size of a water barrel.*","劈开它":"Hack her open","*刀劈进去，史莱姆往两边分开。*":"*The blade goes in and the slime parts.*","*刀被溶掉了一截。*":"*The blade dissolves a little.*","把它肚子里的东西掏出来":"Pull the things out of her belly","成功还能拿回丢掉的东西":"Succeed and you get back what you lost","*你们从它肚子里掏出了一把剑、一个背包，还有你们之前丢掉的东西。*":"*From her belly you pull a sword, a pack, and the things you lost earlier.*","*有人整个被吸了进去，又被吐了出来。*":"*Someone gets sucked all the way in, then spat back out.*","*沼泽之母化成了一摊清水。水底留下一块发光的石头。*":"*The Swamp Mother melts into a pool of clear water. A glowing stone is left at the bottom.*","*一盏幽灵灯浮在书桌上。灯旁边，一个透明的老人趴在书上睡着了。*":"*A ghost lamp floats above a desk. Beside it, a translucent old man sleeps face-down on a book.*","*幽灵在书架之间游荡，嘴里念着书名。*":"*The ghost drifts between the shelves, murmuring titles.*","*幽灵抬起头。它的眼睛是两盏灯：「借书证。」*":"*The ghost looks up. Its eyes are two lamps: \"Library card.\"*","幽灵：没有借书证？那就回答我的问题。答对三次，你们可以走。":"Ghost: No library card? Then answer my questions. Answer three right, and you may go.","回答问题":"Answer the question","答案藏在翻过的书页里：每张书页让难度 −2":"The answers are in the pages you've read: each page lowers the difficulty by 2","幽灵：……正确。":"Ghost: ...Correct.","幽灵：错。":"Ghost: Wrong.","讲一个书里没有的故事":"Tell a story that isn't in any book","*幽灵听完，沉默了很久，在本子上记了一笔。*":"*The ghost listens, is silent a long time, then makes a note in its ledger.*","幽灵：这本我读过。":"Ghost: I've read that one.","把书烧了":"Burn the books","*书烧起来了。幽灵尖叫着扑过去救书。*":"*The books catch fire. The ghost shrieks and flies to save them.*","*火把被一阵风吹灭了。*":"*A gust blows the torch out.*","*幽灵把一枚发光的书签夹进了你的手里：「逾期不还，罚款。」然后它散成了满天的书页。*":"*The ghost slips a glowing bookmark into your hand: \"Overdue returns will be fined.\" Then it scatters into a sky of pages.*","*一只巨大的蜥蜴盘在熔岩池里，每呼一口气，池子就亮一下。*":"*A giant lizard lies coiled in the lava pool. Every breath it takes, the pool flares.*","*熔岩巨蜥睁开了一只眼。*":"*The Magma Salamander opens one eye.*","*熔岩巨蜥从池子里爬了出来。它身上淌下来的，是熔岩。*":"*The Magma Salamander crawls out of the pool. What drips off it is lava.*","泼莫娜的冷冻药":"Throw Mona's freezing draught","*冷冻药泼在巨蜥身上，冒起一大团白汽。等汽散了，它变成了一块灰色的石头，只有眼睛还在转。*":"*The draught hits the salamander in a great cloud of white steam. When it clears, it's a grey stone, only its eyes still moving.*","把它引到冷水边":"Lure it to cold water","锁链上的人写过：它怕冷水":"Whoever wrote on the chains said: it fears cold water","*巨蜥一脚踩进了地下河。滋——的一声，它缩成了一只小蜥蜴，钻进了石头缝。*":"*The salamander steps into an underground stream. Tsssss — it shrinks to a little lizard and darts into a crack.*","砍它":"Hack at it","*刀砍进了鳞片的缝里。*":"*The blade finds the gap between scales.*","*巨蜥喷出一口火。*":"*The salamander breathes fire.*","绕着它跑，等它累":"Run circles until it tires","*巨蜥绕晕了，一头撞在铁砧上。*":"*The salamander gets dizzy and slams headfirst into the anvil.*","*尾巴扫了过来。*":"*Its tail sweeps across.*","*巨蜥倒下的地方，熔岩慢慢冷了。冷掉的熔岩里，嵌着一块发光的石头。*":"*Where the salamander falls, the lava slowly cools. Set in the cooled rock is a glowing stone.*","*一头巨大的鹿形野兽盘在根上睡着。它的一半身子开满了花，另一半已经枯了。*":"*A huge deer-like beast sleeps curled around the roots. Half its body is in bloom; the other half has withered.*","*守林兽醒了。它枯掉的那一半，在往活着的那一半上爬。*":"*The Forest Guardian is awake. Its withered half is creeping over the living half.*","*守林兽站了起来。它不想打。它只是很疼。*":"*The Forest Guardian stands. It doesn't want to fight. It's just in pain.*","§它不能被杀死，只能被治好。":"§It cannot be killed. Only healed.","给它晨露":"Give it morning dew","*晨露落在枯掉的那一半上。枯枝里冒出了一个很小的芽。守林兽低下头，用鼻子碰了碰你的手。*":"*The dew falls on the withered half. A tiny bud pushes out of a dead branch. The Guardian lowers its head and nudges your hand with its nose.*","种下魔王的种子":"Plant the Demon King's seed","*种子一碰到根就扎了进去。整棵巨树抖了一下，枯掉的那一半里，长出了一根黑色的新枝。守林兽站在那里，看了它很久。*":"*The moment the seed touches the root, it burrows in. The whole great tree shudders, and from the withered half grows a new black branch. The Guardian stands and stares at it a long time.*","安抚它":"Soothe it","*守林兽的呼吸慢了一点。*":"*The Guardian's breathing slows a little.*","*它疼得甩了一下头。*":"*It tosses its head in pain.*","清理枯掉的根":"Clear away the dead roots","*你们剪掉了一截枯根。守林兽轻轻哼了一声。*":"*You cut away a dead root. The Guardian hums softly.*","*剪错了。*":"*Cut the wrong one.*","打它":"Attack it","*刀砍进去的地方，长出了新的枯根。没用。*":"*Where the blade goes in, new dead roots grow. Useless.*","*它用角把人挑飞了。*":"*It tosses someone into the air with its antlers.*","*守林兽重新躺了下来。这一次，它睡得很安稳。它身边的根须上，挂着一块发光的石头。*":"*The Forest Guardian lies back down. This time it sleeps peacefully. From the roots beside it hangs a glowing stone.*","*一面很高的镜子立在湖心。镜子里空无一人。*":"*A tall mirror stands in the middle of the lake. There's no one in it.*","*镜子里慢慢浮出了几个人影。是你们，但不是现在的你们。*":"*Figures slowly surface in the mirror. It's you. But not you as you are now.*","*镜子里站着你们。是你们第一次下来那天早上的样子。*":"*You stand in the mirror. As you were the morning you first came down.*","*镜子里的人，同时举起了手里的骰子。*":"*The people in the mirror raise their dice at the same time.*","*镜子碎了。碎片里，每个人都看见了现在的自己。*":"*The mirror shatters. In the shards, everyone sees themselves as they are now.*","前人的背包":"A Predecessor's Pack","*一个很旧的背包挂在岩壁上。里面有一封没寄出去的家书，收信人住在深渊口镇。*":"*An old pack hangs on the rock. Inside is an unsent letter home, addressed to someone in Abyssmouth.*","没寄出去的家书":"Unsent letter home","一封没寄出去的家书":"An unsent letter home","龙的眼睛":"The Dragon's Eye","讲一个故事给它听":"Tell it a story","花掉一个故事":"Spend one story","你还没有可以讲的故事":"You don't have a story to tell yet","*黑暗里睁开了一只金色的眼睛。它听完了你的故事，眨了一下。*":"*A golden eye opens in the dark. It listens to your story, and blinks.*","§这一趟，下一次检定会自动成功。":"§This trip, your next check automatically succeeds.","低下头，慢慢走过去":"Lower your head and walk past slowly","*那只眼睛一直看着你们走远。*":"*The eye watches you all the way out of sight.*","*黑暗里，睁开了一只金色的眼睛。它比你们整个人还大。*":"*In the dark, a golden eye opens. It's bigger than any of you.*","地震":"Earthquake","*整条通道都在晃。等晃停了，前面的路好像都不一样了。*":"*The whole tunnel shakes. When it stops, the road ahead seems different.*","§所有还没翻开的格子，重新洗了一遍。":"§Every unrevealed tile has been reshuffled.","让队长听":"Let the leader listen","*队长听清了一句话。是关于这里的头目的。*":"*The leader catches one sentence. It's about the boss of this place.*","*那声音说了一个名字。是队长自己的。*":"*The voice says a name. The leader's own.*","*有个声音在队长耳边说话。*":"*A voice speaks into the leader's ear.*","流浪商人":"Wandering Merchant","用一件战利品换一张卡":"Trade a piece of loot for a card","*商人从斗篷里摸出一张卡，看都没看就递给了你。*":"*The merchant pulls a card from his cloak and hands it over without looking.*","不换":"No trade","*商人耸耸肩，走进了黑暗里。*":"*The merchant shrugs and walks into the dark.*","*一个裹着斗篷的人坐在路边，面前摊着几张卡：「换不换？」*":"*A cloaked figure sits by the path with a few cards spread out: \"Trade?\"*","银鹰队的脚印":"Silver Eagles' Tracks","*地上有新鲜的脚印，靴底上印着一只鹰。*":"*Fresh footprints on the ground, an eagle stamped on the boot soles.*","§他们走得很急，什么也没拿。":"§They were in a hurry and took nothing.","余震":"Aftershock","前人的火把堆":"A Predecessor's Torch Pile","*墙角堆着一捆还没用过的火把。*":"*A bundle of unused torches is stacked in the corner.*","散落的金币":"Scattered Coins","*地上散着几枚金币，好像有人跑的时候掉的。*":"*A few coins are scattered on the ground, as if someone dropped them running.*","灯灭了":"Lights Out","*一阵风，两根火把同时灭了。*":"*A gust, and two torches go out at once.*","引路的东西":"Something Leading the Way","*有什么东西在前面亮了一下，又亮了一下，像在给你们指路。*":"*Something glows ahead, then glows again, as if showing you the way.*","队长":"the leader","*头顶传来一声很轻的「咔」。*":"*A very soft \"crack\" overhead.*","*然后是第二声。灰土像沙漏一样从石缝里漏下来，矿灯开始晃。*":"*Then a second. Grit pours from the cracks like an hourglass, and the mine lamps start to sway.*","*整条矿道都在呻吟。你们大概还有三次呼吸的时间。*":"*The whole tunnel is groaning. You have maybe three breaths.*","别跑。先看哪根梁还站着。":"Don't run. First see which beam is still standing.","我、我扛得住！……应该吧？":"I-I can hold it! ...Probably?","上、上面在掉东西！":"S-stuff's falling from up there!","扛住正在塌的那根梁":"Hold up the beam that's giving way","最多两个人。扛住了，梁后面也许有路；扛不住，就砸在扛的人身上":"Two people at most. Hold it, and there may be a path behind the beam; fail, and it comes down on whoever's holding","*梁压在肩膀上，骨头咯吱响。但它没有倒下。*":"*The beam presses on shoulders, bones creaking. But it doesn't fall.*","*石头落尽以后，梁后面露出了一条前人挖了一半的矿道。*":"*When the last stone settles, behind the beam is a half-dug tunnel left by someone before you.*","半截矿道里的矿石":"Ore from the half-dug tunnel","*梁断了。*":"*The beam snaps.*","找那根还撑得住的梁，全躲到它下面":"Find the beam that will hold and all hide under it","只派一个人判断。判断对了，所有人都记住这种声音":"Send one person to judge. Judge right, and everyone learns the sound","*你们挤在一根老梁下面。外面的世界塌成了一片灰。梁一动没动。*":"*You huddle under an old beam. Outside, the world collapses into grey. The beam doesn't budge.*","*选错了梁。*":"*Wrong beam.*","扔下背包，往回跑":"Drop your packs and run back","不用掷骰。一定跑得掉，但会丢一件战利品、一根火把，也学不到什么":"No roll. You'll definitely get away, but lose one piece of loot and a torch, and learn nothing","*你们扔下最重的东西，头也不回地跑。身后的矿道，整条塌没了。*":"*You throw down the heaviest things and run without looking back. Behind you, the whole tunnel caves in.*","*一开始只是甜味，像熟透的果子。*":"*At first it's just a sweet smell, like overripe fruit.*","*然后萤火虫一只接一只，掉进了水里。*":"*Then the fireflies drop into the water, one after another.*","*紫色的雾贴着水面爬过来，爬上栈道，爬上脚踝。*":"*Purple fog creeps across the water, up onto the walkway, up around your ankles.*","*小莱咳了一声。又一声。她捂住嘴，指缝里漏出来的气是紫色的。*":"*Lai coughs. Then again. She covers her mouth; the breath leaking between her fingers is purple.*","这味儿……还挺香？":"This smell... is kind of nice?","捂住嘴。别闻。":"Cover your mouth. Don't breathe it.","在雾里找解毒的草":"Find the antidote herb in the fog","只派一个人。认对了，还能带一把走":"Send one person. Pick the right one and you can take a handful","解毒草":"Antidote herb","*认错了。嚼下去的那一把草，比雾还苦。*":"*Wrong. The handful you chewed is more bitter than the fog.*","屏住气，所有人一起冲过去":"Hold your breath, everyone run through together","难。冲过去了，所有人都多一道疤；冲不过去，倒下的是随机一个人":"Hard. Make it, and everyone gets a scar; don't, and someone random goes down","*冲出雾的时候，所有人都跪在地上大口喘气。但所有人都出来了。*":"*Bursting out of the fog, everyone collapses gasping. But everyone made it.*","*跑到一半，有人憋不住了。*":"*Halfway through, someone can't hold it.*","退回去，绕远路":"Go back, take the long way","不用掷骰。火把 −3，什么也学不到":"No roll. Torches −3, and you learn nothing","*你们退了回去，绕着雾走了很久很久。*":"*You go back and skirt the fog for a long, long time.*","*水先是没过了鞋面。然后是脚踝。*":"*First the water covers your boots. Then your ankles.*","*远处传来一声闷响，像有一扇很大的门被冲开了。*":"*A dull boom in the distance, like a huge door bursting open.*","*书页从书架上一层一层漂下来，像一群白色的鱼。水在往上涨。很快，非常快。*":"*Pages drift down from the shelves layer by layer, like a school of white fish. The water is rising. Fast. Very fast.*","*格林一把抓住了书架。他的指节是白的。*":"*Grim grabs a shelf. His knuckles are white.*","水、水到膝盖了！":"Th-the water's up to my knees!","……书、书都要泡坏了……":"...Th-the books are all getting ruined...","爬上书架，等水退":"Climb the shelves and wait for the water to drop","容易。但要等很久：火把 −2":"Easy. But it takes a long time: torches −2","*你们挂在书架顶上，看着水从脚下流过去，等了很久很久。*":"*You hang from the top of the shelves and watch the water rush beneath you, waiting a long, long time.*","*书架被水推倒了，你们一起栽了下去。*":"*The water knocks the shelf over and you all go in with it.*","顺着水流游出去":"Swim with the current","难。水会把你们冲到一个没人去过的地方；游不动，就会被冲走东西":"Hard. The water will carry you somewhere no one's been; if you can't swim it, it'll wash your things away","*水把你们冲进了一间被封住的阅览室。桌上还摆着没人动过的东西。*":"*The water sweeps you into a sealed reading room. Things still sit on the desks, untouched.*","阅览室里的东西":"Things from the reading room","撬开头顶的天窗":"Pry open the skylight overhead","只派一个人。打开了，水会从天窗漏出去，你们还能从上面看清整层":"Send one person. Open it, and the water drains out through it, and you can see the whole floor from above","*天窗咔的一声开了，水哗地往上涌出去。你们趴在天窗边上，第一次看清了这一层的样子。*":"*The skylight clicks open and the water surges up and out. Hanging at the edge, you see this floor clearly for the first time.*","*天窗锈死了。水漫过了所有人的头顶，又慢慢退下去。*":"*The skylight is rusted shut. The water closes over everyone's heads, then slowly recedes.*","*地面烫得隔着靴底都能感觉到。*":"*The floor is so hot you can feel it through your boots.*","*熔岩河中间鼓起一个泡。又一个。泡越来越大，大得能装下一个人。*":"*A bubble swells in the middle of the lava river. Then another. They grow until each could swallow a person.*","*格林喊了一声矮人话。你听不懂，但你知道那是「趴下」。*":"*Grim shouts something in Dwarvish. You don't understand it, but you know it means \"get down\".*","那、那个泡是不是在看我们？":"I-is that bubble looking at us?","好、好热……":"S-so hot...","铁砧后面挤不下所有人：最多两个人掷，没掷的人自己想办法":"There's not room for everyone behind the anvil: two people roll at most, the rest fend for themselves","*熔岩像雨一样打在铁砧上。铁砧后面的人，一点事都没有。*":"*Lava rains down on the anvil. Whoever's behind it is completely fine.*","数准喷发的节奏，从泡中间冲过去":"Time the eruptions and run between the bubbles","只派一个人数。数对了，所有人冲过去，还能顺手捡一块炎心石":"Send one person to count. Count right, and everyone gets through, and grabs a Flameheart Stone on the way","*一、二、三——跑！*":"*One, two, three — run!*","*你们从两个泡中间冲了过去。冲过去的时候，有人从熔岩边捡起了一块还在发光的石头。*":"*You dash between two bubbles. On the way, someone scoops a still-glowing stone from the lava's edge.*","*数错了一拍。*":"*Off by a beat.*","把战利品扔进熔岩":"Throw loot into the lava","不用掷骰。矮人说，熔岩喜欢金子：丢两件，它就安静":"No roll. The dwarves say lava loves gold: throw in two pieces and it calms down","你身上没东西可扔":"You have nothing to throw","*东西掉进熔岩里，滋的一声。那个泡，慢慢地瘪了下去。*":"*The things drop into the lava with a hiss. The bubble slowly sags.*","*枯死的那一半根须开始发出声音，像有人在很远的地方咳嗽。*":"*The dead half of the roots starts making a sound, like someone coughing very far away.*","*然后整片枯根一起裂开了。*":"*Then the whole stretch of dead roots splits open at once.*","*灰白色的孢子像雪一样落下来。落在皮肤上，有点痒。然后有点疼。*":"*Grey-white spores fall like snow. They land on your skin. A little itchy. Then a little painful.*","这、这是雪吗？……不是雪。":"I-is this snow? ...It's not snow.","别碰！谁都别碰！":"Don't touch it! Nobody touch it!","屏住气。":"Hold your breath.","用湿布捂住嘴，慢慢走":"Cover your mouths with wet cloth and walk slowly","稳。但每走一步都要很小心：火把 −1":"Steady. But every step needs care: torches −1","*布是湿的。孢子全粘在了布上。*":"*The cloth is wet. The spores all stick to it.*","*有人咳了很久，咳出来的是灰色的。*":"*Someone coughs for a long time. What comes up is grey.*","钻进活的那一半根里":"Crawl into the living half of the roots","活的根会动、会缠人。钻进去了，它们会护着你们，还会给你们泉水":"Living roots move and grab. Get inside, and they'll shelter you, and give you spring water","*活的根须轻轻合上，把你们包在里面。外面下着灰色的雪，里面滴着银色的水。*":"*The living roots close gently around you. Outside falls grey snow; inside drips silver water.*","*根缠住了队长的脖子。*":"*A root wraps around the leader's neck.*","用火把烧出一条路":"Burn a path with the torches","不用掷骰。火把 −3，动静 +1":"No roll. Torches −3, noise +1","*孢子烧起来噼噼啪啪地响，像下了一场火做的雪。*":"*The spores crackle as they burn, like a snowfall made of fire.*","*先是脚步声没了。*":"*First the footsteps vanish.*","*然后是呼吸声。*":"*Then the breathing.*","*你张嘴喊队友的名字，什么都没听见。你看见他们的嘴也在动。*":"*You open your mouth to call your companions' names and hear nothing. You see their mouths moving too.*","手拉着手往前走":"Walk forward hand in hand","最多两个人带。走出去的人多一道疤":"Two people lead at most. Whoever makes it out gets a scar","*你们手拉着手，走出了那片寂静。第一个声音回来的时候，是有人在哭。*":"*Hand in hand, you walk out of the silence. The first sound to come back is someone crying.*","让一个人在心里数数，其他人跟着他":"Have one person count in their head, the rest follow","只派一个人。数到底，所有人都多一道疤":"Send one person. If they count it through, everyone gets a scar","*数着数着，他忘了自己是谁。*":"*Counting and counting, he forgets who he is.*","拼命喊出声来":"Scream as loud as you can","容易。但喊出来的声音会传得很远：动静 +2":"Easy. But the scream carries far: noise +2","*声音像玻璃一样碎开了。整个镜湖都听见了你们。*":"*Sound shatters like glass. The whole mirror lake hears you.*","*喊不出来。喉咙像被人掐住了。*":"*Nothing comes out. Like a hand around your throat.*","*咔哒。*":"*Click.*","扑过去抓住队长":"Lunge and grab the leader","队长自己抓不了自己。抓住了，什么事都没有":"The leader can't grab himself. Grab him, and nothing happens","*石板塌下去的一瞬间，一只手抓住了队长的领子。*":"*As the flagstone drops away, a hand catches the leader's collar.*","*只抓到了一把空气。*":"*Only a fistful of air.*","让队长自己往前扑":"Let the leader dive forward himself","只能队长掷。扑过去了，坑边挂着前人的背包":"Only the leader rolls. Make it across, and there's a predecessor's pack hanging at the pit's edge","*队长借着下坠的力往前一扑，扑到了对面。坑边挂着一个前人的背包，他顺手扯了下来。*":"*Using the fall's momentum, the leader dives to the other side. A predecessor's pack hangs at the pit's edge; he yanks it down on the way.*","坑边的背包":"Pack from the pit's edge","*差了一点点。*":"*Just short.*","*黑水一下子没到了腰。然后是胸口。水下有东西在拽他的脚。*":"*Black water is up to the waist in an instant. Then the chest. Something under the water is pulling at his feet.*","*格林往后退了一步。他看着水，没有动。*":"*Grim steps back. He stares at the water and doesn't move.*","抓、抓住我的手！":"G-grab my hand!","把队长拽上来":"Haul the leader out","队长自己拽不了自己。拽太急，他的包会掉进水里":"The leader can't haul himself. Pull too hard and his pack falls in the water","*队长被拽了上来，浑身都是黑泥，但包还在。*":"*The leader is hauled out, covered in black mud, but his pack is still there.*","*拽上来的时候，队长的包沉下去了。*":"*As the leader comes up, his pack sinks.*","让队长别动，慢慢往后仰":"Tell the leader to stay still and lean back slowly","只能队长掷。考胆子：越挣扎沉得越快。仰住了，泥里还能摸到东西":"Only the leader rolls. A test of nerve: the more you struggle, the faster you sink. Float, and you can feel around in the mud","*队长闭上眼睛，往后一仰，居然浮了起来。手在泥里一摸，摸到了一个硬东西。*":"*The leader closes his eyes, leans back, and actually floats. His hand sweeps the mud and finds something hard.*","泥里摸到的东西":"Something found in the mud","*他慌了。*":"*He panics.*","*头顶传来扑棱棱的声音。*":"*A fluttering overhead.*","*一开始是一只。然后是十只。然后整个洞顶都在动。*":"*At first one. Then ten. Then the whole cave ceiling is moving.*","*火把的光照上去，你看见几千双红色的小眼睛。*":"*The torchlight goes up, and you see thousands of tiny red eyes.*","*布兰德的火把在发抖。*":"*Brand's torch is shaking.*","好、好多……":"S-so many...","熄掉火把，趴下不动":"Douse the torches and lie still","容易。但熄掉的火把点不回来：火把 −1":"Easy. But a doused torch won't relight: torches −1","*黑暗里，几千只翅膀从头顶刮过去。一只都没停。*":"*In the dark, thousands of wings scrape past overhead. Not one stops.*","*有人跳起来挥手。蝙蝠全扑了下来。*":"*Someone jumps up waving. The whole swarm dives.*","看它们往哪飞":"Watch where they fly","蝙蝠总是往有出口的地方飞。看懂了，能翻开前面的路":"Bats always fly toward an exit. Read them right, and you reveal the path ahead","*它们绕了两圈，然后全往一个方向涌了过去。那边有风。*":"*They circle twice, then all pour in one direction. There's a draft that way.*","*看着看着，蝙蝠群朝你们的脸扑了过来。*":"*As you watch, the swarm flies straight at your faces.*","*布兰德一斧头劈进了石壁，整个人吊在半空，然后一点一点爬了上来。*":"*Brand buries his axe in the rock wall, hangs there in midair, then climbs up inch by inch.*","*布兰德冲着水下那东西狠狠踹了一脚。那东西松开了，他自己扒着浮木爬了上来。*":"*Brand kicks the thing under the water as hard as he can. It lets go, and he hauls himself up onto the driftwood.*","*格林在掉下去的一瞬间认出了这种机关：坑壁上有给修机关的人留的踏脚。他踩着踏脚，慢慢走了上来。*":"*As he falls, Grim recognizes the mechanism: there are footholds in the pit wall, left for whoever maintains the trap. He walks up them, slowly.*","*格林闭上眼睛，屏住气，沉下去，摸到了浮木的桩子，顺着桩子爬了上来。上来以后，他坐在地上很久没说话。*":"*Grim closes his eyes, holds his breath, sinks, finds a driftwood post, and climbs up it. Once up, he sits on the ground a long time without speaking.*","*小莱像猫一样，在坑壁上蹬了两下，翻了上来。*":"*Lai kicks off the pit wall twice like a cat and flips back up.*","*小莱一点都不挣扎，像只小虫一样从泥里扭了出来。*":"*Lai doesn't struggle at all; she wriggles out of the mud like a little bug.*","*卡尔的剑插进了石缝。剑身弯成一张弓，没有断。*":"*Karl's sword bites into a crack in the stone. The blade bends like a bow, and doesn't break.*","*卡尔一剑刺进水里。水下那东西松开了。*":"*Karl stabs into the water. The thing below lets go.*","*缇缇念了一个很短的咒。她往下坠的速度，慢得像一片叶子。*":"*Titi murmurs a very short spell. She falls as slowly as a leaf.*","*缇缇念了一个咒，泥变硬了一小块。她站在那一小块上，不敢动。*":"*Titi murmurs a spell and a little patch of mud hardens. She stands on it, too scared to move.*","扑过去拽住队长":"Lunge and grab the leader","别人去拽。拽上来以后，你们就认得这种石板了：前面 6 格全部翻开":"Someone else grabs. Once he's up, you'll recognize these flagstones: the next 6 tiles are revealed","*你们趴在坑边看了很久，终于看懂了这种机关。往前看，每一块会动的石板都清清楚楚。*":"*You lie at the pit's edge a long time and finally understand the mechanism. Looking ahead, every loose flagstone is plain as day.*","让队长自己想办法":"Let the leader get himself out","爬上来的路上，能扯下一个前人的背包":"On the way up, he can tear down a predecessor's pack","*爬上来的时候，他顺手扯下了一个挂在坑壁上的背包。*":"*Climbing out, he tears down a pack hanging on the pit wall.*","坑壁上的背包":"Pack from the pit wall","*手滑了。*":"*His hand slips.*","松手，放绳子下去捞他":"Let go, then lower a rope to fish him out","不用掷骰。队长一定会摔伤，但坑底有前人留下的全部东西":"No roll. The leader will definitely get hurt, but the bottom of the pit holds everything those before you left","队长已经重伤，再摔一次会死":"The leader is already badly hurt; another fall would kill him","*你们松了手。很久以后，坑底传来一声闷响，和一声骂人的话。*":"*You let go. A long time later, a thud comes from the bottom, followed by swearing.*","*绳子拉上来的时候，队长身上挂满了前人的东西。*":"*When the rope comes up, the leader is draped in the belongings of those who came before.*","坑底的遗物":"Relics from the pit's bottom","*黑水一下子没到了腰。然后是胸口。*":"*Black water is up to the waist in an instant. Then the chest.*","*水下有东西缠住了他的脚，在往下拽。*":"*Something under the water has wrapped around his feet and is pulling him down.*","撑住！我来了！":"Hold on! I'm coming!","别人去拽。拽得够狠，连水下那东西一起拽上来：莫娜会要":"Someone else hauls. Pull hard enough and you drag up the thing below too: Mona will want it","*队长被拽了上来。缠在他脚上的那东西也跟着上来了：一条手臂那么粗的沼泽鳗，还在扭。*":"*The leader is hauled out. The thing wrapped around his feet comes with him: a swamp eel as thick as an arm, still writhing.*","沼泽鳗":"Swamp eel","让队长自己挣脱":"Let the leader break free himself","挣脱的时候能踩到水底的东西":"Breaking free, he might step on something at the bottom","*他脚底下踩到了一个硬东西，顺手捞了上来。*":"*His foot finds something hard below, and he hauls it up.*","水底的箱子":"Box from the bottom","*他越挣扎，沉得越快。*":"*The more he struggles, the faster he sinks.*","扔一件战利品下去，把那东西引开":"Throw down a piece of loot to lure the thing away","不用掷骰。一定能救上来，但要丢一件东西":"No roll. He'll definitely be saved, but you lose something","*东西刚落水，脚上的那东西就松开了，追着它沉了下去。*":"*The moment it hits the water, the thing lets go of his feet and sinks after it.*","、":",","东西还没凑齐":"Not all the goods yet","金币不够":"Not enough gold","*铁匠铺里很热。一个光头的老矮人抱着胳膊，看着你走进来。*":"*The smithy is hot. A bald old dwarf stands with his arms crossed, watching you walk in.*","老霍：……你就是新来的中间人？":"Old Ho: ...You're the new middleman?","老霍：我不跟中间人做生意。中间人只会压价。":"Old Ho: I don't do business with middlemen. Middlemen just haggle prices down.","*他看了一眼你身后的布兰德、格林和小莱。*":"*He glances at Brand, Grim and Lai behind you.*","老霍：……不过矿道里的铁，最近没人肯下去挖。带回来两块铁矿、一块金矿，我就记你一笔。":"Old Ho: ...But nobody's been willing to go down and dig iron in the mine lately. Bring back two iron ore and one gold ore, and I'll owe you one.","§新委托：矿道里的铁。":"§New commission: Iron from the Mine.","老霍：东西带来了？放这儿。":"Old Ho: Brought it? Put it here.","老霍：铁呢？……没带来就别站在门口挡光。":"Old Ho: Where's the iron? ...If you didn't bring it, don't stand in the doorway blocking my light.","老霍：炎心石。只有熔岩锻炉里才有。":"Old Ho: Flameheart Stone. Only found in the Lava Forge.","老霍：我师父当年，就是用炎心石打的第一把剑。……我想给她打一把。":"Old Ho: My master forged her first sword with a Flameheart Stone. ...I want to forge one for her.","老霍：婆婆在后面。……别惹她。":"Old Ho: Granny's in the back. ...Don't cross her.","*老霍在磨一把剑，没抬头。*":"*Old Ho is grinding a sword. He doesn't look up.*","老霍：铁骰还用得惯吧？用完记得还。……人情不用还。":"Old Ho: Getting on with the iron die? Give it back when you're done. ...The favor, you don't have to.","*老霍把矿石在手里掂了掂，第一次正眼看你。*":"*Old Ho weighs the ore in his hand, and looks at you properly for the first time.*","老霍：……够分量。":"Old Ho: ...Good heft.","老霍：我欠你一个人情。下去的时候，带上我这颗铁骰。它不会让你出丑，也不会让你发财。":"Old Ho: I owe you one. When you go down, take my iron die. It won't embarrass you, and it won't make you rich.","老霍：还有——熔岩锻炉里有一种石头。你要是能弄来，我还有别的东西给你。":"Old Ho: And — there's a kind of stone in the Lava Forge. Bring me one and I'll have something else for you.","§老霍欠你一个人情：出发时可以带上他的铁骰。":"§Old Ho owes you a favor: you can take his iron die on expeditions.","§熔岩锻炉解锁了。新委托：炎心石。":"§Lava Forge unlocked. New commission: Flameheart Stone.","*老霍接过炎心石，很久没说话。*":"*Old Ho takes the Flameheart Stone and says nothing for a long time.*","老霍：……婆婆！":"Old Ho: ...Granny!","*后屋走出来一个比他还矮、还老的矮人老太太。*":"*An even shorter, even older dwarf woman comes out of the back room.*","§老霍又欠你一个人情。他把你介绍给了他的师父：铁砧婆婆。":"§Old Ho owes you another favor. He introduced you to his master: Granny Anvil.","再加 1 块铁矿":"plus 1 iron ore","没有铁矿":"No iron ore","铁砧婆婆：你就是让我徒弟交出炎心石的人？":"Granny Anvil: You're the one who got my apprentice to hand over a Flameheart Stone?","铁砧婆婆：他十五岁那年打的第一把剑，断在我脚边。他哭了一整晚。第二天又来了。":"Granny Anvil: The first sword he forged, at fifteen, snapped at my feet. He cried all night. Next morning he came back.","铁砧婆婆：我只打一种剑。不会断的那种。拿炎心石来，再让那小子替你说句话。":"Granny Anvil: I forge one kind of sword. The kind that doesn't break. Bring me a Flameheart Stone, and have that boy put in a word for you.","铁砧婆婆：站直了。":"Granny Anvil: Stand up straight.","铁砧婆婆：剑不会断。人会。":"Granny Anvil: Swords don't break. People do.","*婆婆一锤下去，火星溅到了天花板上。*":"*Granny brings the hammer down and sparks hit the ceiling.*","再加 1 块炎心石 + 老霍的一份人情":"plus 1 Flameheart Stone + one of Old Ho's favors","没有炎心石":"No Flameheart Stone","老霍现在不欠你人情":"Old Ho doesn't owe you a favor right now","*炼金铺里所有的瓶子都在冒泡。一个头发乱糟糟的女人从一团紫烟里探出头。*":"*Every bottle in the alchemy shop is bubbling. A woman with wild hair pokes her head out of a cloud of purple smoke.*","莫娜：哦！哦哦哦！新面孔！你身上有矿道的味道——青苔、铁锈，还有一点点哥布林的口水。":"Mona: Oh! Oh oh oh! A new face! You smell like the mine — moss, rust, and just a hint of goblin spit.","莫娜：我要会发光的蘑菇。两朵。要活的！死的蘑菇只会发光，活的蘑菇会唱歌。":"Mona: I want glowing mushrooms. Two. Alive! Dead mushrooms only glow. Live mushrooms sing.","§雾沼解锁了。新委托：会发光的蘑菇。":"§Fog Marsh unlocked. New commission: Glowing Mushrooms.","莫娜：我闻到了！蘑菇！活的！":"Mona: I can smell them! Mushrooms! Alive!","莫娜：蘑菇呢？蘑菇呢蘑菇呢？":"Mona: Mushrooms? Mushrooms? Where are my mushrooms?","莫娜：要不要试试我的新药？喝了能看见声音。……副作用是听见颜色。":"Mona: Want to try my new potion? It lets you see sounds. ...Side effect: you hear colors.","莫娜：炸瓶要轻拿轻放。上一个客人没轻拿。":"Mona: Handle bomb flasks gently. The last customer didn't.","莫娜：你带回来的魔物材料，我按一倍半收。别告诉咕哩。":"Mona: Monster parts you bring back, I pay one and a half times. Don't tell Guli.","莫娜：它们在唱歌！听！……好吧你听不见。":"Mona: They're singing! Listen! ...Okay, you can't hear it.","莫娜：我欠你一个。带上我的玻璃骰——要么什么都没有，要么什么都有。我最喜欢这种东西了。":"Mona: I owe you one. Take my glass die — all or nothing. My favorite kind of thing.","莫娜：对了，苔母一直想见见会帮忙的人。她就在后院。":"Mona: Oh, and the Moss Mother's been wanting to meet someone helpful. She's out back.","§莫娜欠你一个人情：出发时可以带上她的玻璃骰。":"§Mona owes you a favor: you can take her glass die on expeditions.","§莫娜开始卖炸瓶。她把你介绍给了德鲁伊苔母。":"§Mona now sells bomb flasks. She introduced you to the druid, the Moss Mother.","买：冷冻药":"Buy: Freezing Draught","泼在热的东西上，热的东西就不热了。对付熔岩巨蜥。25 金":"Throw it on something hot and it stops being hot. For the Magma Salamander. 25 gold","已经有一瓶了":"You already have one","莫娜：泼在热的东西上，热的东西就不热了。泼在人身上……别泼在人身上。":"Mona: Throw it on something hot and it stops being hot. Throw it on a person... don't throw it on a person.","§得到：冷冻药":"§Got: Freezing Draught","*后院长满了你叫不出名字的草。一个披着青苔的老妇人坐在树桩上，脚边趴着一只獾。*":"*The back yard is overgrown with herbs you can't name. An old woman draped in moss sits on a stump, a badger at her feet.*","苔母：……莫娜说，你是个会帮忙的人。":"Moss Mother: ...Mona says you're the helpful sort.","*獾探出头，闻了闻你的鞋子，打了个喷嚏。*":"*The badger pokes its head out, sniffs your boots, and sneezes.*","苔母：巨树在死。一半已经死了。守林兽疼得睡不着。它杀不死，也不该被杀死。":"Moss Mother: The great tree is dying. Half of it is already dead. The Forest Guardian can't sleep for the pain. It can't be killed, and it shouldn't be.","苔母：晨露能治它。也能治人心里的「恐」。拿一朵蘑菇来换。":"Moss Mother: Morning dew can heal it. It can also heal the Fear in a person's heart. Bring me a mushroom to trade.","苔母：獾说你身上有好闻的味道。……它说的是蘑菇。":"Moss Mother: The badger says you smell nice. ...He means the mushrooms.","苔母：树会记得帮过它的人。比人记得久。":"Moss Mother: Trees remember those who helped them. Longer than people do.","换：晨露":"Trade: Morning Dew","用 1 朵会发光的蘑菇换。治守林兽，或者磨掉一面「恐」":"For 1 glowing mushroom. Heals the Forest Guardian, or wears off a Fear face","没有蘑菇":"No mushrooms","*苔母把一滴露水装进一个很小的瓶子里。露水在瓶子里亮了一下。*":"*The Moss Mother seals a drop of dew in a tiny bottle. It glows for a moment inside.*","§得到：晨露":"§Got: Morning Dew","磨掉一面「恐」，变成 3":"Wear off a Fear face, it becomes 3","没有晨露":"No morning dew","酒保：新来的中间人？坐。第一杯不要钱。":"Barkeep: New middleman? Sit. First drink's free.","*他擦着一个永远擦不干净的杯子。*":"*He's wiping a glass that will never be clean.*","酒保：在深渊口，消息比金子值钱。金子会花完，消息会一直有用——直到它没用为止。":"Barkeep: In Abyssmouth, news is worth more than gold. Gold runs out. News stays useful — until it doesn't.","酒保：今天有什么想知道的？":"Barkeep: What do you want to know today?","*酒保把杯子举到灯下看了看，又接着擦。*":"*The barkeep holds the glass up to the lamp, then goes back to wiping.*","酒保：你身上有下面的味道。活着回来就好。":"Barkeep: You smell of down there. Glad you came back alive.","买一杯，听个消息":"Buy a drink, hear some news","10 金。打听一个头目的弱点，外加两次「先看一眼」":"10 gold. Learn a boss's weakness, plus two \"take a peek\" uses","§记住了头目的弱点。":"§You remember the boss's weakness.","§酒保的消息：下去以后可以「先看一眼」两次。":"§Barkeep's news: you can \"take a peek\" twice down there.","问银鹰队这周去哪":"Ask where the Silver Eagles are this week","不要钱":"Free","*角落里趴着一个男人。腰上挂着一把擦得很亮的剑，桌上摆着七个空杯子。*":"*A man lies slumped in the corner. A sword polished to a shine hangs at his hip; seven empty glasses on the table.*","卡尔：……别看了。冠军早就死了。现在这个，只会喝酒。":"Karl: ...Stop staring. The champion died a long time ago. This one just drinks.","酒保（小声）：卡尔。十年前的剑术冠军。决赛那天，他的剑收住了。":"Barkeep (whispering): Karl. Sword champion, ten years back. In the final, he pulled his blade.","卡尔：水。……对，水。":"Karl: Water. ...Yes. Water.","卡尔：我在等一个人。等他回来，我请他喝一杯。":"Karl: I'm waiting for someone. When he's back, I'm buying him a drink.","卡尔：……再来一杯。":"Karl: ...Another one.","卡尔：你又来了。中间人都这么闲吗。":"Karl: You again. Do middlemen have nothing better to do?","*卡尔把剑放在桌上，用袖子擦了擦。剑比他干净得多。*":"*Karl lays his sword on the table and wipes it with his sleeve. The sword is much cleaner than he is.*","请卡尔训练一个人":"Ask Karl to train someone","30 金。把那个人骰子最小的一面，磨成 5":"30 gold. That person's lowest face is ground up to 5","他今天已经教过一次了":"He's already taught once today","卡尔：烂招，就是你最怕用的那一面。……磨掉它。":"Karl: Your worst move is the one you're most afraid to use. ...Grind it off.","告诉他：雷恩回来了":"Tell him: Reyn is back","他的学生，现在是银鹰队的队长":"His student, now captain of the Silver Eagles","*卡尔的手停住了。杯子里的酒晃了一下。*":"*Karl's hand stops. The drink in his glass sways.*","卡尔：……他回来了？":"Karl: ...He's back?","*他把酒推开。推得很远。*":"*He pushes the drink away. Far away.*","卡尔：给我一杯水。":"Karl: Get me a glass of water.","请卡尔入队":"Ask Karl to join","请卡尔入队（他还醉着）":"Ask Karl to join (he's still drunk)","他的钢骰擦亮了":"His steel die is polished now","20 金酒钱。他的骰子有三面烂得像酒渣":"20 gold for drinks. Three of his faces are rotten as dregs","队伍最多四个人":"Four people in the party at most","卡尔：……好。这次，我不收剑。":"Karl: ...Fine. This time, I won't pull my blade.","卡尔：酒钱你出？……行。反正哪里都是喝。":"Karl: You're paying for drinks? ...Fine. I drink wherever.","§卡尔入队了。":"§Karl joined the party.","*一个年轻人推门进来，披风上绣着一只银色的鹰。酒馆里一下子安静了。*":"*A young man pushes the door open, a silver eagle stitched on his cloak. The tavern goes quiet.*","雷恩：一杯水。":"Reyn: A glass of water.","*他看见了角落里的卡尔。他的手停了一下，然后装作什么也没看见。*":"*He sees Karl in the corner. His hand pauses, then he pretends he saw nothing.*","雷恩：你就是那个新来的中间人？我们是银鹰队。深渊口最好的委托，都是我们的。……以后也是。":"Reyn: You're the new middleman? We're the Silver Eagles. The best commissions in Abyssmouth are ours. ...And they'll stay ours.","雷恩：还活着？不错。":"Reyn: Still alive? Not bad.","*雷恩看了一眼卡尔坐过的那张桌子。*":"*Reyn glances at the table where Karl used to sit.*","雷恩：……替我跟老师说，那杯酒，我记着。":"Reyn: ...Tell my master I haven't forgotten that drink.","米洛：啊！客人！不对，你不是来上课的……你是中间人！太好了！":"Milo: Ah! A visitor! Wait, you're not here for class... you're the middleman! Wonderful!","米洛：沉没书库里有一本书，我找了三年。三年！只要两张失落的书页，我就能知道它在哪一层。":"Milo: There's a book in the Sunken Library I've been searching for three years. Three years! With just two lost pages, I'll know which floor it's on.","*他塞给你一张皱巴巴的纸。是书库的通行证，上面盖着法师塔的章。*":"*He presses a crumpled sheet into your hand. A library pass, stamped with the mage tower's seal.*","§沉没书库解锁了。新委托：失落的书页。":"§Sunken Library unlocked. New commission: Lost Pages.","米洛：书页！是书页吗！给我看看！":"Milo: Pages! Are those pages?! Let me see!","米洛：书页……书页……（他在本子上画了第一百个圈）":"Milo: Pages... pages... (he draws his hundredth circle in his notebook)","米洛：那本书说，深渊在往上长。我不信。……我不太信。":"Milo: That book says the abyss is growing upward. I don't believe it. ...I mostly don't believe it.","米洛：缇缇最近会跟我说早上好了！两个字！":"Milo: Titi says good morning to me now! Two whole words!","米洛：就是它！就是它！……我欠你。":"Milo: That's it! That's it! ...I owe you.","米洛：这张书页你拿着，上面的咒文我抄过了。装在骰子上，比你们那个吹牛的战士聪明多了。":"Milo: Keep this page, I've already copied the incantation. Stick it on a die and it's smarter than that bragging warrior of yours.","米洛：还有……塔里有个人，我想让你见见。":"Milo: Also... there's someone in the tower I'd like you to meet.","§得到装备：法术书页。":"§Got equipment: Spell Page.","§米洛把你介绍给了缇缇。":"§Milo introduced you to Titi.","*书架后面有一顶尖帽子。帽子动了一下，缩回去了。*":"*There's a pointed hat behind the bookshelf. The hat moves, then ducks back.*","米洛（小声）：缇缇。塔里最强的学徒。考了四次试，一个字都没说出来过。":"Milo (whispering): Titi. Strongest apprentice in the tower. Took the exam four times and never got a single word out.","*帽子又探出来一点点。*":"*The hat peeks out a tiny bit more.*","缇缇：……你、你好。":"Titi: ...H-hello.","*然后她就不说话了。你等了一会儿，她也没再说话。你没有催她。*":"*Then she says nothing. You wait a while. She still says nothing. You don't rush her.*","缇缇：……你、你又来了。":"Titi: ...Y-you came back.","缇缇：上次……你没有催我。……谢谢。":"Titi: Last time... you didn't rush me. ...Thank you.","缇缇：我、我可以……跟你们下去吗？不、不用说话的那种……":"Titi: C-could I... come down with you? The kind where I d-don't have to talk...","请缇缇入队":"Ask Titi to join","她的水晶骰：两个 0，一个 15。营地里有人教她，0 会一点点变大":"Her crystal die: two 0s and a 15. When someone teaches her at camp, the 0s grow little by little","缇缇：……（用力点头）":"Titi: ...(nods hard)","§缇缇入队了。":"§Titi joined the party.","咕哩：嘿嘿嘿！客人！好客人！咕哩一看就知道，你是个识货的！":"Guli: Heh heh heh! Customer! Good customer! Guli can tell at a glance, you know quality!","咕哩：卡？剑？骰子？咕哩都有！价钱？好商量！咕哩最好商量了！":"Guli: Cards? Swords? Dice? Guli has it all! Price? Very negotiable! Guli is the most negotiable!","咕哩：看这颗金漆骰——想要哪面，就是哪面！下去的时候尽管带，用一次，咕哩只收一点点……二十五金。嘿嘿。":"Guli: Look at this gilded die — whatever face you want, that's the face! Take it down anytime, and each use, Guli only charges a little... twenty-five gold. Heh heh.","咕哩：客人又来啦！今天的「传说之剑」特别传说！":"Guli: Customer's back! Today's \"Legendary Sword\" is extra legendary!","咕哩：咕哩从来不骗人。咕哩只是……记性不好。":"Guli: Guli never cheats. Guli just has... a bad memory.","*咕哩把一张卡藏到了身后，又拿出来，又藏回去。*":"*Guli hides a card behind his back, takes it out, hides it again.*","还咕哩的债":"Pay Guli's debt","咕哩：嘿嘿！好客人！咕哩就喜欢守信用的客人！":"Guli: Heh heh! Good customer! Guli loves customers who pay up!","*小屋的门开着。屋里只有一条龙盘在壁炉边，正用爪尖翻一本很小的书。*":"*The cottage door is open. Inside there's only a dragon curled by the fireplace, turning the pages of a very small book with one claw.*","薇丝佩拉：新房客。……别紧张，我不吃房客。我只收租。":"Vespera: New tenant. ...Relax, I don't eat tenants. I only collect rent.","薇丝佩拉：上一个房客也是个中间人。他讲的故事，是这间屋子里最好听的。……后来他带着妻子下去了，再也没回来。":"Vespera: The last tenant was a middleman too. His stories were the best this house ever heard. ...Then he went down with his wife, and never came back.","*门口，小莱探了探头，又缩了回去。龙的眼睛眯了一下。*":"*In the doorway, Lai peeks in, then ducks back. The dragon's eyes narrow.*","薇丝佩拉：有新故事吗？":"Vespera: Any new stories?","*龙翻了一页书。书在她爪子下面，像一片指甲。*":"*The dragon turns a page. Under her claw, the book is the size of a fingernail.*","薇丝佩拉：……你们找到了那三封信。":"Vespera: ...You found those three letters.","薇丝佩拉：他走之前，在这里讲了最后一个故事。故事里，有一个会追着女儿跑的怪物。我以为那只是一个故事。":"Vespera: Before he left, he told one last story here. In it, there was a monster that chased its own daughter. I thought it was only a story.","在小屋歇一晚":"Rest a night at the cottage","所有受伤的人养好伤":"Everyone wounded recovers","*壁炉很暖。龙的呼吸声很慢，很稳。*":"*The fire is warm. The dragon's breathing is slow and steady.*","§所有人的伤都好了。":"§Everyone's wounds have healed.","给她讲一个故事":"Tell her a story","再讲一个，她也许会给你一样东西":"Tell one more, and she might give you something","一个故事":"a story","薇丝佩拉：……好故事。":"Vespera: ...A good story.","*她从自己身上拔下一片鳞，鳞片在她爪子里变成了一颗骰子。*":"*She plucks a scale from her own hide. In her claw, it becomes a die.*","薇丝佩拉：扔出去的时候，不管掷出什么，都算二十。只有一次。用在你觉得值得的地方。":"Vespera: When you throw it, whatever it shows, it counts twenty. Only once. Use it where you think it's worth it.","§得到：龙鳞骰（整局一次，无论掷出什么都算 20）。":"§Got: Dragon-scale die (once per game, whatever you roll counts 20).","薇丝佩拉：……不错。这个故事，我收下了。":"Vespera: ...Not bad. I'll keep this story.","§这个故事可以抵一次房租。":"§That story can pay one month's rent.","牧师：深渊口的人，最后都会来这里。早来晚来而已。":"Priest: Everyone in Abyssmouth ends up here eventually. Sooner or later.","牧师：我能做的不多。一枚护身符，一次祷告。剩下的，看你们自己。":"Priest: There isn't much I can do. An amulet, a prayer. The rest is up to you.","牧师：他们的骰子，我替你收着。想带下去的时候，就来拿。":"Priest: I'm keeping their dice for you. When you want to take them down, come get them.","牧师：还没有人躺在这里。保持下去。":"Priest: No one's lying here yet. Keep it that way.","*牧师在给一块新墓碑擦灰。墓碑上还没有名字。*":"*The priest is dusting a new headstone. It has no name on it yet.*","买：护身符":"Buy: Amulet","30 金。下一趟远征里，有人本该死的时候，改成重伤":"30 gold. On your next expedition, when someone should die, they're badly hurt instead","已经有一枚了":"You already have one","*牧师把护身符挂在你手上，念了一句很短的祷词。*":"*The priest hangs the amulet on your hand and says a very short prayer.*","§得到：护身符":"§Got: Amulet","20 金。磨掉一面「恐」":"20 gold. Wear off a Fear face","*墓地最深处的树下，站着一个影子。月亮照不到它。*":"*Under the tree at the far end of the graveyard stands a shadow. The moonlight doesn't reach it.*","魔王的影子：中间人。我听说你什么都能换。":"The Demon King's Shadow: Middleman. I hear you can trade anything.","魔王的影子：魔界的土，种不活它了。":"The Demon King's Shadow: The soil of the demon realm can no longer keep it alive.","*它摊开手。手心里是一颗种子，黑色的，在跳，像一颗心。*":"*It opens its hand. In its palm is a seed, black, beating like a heart.*","魔王的影子：你又来了。":"The Demon King's Shadow: You came back.","魔王的影子：价钱永远不是金币。你应该已经知道了。":"The Demon King's Shadow: The price is never gold. You should know that by now.","收下种子":"Take the seed","不要钱。它说你会知道该种在哪里":"Free. It says you'll know where to plant it","魔王的影子：种在对的地方。你会知道是哪里。":"The Demon King's Shadow: Plant it in the right place. You'll know where.","*种子在你手心里跳了一下，又跳了一下。*":"*The seed beats in your palm. Once. Then again.*","§得到：魔王的种子":"§Got: The Demon King's Seed","换：诅咒之刃":"Trade: Cursed Blade","价钱：一个故事。任何检定都算 15；装上时，骰子另一面变成「恐」":"Price: one story. Counts 15 on any check; when fitted, another face on the die turns to Fear","你没有故事可以给它":"You have no story to give it","*你讲了一个故事。影子听完，把它吃了。你再也想不起那个故事是怎么开头的。*":"*You tell a story. The shadow listens, then eats it. You can never again remember how that story began.*","§得到装备：诅咒之刃":"§Got equipment: Cursed Blade","*镇口的石头上坐着一个精灵。她的斗篷沾满了泥，手里捧着一片枯掉的叶子。*":"*An elf sits on a stone by the town gate. Her cloak is caked in mud; she holds a withered leaf in both hands.*","伊兰：……你就是那个中间人？他们说你认识所有人。":"Ilan: ...You're the middleman? They say you know everyone.","伊兰：巨树在死。精灵不能下深渊，可树根在深渊里。我需要一瓶银泉水。……求你。":"Ilan: The great tree is dying. Elves can't go down into the abyss, but the roots are in the abyss. I need a bottle of silverspring water. ...Please.","§巨树之根解锁了。新委托：银泉水。":"§Giant Roots unlocked. New commission: Silverspring Water.","伊兰：银泉水……找到了吗？":"Ilan: The silverspring water... did you find it?","伊兰：树长出了新叶子。一片。……一片也很好。":"Ilan: The tree grew a new leaf. One. ...One is good too.","伊兰：精灵不说谢谢。我们说：我记得你。":"Ilan: Elves don't say thank you. We say: I remember you.","*伊兰捧着那瓶泉水，像捧着什么活的东西。*":"*Ilan holds the bottle of spring water as if it were something alive.*","伊兰：……我记得你。":"Ilan: ...I remember you.","伊兰：这是我的弓。精灵的弓不会射偏。射偏了，也不会伤到自己人。":"Ilan: This is my bow. An elven bow doesn't miss. And when it does, it never hurts its own.","§得到装备：精灵弓。":"§Got equipment: Elven Bow.","酒保：哥布林王？那家伙最怕他妈。他妈住在镇子西边，嗓门能震碎玻璃。你下去喊一声「你妈来了」，试试看。":"Barkeep: The Goblin King? That one's scared to death of his mum. She lives on the west side of town, voice could shatter glass. Go down there and yell \"Your mum's here!\" See what happens.","酒保：沼泽之母怕盐。老矿工下去之前，口袋里都装一把盐。":"Barkeep: The Swamp Mother hates salt. Old miners always carried a handful in their pockets before going down.","酒保：书库里那个幽灵？它只认书。你们翻过的书页越多，它的问题越好答。":"Barkeep: That ghost in the library? It only cares about books. The more pages you've turned, the easier its questions.","酒保：熔岩巨蜥怕冷水。把它引到地下河边，或者找莫娜要冷冻药。":"Barkeep: The Magma Salamander fears cold water. Lure it to an underground stream, or get a freezing draught from Mona.","酒保：守林兽杀不死。苔母说，只有晨露能治它。……也有人说，种下一颗对的种子也行。":"Barkeep: The Forest Guardian can't be killed. The Moss Mother says only morning dew can heal it. ...Some say planting the right seed works too.","酒保：镜之渊？……我只知道一件事：下去的人，都是去找自己的。来时的自己，和现在的自己，谁更强，谁就能回来。":"Barkeep: The Mirror Abyss? ...I only know one thing: everyone who goes down there is looking for themselves. Whoever's stronger — who you were, or who you are — comes back.","§卡尔戒酒了。他的钢骰擦亮了：1、2、3 变成了 3、4、5。":"§Karl quit drinking. His steel die is polished: 1, 2, 3 became 3, 4, 5.","终点":" End","古代锻炉":"Ancient Forge","§这一层有别人的脚印：银鹰队也在这里。他们会抢先拿走宝箱。":"§Someone else's footprints on this floor: the Silver Eagles are here too. They'll grab chests before you.","墓地里的骰子":"a die from the graveyard","§迷路了：队长要掷到 4 以上才走得出去。":"§Lost: the leader has to roll 4 or more to get out.","§掷到「恐」：原地不动。火把照样烧。":"§Rolled Fear: you don't move. The torch still burns.","§火把烧完了。所有检定难度 +2，怕黑的人掷两次取低。":"§The torches are out. Every check +2 difficulty, and anyone afraid of the dark rolls twice and keeps the lower.","*你们转完了第三圈，回到了入口。再往下，就没有路了。*":"*You've finished the third lap and are back at the entrance. Further down, there is no road.*","*你们走进了一个岔路口。每条路看起来都一样。*":"*You walk into a fork. Every path looks the same.*","§迷途角：下次掷骰，队长要掷到 4 以上才走得出去。":"§Lost Junction: next roll, the leader
